name: Ambient Graphics Validation

on:
  push:
    paths:
      - 'src/main/java/com/tndmadman/rts/AmbientSystemRenderer.java'
      - 'src/main/java/com/tndmadman/rts/CelestialSystem.java'
      - 'src/main/java/com/tndmadman/rts/Issue409AmbientEnvironmentValidator.java'
      - 'config/systems/**'
      - 'gradle/issue409-ambient-validation.gradle'
      - '.github/workflows/issue409-ambient-validation.yml'
  pull_request:
    paths:
      - 'src/main/java/com/tndmadman/rts/AmbientSystemRenderer.java'
      - 'src/main/java/com/tndmadman/rts/CelestialSystem.java'
      - 'src/main/java/com/tndmadman/rts/Issue409AmbientEnvironmentValidator.java'
      - 'config/systems/**'
      - 'gradle/issue409-ambient-validation.gradle'
      - '.github/workflows/issue409-ambient-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambient-graphics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ambient-graphics:
    name: Validate issue 409 ambient graphics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run ambient environment validator
        shell: bash
        run: gradle -I gradle/issue409-ambient-validation.gradle validateIssue409AmbientEnvironment --no-daemon --stacktrace
