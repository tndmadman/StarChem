name: Phase 2 Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - tools/phase2_repair.py
      - .github/workflows/phase2-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply Phase 2 repairs
        run: |
          sed -i 's/fixture("NPC Emergency Builder Cargo")/fixture("NPC Emergency Builder Cargo", "red_dwarf")/' tools/phase2_repair.py
          python3 tools/phase2_repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/NpcFactionCapacitySystem.java')
          text = path.read_text(encoding='utf-8')
          old = '''    private static int committedExpeditionFootholds(World world, NpcFaction faction) {
              NpcExpeditionSnapshot snapshot = NpcExpeditionSystem.snapshot(world, faction);
              if (!snapshot.active()) return 0;
              return switch (snapshot.state()) {
                  case ASSEMBLING, LAUNCHING, TRAVELLING, ESTABLISHING -> 1;
                  case ABORTING -> snapshot.builderKey().isBlank() ? 0 : 1;
                  default -> 0;
              };
          }
          '''
          new = '''    private static int committedExpeditionFootholds(World world, NpcFaction faction) {
              NpcExpeditionSnapshot snapshot = NpcExpeditionSystem.snapshot(world, faction);
              if (!snapshot.active()) return 0;
              if (snapshot.state() == NpcExpeditionState.ESTABLISHING
                      && NpcStationConstructionSystem.hasAnyActivePlan(world, faction)) {
                  return 0;
              }
              return switch (snapshot.state()) {
                  case ASSEMBLING, LAUNCHING, TRAVELLING, ESTABLISHING -> 1;
                  case ABORTING -> snapshot.builderKey().isBlank() ? 0 : 1;
                  default -> 0;
              };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('capacity conversion target was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate resource budgeting
        run: gradle -I gradle/ai-validation.gradle validateNpcResourceBudget --quiet --no-daemon

      - name: Validate expeditions
        run: gradle -I gradle/ai-validation.gradle validateNpcExpedition --quiet --no-daemon

      - name: Validate recovery
        run: gradle -I gradle/ai-validation.gradle validateNpcRecovery --quiet --no-daemon

      - name: Validate station construction
        run: gradle -I gradle/ai-validation.gradle validateNpcStationConstruction --quiet --no-daemon

      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/com/tndmadman/rts/NpcResourceBudget.java \
            src/main/java/com/tndmadman/rts/NpcExpeditionSystem.java \
            src/main/java/com/tndmadman/rts/NpcFactionCapacitySystem.java \
            src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java \
            src/main/java/com/tndmadman/rts/NpcRecoverySystem.java \
            src/main/java/com/tndmadman/rts/NpcResourceBudgetValidator.java \
            src/main/java/com/tndmadman/rts/NpcExpeditionValidator.java \
            src/main/java/com/tndmadman/rts/NpcRecoveryValidator.java
          git diff --cached --check
          git commit -m "Fix Phase 2 AI resource lifecycle defects"
          git push origin HEAD:agent/fix-corsair-remote-view
