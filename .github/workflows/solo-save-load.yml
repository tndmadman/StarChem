name: Solo Save Load Validation
on:
  push:
    branches:
      - feature/solo-save-load
  pull_request:
    branches:
      - feature/world-lifecycle-resource-performance-20261021
permissions:
  contents: read
jobs:
  validate-solo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run all checks
        run: gradle clean classes check jar --no-daemon
      - name: Validate solo save/load independently
        run: gradle validateSoloSaveLoad --no-daemon
