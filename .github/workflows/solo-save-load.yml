name: Solo Save Load Validation
on:
  push:
    branches:
      - feature/solo-save-load
      - integration/four-plus-orbital-radar-20261106
      - integration/four-plus-radar-plus-multiplayer-stability-20261107
  pull_request:
    branches:
      - feature/world-lifecycle-resource-performance-20261021
      - main
permissions:
  contents: read
jobs:
  validate-solo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run all checks
        run: gradle clean classes check jar --no-daemon
      - name: Validate solo save/load independently
        run: gradle validateSoloSaveLoad --no-daemon
      - name: Measure supported 20- and 64-system save/load
        run: gradle benchmarkSoloSaveLoad --no-daemon
        timeout-minutes: 12
