name: Sync v1.4.0 release notes

on:
  push:
    branches:
      - main
    paths:
      - 'RELEASE_NOTES.md'

permissions:
  contents: write

jobs:
  sync-release-notes:
    name: Update published v1.4.0 release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrected release notes
        uses: actions/checkout@v4

      - name: Validate release-note version
        shell: bash
        run: |
          set -euo pipefail
          first_line="$(head -n 1 RELEASE_NOTES.md | tr -d '\r')"
          [[ "$first_line" == '# StarChem v1.4.0' ]]

      - name: Update and verify GitHub Release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.4.0 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
          gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > published-release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          expected = Path('RELEASE_NOTES.md').read_text(encoding='utf-8').replace('\r\n', '\n').rstrip() + '\n'
          actual = Path('published-release-notes.md').read_text(encoding='utf-8').replace('\r\n', '\n').rstrip() + '\n'
          if actual != expected:
              raise SystemExit('Published v1.4.0 release body does not match RELEASE_NOTES.md')
          print('Published v1.4.0 release notes verified.')
          PY
