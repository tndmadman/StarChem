name: Release StarChem

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  jar-release:
    name: Build StarChem release zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: gradle clean jar

      - name: Stage release files
        run: |
          mkdir -p release/StarChem
          cp build/libs/starchem-0.1.0.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/run-starchem.bat release/StarChem/run-starchem.bat
          cd release
          zip -r StarChem-${GITHUB_REF_NAME}.zip StarChem
          cd ..
          cp release/StarChem-${GITHUB_REF_NAME}.zip .
          echo "RELEASE_ZIP=StarChem-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChem-release
          path: ${{ env.RELEASE_ZIP }}
