name: Release StarChem

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar-release:
    name: Build StarChem release zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve build metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(gradle -q printVersion)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid StarChem version: $VERSION" >&2
            exit 1
          fi
          echo "STARCHEM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STARCHEM_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Verify and build jar
        run: gradle clean check jar --no-daemon -PreleaseVersion="$STARCHEM_VERSION" -PbuildCommit="$STARCHEM_COMMIT"

      - name: Smoke-test release jar
        shell: bash
        run: |
          test -f build/libs/StarChem.jar
          VERSION_OUTPUT="$(java -jar build/libs/StarChem.jar --version)"
          echo "$VERSION_OUTPUT"
          [[ "$VERSION_OUTPUT" == "StarChem ${STARCHEM_VERSION}"* ]]
          java -jar build/libs/StarChem.jar --help | grep -Fq -- '--server [PORT]'
          jar tf build/libs/StarChem.jar | grep -Fx 'META-INF/LICENSE'
          jar tf build/libs/StarChem.jar | grep -Fx 'META-INF/THIRD_PARTY_NOTICES.md'

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release/StarChem
          cp build/libs/StarChem.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/run-starchem.bat release/StarChem/run-starchem.bat
          cp packaging/run-starchem.sh release/StarChem/run-starchem.sh
          cp packaging/run-starchem-server.sh release/StarChem/run-starchem-server.sh
          chmod +x release/StarChem/run-starchem.sh release/StarChem/run-starchem-server.sh
          cp README.md release/StarChem/README.md
          cp LICENSE release/StarChem/LICENSE
          cp THIRD_PARTY_NOTICES.md release/StarChem/THIRD_PARTY_NOTICES.md

          test -s release/StarChem/LICENSE
          test -s release/StarChem/THIRD_PARTY_NOTICES.md
          test -x release/StarChem/run-starchem.sh
          test -x release/StarChem/run-starchem-server.sh
          grep -Fq 'STARCHEM PROPRIETARY SOFTWARE LICENSE' release/StarChem/LICENSE
          grep -Fq 'StarChem is proprietary software.' release/StarChem/README.md

          mapfile -t TOP_LEVEL_FILES < <(find release/StarChem -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t TOP_LEVEL_DIRS < <(find release/StarChem -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          [[ "${TOP_LEVEL_FILES[*]}" == "LICENSE README.md StarChem.jar THIRD_PARTY_NOTICES.md run-starchem-server.sh run-starchem.bat run-starchem.sh" ]]
          [[ "${TOP_LEVEL_DIRS[*]}" == "config" ]]

          cd release
          zip -r "StarChem-${GITHUB_REF_NAME}.zip" StarChem
          cd ..
          cp "release/StarChem-${GITHUB_REF_NAME}.zip" .
          echo "RELEASE_ZIP=StarChem-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChem-release
          path: ${{ env.RELEASE_ZIP }}

      - name: Attach compiled zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StarChem ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_ZIP }}
