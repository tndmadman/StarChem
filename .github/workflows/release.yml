name: Release StarChem

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar-release:
    name: Build StarChem release zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify and build jar
        run: gradle clean check jar --no-daemon

      - name: Stage release files
        run: |
          mkdir -p release/StarChem
          cp build/libs/starchem-0.1.0.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/*.bat release/StarChem/
          cd release
          zip -r StarChem-${GITHUB_REF_NAME}.zip StarChem
          cd ..
          cp release/StarChem-${GITHUB_REF_NAME}.zip .
          echo "RELEASE_ZIP=StarChem-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChem-release
          path: ${{ env.RELEASE_ZIP }}

      - name: Attach compiled zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ZIP }}
