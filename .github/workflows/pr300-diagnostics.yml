name: PR 300 diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 300
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run verification and capture output
        id: verify
        shell: bash
        run: |
          set +e
          gradle clean check jar --no-daemon > pr300-diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr300-diagnostic
          path: pr300-diagnostic.log
          if-no-files-found: error
      - name: Preserve result
        shell: bash
        run: exit "${{ steps.verify.outputs.status }}"
