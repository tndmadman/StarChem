name: Issue 290 One Shot Apply

on:
  push:
    branches: [ agent/issue-290-control-groups ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-290-control-groups
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply final fleet sync wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {n}')
              p.write_text(text.replace(old, new, count))

          p='src/main/java/com/tndmadman/rts/PeerServerSide.java'
          old='''            String message = GalaxyMapWire.encode(config.galaxyCopies,
                      views.galaxySnapshot(world, peer.playerId()));'''.replace('          ','')
          new='''            String message = GalaxyMapWire.encode(config.galaxyCopies,
                      views.galaxySnapshot(world, peer.playerId()),
                      OwnerFleetLocations.capture(world, peer.playerId()));'''.replace('          ','')
          patch(p, old, new)
          old='''        String message = GalaxyMapWire.encode(config.galaxyCopies,
                  views.galaxySnapshot(world, peer.playerId()));'''.replace('          ','')
          new='''        String message = GalaxyMapWire.encode(config.galaxyCopies,
                  views.galaxySnapshot(world, peer.playerId()),
                  OwnerFleetLocations.capture(world, peer.playerId()));'''.replace('          ','')
          patch(p, old, new)

          p='src/main/java/com/tndmadman/rts/PeerClientSide.java'
          old='''    private boolean readGalaxy(String message) {
              if (message == null || !message.startsWith("GALAXY|")) return false;
              GalaxyMapWire.Decoded decoded = GalaxyMapWire.decode(message);
              world.configureGalaxyCopies(decoded.copiesPerTemplate());
              world.applyRemoteGalaxyMapSnapshot(decoded.snapshot());
              return true;
          }'''.replace('          ','')
          new='''    private boolean readGalaxy(String message) {
              if (message == null || !message.startsWith("GALAXY|")) return false;
              GalaxyMapWire.Decoded decoded = GalaxyMapWire.decode(message);
              world.configureGalaxyCopies(decoded.copiesPerTemplate());
              world.applyRemoteGalaxyMapSnapshot(decoded.snapshot());
              OwnerFleetLocationRegistry.replace(world, localPlayerId, decoded.ownerUnitLocations());
              return true;
          }'''.replace('          ','')
          patch(p, old, new)

          p='src/main/java/com/tndmadman/rts/BPackets.java'
          old='''        if (p[0].equals("OWNER_FLEET")) {
              OwnerFleetLocationRegistry.replace(c.world, c.localPlayerId(), OwnerFleetLocationWire.decode(message));
              return;
          }
'''.replace('          ','')
          patch(p, old, '')

          p='src/main/java/com/tndmadman/rts/RefitQuotePersistenceValidator.java'
          patch(p, 'MultiplayerCompatibility.PROTOCOL_VERSION == 13', 'MultiplayerCompatibility.PROTOCOL_VERSION == 14')

          p='src/main/java/com/tndmadman/rts/WorldRuntimeCleanup.java'
          patch(p, '        AlertCenter.clear(world);\n', '        AlertCenter.clear(world);\n        OwnerFleetLocationRegistry.clear(world);\n')
          PY

          cat > src/main/java/com/tndmadman/rts/ControlGroupValidator.java <<'JAVA'
          package com.tndmadman.rts;

          import java.awt.event.KeyEvent;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public final class ControlGroupValidator {
              private ControlGroupValidator() { }

              public static void main(String[] args) {
                  validateGroupEditingAndRecall();
                  validateDoubleTapAndKeyMapping();
                  validateOwnerFleetGalaxyWireAndIsolation();
                  validateStableKeysAcrossSystems();
                  System.out.println("Control group validation passed.");
              }

              private static void validateGroupEditingAndRecall() {
                  ControlGroupManager groups = new ControlGroupManager();
                  groups.assign(1, Set.of("P1:1", "P1:2"), FleetFormation.LINE);
                  require(groups.size(1) == 2, "assignment did not retain both units");
                  require(groups.formation(1) == FleetFormation.LINE, "assignment did not retain formation");
                  groups.add(1, Set.of("P1:2", "P1:3"));
                  require(groups.size(1) == 3, "add did not de-duplicate group membership");
                  groups.remove(1, Set.of("P1:2"));
                  require(groups.size(1) == 2 && !groups.contains(1, "P1:2"), "remove did not update membership");
                  Map<String,String> locations = Map.of("P1:1", "ALPHA", "P1:3", "BETA");
                  ControlGroupManager.GroupView view = groups.view(1, "ALPHA", locations);
                  require(view.livingShips() == 2 && view.systemCount() == 2 && view.shipsInActiveSystem() == 1,
                          "split-system group counts are wrong");
                  require("ALPHA".equals(groups.focusSystem(1, "ALPHA", locations)), "equal split did not prefer current system");
                  groups.markActive(1, "BETA");
                  require("BETA".equals(groups.focusSystem(1, "GAMMA", locations)), "equal split did not retain preferred system");
                  require(groups.rememberFormationIfSelectionMatches(Set.of("P1:3"), "BETA", locations, FleetFormation.WEDGE),
                          "recalled selection did not update group formation");
                  require(groups.formation(1) == FleetFormation.WEDGE, "updated formation was not retained");
                  groups.prune(Map.of("P1:3", "BETA"));
                  require(groups.size(1) == 1 && groups.contains(1, "P1:3"), "destroyed unit was not pruned");
                  groups.clear(1);
                  require(groups.empty(1), "group clear failed");
              }

              private static void validateDoubleTapAndKeyMapping() {
                  ControlGroupManager groups = new ControlGroupManager();
                  long start = 10_000_000_000L;
                  require(!groups.registerTap(4, start), "first tap was treated as a double tap");
                  require(groups.registerTap(4, start + ControlGroupManager.DOUBLE_TAP_NANOS - 1), "second tap was not detected");
                  require(!groups.registerTap(4, start + ControlGroupManager.DOUBLE_TAP_NANOS * 2), "completed tap was reused");
                  require(ControlGroupManager.numberForKeyCode(KeyEvent.VK_0) == 0, "top-row zero mapping failed");
                  require(ControlGroupManager.numberForKeyCode(KeyEvent.VK_9) == 9, "top-row nine mapping failed");
                  require(ControlGroupManager.numberForKeyCode(KeyEvent.VK_NUMPAD3) == 3, "numpad mapping failed");
                  require(ControlGroupManager.numberForKeyCode(KeyEvent.VK_A) < 0, "non-number key mapped to a group");
              }

              private static void validateOwnerFleetGalaxyWireAndIsolation() {
                  Map<String,String> source = Map.of("P1:17", "HOME_P1", "P1:22", "BELT_2");
                  String packet = GalaxyMapWire.encode(1, new GalaxyMapSnapshot("ALPHA", List.of(), List.of()), source);
                  GalaxyMapWire.Decoded decoded = GalaxyMapWire.decode(packet);
                  require(source.equals(decoded.ownerUnitLocations()), "owner fleet galaxy round-trip failed");
                  World world = new World("Control Group Validator");
                  OwnerFleetLocationRegistry.replace(world, "P1", decoded.ownerUnitLocations());
                  require(source.equals(OwnerFleetLocationRegistry.state(world).locations()), "owner fleet registry did not retain state");
                  expectFailure(() -> OwnerFleetLocationRegistry.replace(world, "P1", Map.of("P2:9", "BELT_2")),
                          "foreign owner fleet key was accepted");
                  String row = Arrays.stream(packet.split("\\|"))
                          .filter(value -> value.startsWith("F,"))
                          .findFirst().orElseThrow();
                  expectFailure(() -> GalaxyMapWire.decode(packet + "|" + row), "duplicate owner fleet galaxy row was accepted");
              }

              private static void validateStableKeysAcrossSystems() {
                  World world = new World("Control Group Projection Validator");
                  String owner = "SOLO";
                  Unit starting = world.units.values().stream().filter(unit -> owner.equals(unit.playerId)).findFirst().orElseThrow();
                  String key = starting.key();
                  String before = world.activeSystemId();
                  Map<String,String> initial = OwnerFleetLocations.capture(world, owner);
                  require(before.equals(world.activeSystemId()), "owner fleet projection changed the active system");
                  require(before.equals(initial.get(key)), "initial owner fleet projection missed the starting ship");
                  String target = world.authoritativeGalaxyMapSnapshot().systems().stream()
                          .map(GalaxyMapSystem::id).filter(id -> !id.equals(world.activeSystemId())).findFirst().orElseThrow();
                  world.movePlayerAssetsToSystem(owner, target);
                  Map<String,String> moved = OwnerFleetLocations.capture(world, owner);
                  require(target.equals(moved.get(key)), "stable unit key did not follow the ship to its new system");
              }

              private static void expectFailure(Runnable action, String message) {
                  boolean failed = false;
                  try { action.run(); } catch (RuntimeException ex) { failed = true; }
                  require(failed, message);
              }

              private static void require(boolean condition, String message) {
                  if (!condition) throw new IllegalStateException("Control group validation failed: " + message);
              }
          }
          JAVA

          rm -f src/main/java/com/tndmadman/rts/OwnerFleetLocationSync.java
          rm -f src/main/java/com/tndmadman/rts/OwnerFleetLocationWire.java
          rm -f .github/workflows/issue290-apply.yml

          git diff --check
          gradle classes --no-daemon
          java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupValidator
          java -cp build/classes/java/main com.tndmadman.rts.GalaxyMapWireValidator
          java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ServerDevCommandValidator

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Piggyback control-group fleet state on galaxy sync"
          git push origin HEAD:agent/issue-290-control-groups
