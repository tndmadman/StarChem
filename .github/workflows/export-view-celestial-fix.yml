name: Apply view and celestial fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/tcp-network-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          cat .view-fix-patch/part* > /tmp/payload.b64
          echo "582595f9df2f276d8d1e3720d07c02b0c0428c33175f4ec5bcbc624ce2b60124  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 | gzip -d > /tmp/changes.patch
          echo "bdb36d75f7615ad213630d946677d7a6320e72e6b668de919e4db52cee5f8c29  /tmp/changes.patch" | sha256sum -c -
          git apply --check /tmp/changes.patch
          git apply /tmp/changes.patch
          rm -rf .view-fix-patch
          git diff --check
          if git status --short .github/workflows | grep -q .; then
            echo "Workflow files unexpectedly changed in the code push."
            git status --short .github/workflows
            exit 1
          fi

      - name: Validate exact final tree
        run: gradle clean check jar --no-daemon

      - name: Commit final implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remote views and celestial continuity"
          git push origin HEAD:${{ github.head_ref }}
