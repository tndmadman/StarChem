name: Game Swing White Frame Validation

on:
  push:
    branches:
      - agent/remove-white-ui-frames
    paths:
      - 'src/main/java/com/tndmadman/rts/GameSwingUi.java'
      - 'src/main/java/com/tndmadman/rts/GameSwingWhiteFrameValidator.java'
      - '.github/workflows/game-swing-white-frame-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/GameSwingUi.java'
      - 'src/main/java/com/tndmadman/rts/GameSwingWhiteFrameValidator.java'
      - '.github/workflows/game-swing-white-frame-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile project
        run: gradle classes --no-daemon

      - name: Validate rendered scrollbar and tooltip pixels
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.GameSwingWhiteFrameValidator
