name: Apply issue 199 fix

on:
  push:
    branches:
      - agent/persist-pruned-state-199
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/persist-pruned-state-199')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persist-pruned-state-199
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source changes
        run: python3 .github/agent/apply_issue_199.py
      - name: Verify fix
        id: verify
        continue-on-error: true
        run: ./gradlew check 2>&1 | tee issue-199-check.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-199-check
          path: issue-199-check.log
      - name: Commit verified changes
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name "starchem-ai-fix-bot"
          git config user.email "starchem-ai-fix-bot@users.noreply.github.com"
          git add build.gradle src/main/java/com/tndmadman/rts/ServerAdministration.java src/main/java/com/tndmadman/rts/ServerCommandExtensions.java src/main/java/com/tndmadman/rts/HeadlessGameServer.java src/main/java/com/tndmadman/rts/ServerPruneTransaction.java src/main/java/com/tndmadman/rts/ServerPruneTransactionValidator.java
          git commit -m "Persist pruned galaxy state before success"
          git push
      - name: Fail unverified patch
        if: steps.verify.outcome != 'success'
        run: exit 1
