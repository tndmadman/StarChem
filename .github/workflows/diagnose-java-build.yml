name: Diagnose Java build

on:
  pull_request:
    branches:
      - main
    types:
      - edited

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-dev-session-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Capture Gradle build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace --info > build.log 2>&1
          echo $? > build-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: java-build-diagnostic
          path: |
            build.log
            build-status.txt
          retention-days: 1
