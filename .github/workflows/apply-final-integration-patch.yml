name: Apply final integration completion

on:
  push:
    branches:
      - integration/starchem-functional-2026-08-27
    paths:
      - '.integration/final-patch/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact validated completion patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/starchem-functional-2026-08-27
          fetch-depth: 0

      - name: Verify, apply, and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='46bae3a87dcf2924a55f763662ae372fe5d12d48'
          EXTRA="$(git diff --name-only "$EXPECTED_BASE"..HEAD | grep -Ev '^(\.integration/final-patch/|\.github/workflows/apply-final-integration-patch\.yml$)' || true)"
          if [ -n "$EXTRA" ]; then
            echo 'Unexpected source changes since expected base:'
            echo "$EXTRA"
            exit 1
          fi
          cat .integration/final-patch/b64-* > /tmp/starchem-finish.patch.gz.b64
          echo 'c9da026311021624e46a30c403a7ddff95d025be9dc8cfd13130b089ff4a141c  /tmp/starchem-finish.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/starchem-finish.patch.gz.b64 > /tmp/starchem-finish.patch.gz
          echo '894868637cc9aef0728ec688bb3164facf72d8973fb0ef90e93bdebde43b40be  /tmp/starchem-finish.patch.gz' | sha256sum -c -
          gzip -dc /tmp/starchem-finish.patch.gz > /tmp/starchem-finish.patch
          echo 'e88d7dd93125db9934985372590a47bd9a1fd81e4f535b8a8ad6bd73d64d8568  /tmp/starchem-finish.patch' | sha256sum -c -
          git apply --check /tmp/starchem-finish.patch
          git apply /tmp/starchem-finish.patch
          git rm -r .integration/final-patch .github/workflows/apply-final-integration-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish dynamic galaxy events acceptance and integration'
          git push origin HEAD:integration/starchem-functional-2026-08-27
