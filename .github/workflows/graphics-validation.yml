name: Graphics Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-graphics:
    name: Validate issue 407 graphics vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile graphics validation target
        run: gradle clean classes --no-daemon

      - name: Compare legacy and vertical-slice renderer
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/classes/java/main \
            com.tndmadman.rts.Issue407GraphicsBenchmark | tee issue407-graphics-benchmark.log
          grep -Fq 'ISSUE407_GRAPHICS ' issue407-graphics-benchmark.log

      - name: Archive graphics benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue407-graphics-benchmark-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: issue407-graphics-benchmark.log
