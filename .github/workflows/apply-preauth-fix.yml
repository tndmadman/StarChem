name: Apply pre-authentication transport fix

on:
  push:
    branches:
      - agent/preauth-connection-limits
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/preauth-connection-limits

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused source edits
        run: python3 tools/apply_pre_auth_transport_fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Run full verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean check jar --no-daemon 2>&1 | tee .github/preauth-validation.log

      - name: Commit verification failure log
        if: steps.verify.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/preauth-validation.log
          git commit -m "Record pre-authentication validation failure"
          git push origin HEAD:agent/preauth-connection-limits

      - name: Stop after failed verification
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Commit verified source edits
        if: steps.verify.outcome == 'success'
        run: |
          rm -f .github/preauth-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/PeerTransport.java src/main/java/com/tndmadman/rts/NetworkSecurityValidator.java
          git commit -m "Bound pre-authentication connections"
          git push origin HEAD:agent/preauth-connection-limits
