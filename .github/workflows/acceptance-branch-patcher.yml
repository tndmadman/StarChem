name: Acceptance Branch Patcher

on:
  push:
    branches:
      - finish/2026-09-10-acceptance-gaps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/2026-09-10-acceptance-gaps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply acceptance patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # #380: restore the fleet lifecycle hooks that were present on the original issue branch.
          p = Path('src/main/java/com/tndmadman/rts/World.java')
          text = p.read_text()
          text = text.replace(
              '        out.put("logisticsRoutes", LogisticsRouteSystem.capture(this));\n        out.put("npcFactions", captureNpcFactionRuntimes());',
              '        out.put("logisticsRoutes", LogisticsRouteSystem.capture(this));\n        out.put("fleets", FleetManager.capture(this));\n        out.put("npcFactions", captureNpcFactionRuntimes());')
          text = text.replace(
              '        LogisticsRouteSystem.restore(this, data.get("logisticsRoutes"));\n        restoreNpcFactionRuntimes(data.get("npcFactions"));',
              '        LogisticsRouteSystem.restore(this, data.get("logisticsRoutes"));\n        FleetManager.restore(this, data.get("fleets"));\n        restoreNpcFactionRuntimes(data.get("npcFactions"));')
          text = text.replace(
              '        LogisticsRouteSystem.removePlayer(this, playerId);\n        Set<String> deleted = galaxy.removePlayerAndPruneEmptySystems(this, playerId);',
              '        LogisticsRouteSystem.removePlayer(this, playerId);\n        FleetManager.removeOwner(this, playerId);\n        Set<String> deleted = galaxy.removePlayerAndPruneEmptySystems(this, playerId);')
          text = text.replace(
              'private void setSystemSeed(long seed) { systemSeed = seed; systemTime = 0; random = new Random(seed); proceduralInactiveScheduler.reset(); clearNpcAiRuntimeState(); SimulationCadence.clear(this); LogisticsRouteSystem.clear(this); remoteGalaxyMapSnapshot = null; celestials = galaxy.rebuild(this, starSystem, seed); }',
              'private void setSystemSeed(long seed) { systemSeed = seed; systemTime = 0; random = new Random(seed); proceduralInactiveScheduler.reset(); clearNpcAiRuntimeState(); FleetManager.clear(this); SimulationCadence.clear(this); LogisticsRouteSystem.clear(this); remoteGalaxyMapSnapshot = null; celestials = galaxy.rebuild(this, starSystem, seed); }')
          text = text.replace(
              'if (unit.hp <= 0) { UnitCommandQueueSystem.remove(this, unit.key()); dropLoot(unit); explodeUnit(unit); unitIt.remove(); }',
              'if (unit.hp <= 0) { UnitCommandQueueSystem.remove(this, unit.key()); FleetManager.removeUnit(this, unit.key()); dropLoot(unit); explodeUnit(unit); unitIt.remove(); }')
          for required in [
              'out.put("fleets", FleetManager.capture(this));',
              'FleetManager.restore(this, data.get("fleets"));',
              'FleetManager.removeOwner(this, playerId);',
              'FleetManager.clear(this);',
              'FleetManager.removeUnit(this, unit.key());']:
              if required not in text:
                  raise SystemExit('World fleet lifecycle patch failed: ' + required)
          p.write_text(text)

          # Use the server-projected owner location registry on clients so cross-system fleet
          # membership and counts remain correct without exposing enemy locations.
          p = Path('src/main/java/com/tndmadman/rts/FleetSystem.java')
          text = p.read_text()
          text = text.replace('world.ownerUnitLocations(', 'FleetWire.ownerLocations(world, ')
          p.write_text(text)

          # Intercept fleet frames before the legacy unbounded command split.
          edit('src/main/java/com/tndmadman/rts/PacketSideA.java',
               '            if (MultiplayerComms.handleServer(s, message, packet)) return;\n            String[] p = message == null ? new String[0] : message.split("\\\\|", -1);',
               '            if (MultiplayerComms.handleServer(s, message, packet)) return;\n            if (FleetWire.handleServer(s, message, packet)) return;\n            String[] p = message == null ? new String[0] : message.split("\\\\|", -1);')

          # Consume bounded owner-scoped fleet state/results before the generic client split.
          edit('src/main/java/com/tndmadman/rts/BPackets.java',
               '        if (MultiplayerComms.acceptClientPacket(c, message)) return;\n        if (BRoute0.apply(c, message)) return;',
               '        if (MultiplayerComms.acceptClientPacket(c, message)) return;\n        if (FleetWire.acceptClientPacket(c, message)) return;\n        if (BRoute0.apply(c, message)) return;')

          # Add the actual client sender through the normal authenticated/ordered command path.
          edit('src/main/java/com/tndmadman/rts/PeerClientSide.java',
               '    void devSetFreeCrafting(String playerId, boolean enabled) { sendCommandToServer("DEVFREE|" + cleanPacketPart(playerId) + "|" + (enabled ? "1" : "0")); }',
               '    void fleet(String packet) { if (packet != null && packet.startsWith("FLEET|") && packet.length() <= 16 * 1024) sendCommandToServer(packet); }\n    void devSetFreeCrafting(String playerId, boolean enabled) { sendCommandToServer("DEVFREE|" + cleanPacketPart(playerId) + "|" + (enabled ? "1" : "0")); }')

          # Expose one fleet command entry on PeerNetwork; host and client both preserve authority.
          edit('src/main/java/com/tndmadman/rts/PeerNetworkFacade.java',
               '    void viewSystem(String playerId, String targetSystemId) {',
               '    void fleet(String packet) {\n        if (server != null) {\n            FleetWire.Outcome outcome = FleetWire.applyLocal(server.world, localPlayerId(), packet);\n            if (outcome.mutated()) server.broadcastNow();\n        } else if (client != null) client.fleet(packet);\n    }\n\n    void viewSystem(String playerId, String targetSystemId) {')

          # Reconnect/initial sync sends only the authenticated player\'s fleet projection,
          # after GALAXY has established the owner location registry on the client.
          edit('src/main/java/com/tndmadman/rts/PeerServerSide.java',
               '        sendLeaderboard(peer);\n        sendGalaxy(peer);\n    }',
               '        sendLeaderboard(peer);\n        sendGalaxy(peer);\n        if (!ObserverSessions.isObserver(world, peer.playerId())) {\n            try { transport.sendOrdered(FleetWire.statePacket(world, peer.playerId()), peer.connectionId()); }\n            catch (RuntimeException ex) { transport.recordMalformedPacket(); }\n        }\n    }')

          # Strategic Fleet UI: clients now issue authenticated server commands instead of being disabled.
          p = Path('src/main/java/com/tndmadman/rts/StrategicCommandCenter.java')
          text = p.read_text()
          text = text.replace(
              '            addMutation(actions, "Rename", this::rename);',
              '            addMutation(actions, "Create", this::create);\n            addMutation(actions, "Rename", this::rename);\n            addMutation(actions, "Attach", this::attach);\n            addMutation(actions, "Disband", this::disband);')
          text = text.replace(
              '            for (JButton button : mutationButtons) button.setEnabled(authoritative);\n            if (!authoritative) for (JButton button : mutationButtons)\n                button.setToolTipText("Fleet mutations are host-authoritative; multiplayer client transport is not exposed by this build.");',
              '            for (JButton button : mutationButtons) button.setEnabled(canMutate());\n            if (!authoritative) for (JButton button : mutationButtons)\n                button.setToolTipText("Fleet changes are sent to the authenticated host and applied only after server ownership/revision checks.");')
          text = text.replace(
              '            refresh.addActionListener(event -> refresh());',
              '            refresh.addActionListener(event -> { if (!authoritative && network != null && network.clientReady()) request("SYNC"); else refresh(); });', 1)
          text = text.replace(
              '            state.setText(model.size() + " persistent fleet" + (model.size() == 1 ? "" : "s")\n                    + (authoritative ? " • authoritative" : " • client view / mutations disabled"));',
              '            for (JButton button : mutationButtons) button.setEnabled(canMutate());\n            state.setText(model.size() + " persistent fleet" + (model.size() == 1 ? "" : "s")\n                    + (authoritative ? " • authoritative" : canMutate() ? " • server-authoritative client" : " • reconnecting/read-only"));')
          text = text.replace(
              '                detail.setText(authoritative\n                        ? "No persistent fleets exist for this player. Fleet creation remains driven by the existing fleet backend/API."\n                        : "No persistent fleet state is available in this client world. Mutations stay disabled rather than bypassing host authority.");',
              '                detail.setText("No persistent fleets exist for this player. Use Create to form one from owned, unassigned ships.");')
          marker = '        private void rename() {'
          methods = '''        private boolean canMutate() {\n            return authoritative || network != null && network.clientReady() && !network.clientObserver();\n        }\n\n        private void create() {\n            LinkedHashSet<String> available = new LinkedHashSet<>();\n            for (String key : FleetWire.ownerLocations(world, ownerId).keySet())\n                if (FleetManager.fleetIdForUnit(world, key) == 0) available.add(key);\n            if (available.isEmpty()) { world.status = "No unassigned owned ships are available."; return; }\n            String name = JOptionPane.showInputDialog(this, "Fleet name", "New Fleet");\n            if (name == null) return;\n            String members = JOptionPane.showInputDialog(this,\n                    "Member keys (comma-separated)\\nAvailable: " + String.join(", ", available), String.join(", ", available));\n            if (members == null) return;\n            request("CREATE", name, String.join(",", parseMembers(members)));\n        }\n\n        private void attach() {\n            FleetUiRow row = selected(); if (row == null) return;\n            LinkedHashSet<String> available = new LinkedHashSet<>();\n            for (String key : FleetWire.ownerLocations(world, ownerId).keySet())\n                if (FleetManager.fleetIdForUnit(world, key) == 0) available.add(key);\n            if (available.isEmpty()) { world.status = "No unassigned owned ships are available."; return; }\n            String members = JOptionPane.showInputDialog(this,\n                    "Member keys to attach (comma-separated)\\nAvailable: " + String.join(", ", available), "");\n            if (members == null) return;\n            request("ADD", row.fleetId(), row.revision(), String.join(",", parseMembers(members)));\n        }\n\n        private void disband() {\n            FleetUiRow row = selected(); if (row == null) return;\n            if (JOptionPane.showConfirmDialog(this, "Disband " + row.name() + "? Ships remain intact.",\n                    "Disband Fleet", JOptionPane.OK_CANCEL_OPTION) != JOptionPane.OK_OPTION) return;\n            request("DISBAND", row.fleetId(), row.revision());\n        }\n\n'''
          if methods not in text:
              if marker not in text: raise SystemExit('StrategicCommandCenter method anchor missing')
              text = text.replace(marker, methods + marker, 1)
          text = text.replace(
              '            apply(FleetManager.rename(world, ownerId, row.fleetId(), row.revision(), name), "rename");',
              '            request("RENAME", row.fleetId(), row.revision(), name);')
          text = text.replace(
              '            apply(FleetManager.setFormation(world, ownerId, row.fleetId(), row.revision(), selected), "formation");',
              '            request("FORMATION", row.fleetId(), row.revision(), selected.name());')
          text = text.replace(
              '            FleetCommandResult result = FleetAuthorityService.applyCombatPolicy(world, ownerId, row.fleetId(), row.revision(),\n                    (CombatStance)stance.getSelectedItem(), (TargetPriorityPolicy)priority.getSelectedItem());\n            commandResult(result);',
              '            request("POLICY", row.fleetId(), row.revision(),\n                    ((CombatStance)stance.getSelectedItem()).name(), ((TargetPriorityPolicy)priority.getSelectedItem()).name());')
          text = text.replace(
              '            commandResult(FleetAuthorityService.moveToSystem(world, ownerId, row.fleetId(), row.revision(), destination.id()));',
              '            request("MOVE", row.fleetId(), row.revision(), destination.id());')
          text = text.replace(
              '            commandResult(FleetAuthorityService.rally(world, ownerId, row.fleetId(), row.revision(), destination.id(),\n                    world.width * 0.5, world.height * 0.5));',
              '            request("RALLY", row.fleetId(), row.revision(), destination.id(), world.width * 0.5, world.height * 0.5);')
          text = text.replace(
              '            apply(FleetManager.merge(world, ownerId, target.fleetId(), source.fleetId(), target.revision(), source.revision()), "merge");',
              '            request("MERGE", target.fleetId(), source.fleetId(), target.revision(), source.revision());')
          text = text.replace(
              '            FleetCreateResult result = FleetManager.split(world, ownerId, source.fleetId(), source.revision(), name, parseMembers(members));\n            world.status = result.result() == FleetMutationResult.APPLIED ? "Fleet split created #" + result.fleetId() + "." : "Fleet split rejected: " + result.result();\n            refresh();',
              '            request("SPLIT", source.fleetId(), source.revision(), name, String.join(",", parseMembers(members)));')
          text = text.replace(
              '            apply(FleetManager.removeMembers(world, ownerId, source.fleetId(), source.revision(), parseMembers(members)), "detach");',
              '            request("DETACH", source.fleetId(), source.revision(), String.join(",", parseMembers(members)));')
          request_anchor = '        private Set<String> parseMembers(String text) {'
          request_method = '''        private void request(String action, Object... values) {\n            if (!canMutate()) { world.status = "Fleet command unavailable while reconnecting or in observer mode."; refresh(); return; }\n            String packet = FleetWire.command(ownerId, action, values);\n            if (network != null) network.fleet(packet);\n            else FleetWire.applyLocal(world, ownerId, packet);\n            refresh();\n        }\n\n'''
          if request_method not in text:
              if request_anchor not in text: raise SystemExit('StrategicCommandCenter request anchor missing')
              text = text.replace(request_anchor, request_method + request_anchor, 1)
          required = ['request("CREATE"', 'request("MOVE"', 'request("RALLY"', 'network.fleet(packet)', 'server-authoritative client']
          for item in required:
              if item not in text: raise SystemExit('StrategicCommandCenter patch failed: ' + item)
          p.write_text(text)

          # Galaxy Map now exposes actual player fleet entities by system, without enemy fleet leakage.
          p = Path('src/main/java/com/tndmadman/rts/GalaxyMapOverlay.java')
          text = p.read_text()
          text = text.replace(
              '        Map<String,List<GalaxyEventView>> eventsBySystem = discoveredEventsBySystem();',
              '        Map<String,List<GalaxyEventView>> eventsBySystem = discoveredEventsBySystem();\n        Map<String,Integer> fleetsBySystem = localFleetCounts();')
          text = text.replace(
              '            g.setColor(controlColor);\n            drawCentered(g, system.controlLabel(), node.x, node.y + radius + 26);',
              '            g.setColor(controlColor);\n            drawCentered(g, system.controlLabel(), node.x, node.y + radius + 26);\n            int fleetCount = fleetsBySystem.getOrDefault(system.id(), 0);\n            if (fleetCount > 0) {\n                g.setFont(g.getFont().deriveFont(Font.BOLD, (float)Math.max(8, detailSize - 1)));\n                g.setColor(new Color(255, 236, 150));\n                drawCentered(g, fleetCount + (fleetCount == 1 ? " FLEET" : " FLEETS"), node.x, node.y + radius + 39);\n            }')
          helper_anchor = '    private Map<String,List<GalaxyEventView>> discoveredEventsBySystem() {'
          helper = '''    private Map<String,Integer> localFleetCounts() {\n        Map<String,Integer> counts = new HashMap<>();\n        World world = PlayerRegistry.activeWorld();\n        String owner = PlayerRegistry.localId();\n        if (world == null || owner == null || owner.isBlank()) return counts;\n        for (FleetView fleet : FleetManager.viewsForOwner(world, owner)) {\n            for (Map.Entry<String,Integer> entry : fleet.shipsBySystem().entrySet()) {\n                if (entry.getValue() != null && entry.getValue() > 0) counts.merge(entry.getKey(), 1, Integer::sum);\n            }\n        }\n        return counts;\n    }\n\n'''
          if helper not in text:
              if helper_anchor not in text: raise SystemExit('GalaxyMapOverlay helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          if 'FLEETS"' not in text or 'localFleetCounts()' not in text:
              raise SystemExit('GalaxyMapOverlay fleet presentation patch failed')
          p.write_text(text)
          PY
      - name: Remove one-shot patcher and commit
        shell: bash
        run: |
          rm -f .github/workflows/acceptance-branch-patcher.yml
          git config user.name "StarChem Acceptance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git commit -m "Finish #380 authoritative fleet integration"
          git push origin HEAD:finish/2026-09-10-acceptance-gaps
