name: Permanent Player Save Hotfix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/player-save-hotfix.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/player-save-hotfix.yml']

permissions:
  contents: write

jobs:
  apply-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      new_sha: ${{ steps.commit.outputs.new_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preserve offline players permanently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def remove_method(text: str, signature: str) -> str:
              lines = text.splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if signature in line]
              if len(starts) != 1:
                  raise SystemExit(f"Expected one {signature}, found {len(starts)}")
              start = starts[0]
              depth = 0
              opened = False
              for end in range(start, len(lines)):
                  depth += lines[end].count('{')
                  opened = opened or '{' in lines[end]
                  depth -= lines[end].count('}')
                  if opened and depth == 0:
                      break
              else:
                  raise SystemExit(f"Unclosed method: {signature}")
              while end + 1 < len(lines) and not lines[end + 1].strip():
                  end += 1
              return ''.join(lines[:start] + lines[end + 1:])

          server_path = Path('src/main/java/com/tndmadman/rts/PeerServerSide.java')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace('    private static final long DISCONNECT_GRACE_MS = 60_000;\n', '')
          server = server.replace('        removeExpiredSessions(now);\n', '')
          server = server.replace(
              'session == null || sessionExpired(session, now) || !tokenMatches',
              'session == null || !tokenMatches')
          server = server.replace(
              'session == null || sessionExpired(session, now)',
              'session == null')
          server = server.replace(
              '            if (session != null && sessionExpired(session, now)) destroySession(playerId);\n', '')
          server = server.replace('            if (session != null) destroySession(playerId);\n', '')
          server = server.replace(
              '        world.status = session.name + " " + reason + "; session retained for " + (DISCONNECT_GRACE_MS / 1000) + " seconds.";\n',
              '        world.status = session.name + " " + reason + "; player identity and world state retained indefinitely.";\n')
          server = server.replace('    static long disconnectGraceMs() { return DISCONNECT_GRACE_MS; }\n', '')
          server = server.replace('Session expired or token was rejected.', 'Session token was rejected.')
          server = remove_method(server, 'private void destroySession(String playerId)')
          server = remove_method(server, 'private void removeExpiredSessions(long now)')
          server = remove_method(server, 'private boolean sessionExpired(PlayerSession session, long now)')
          forbidden = ('destroySession', 'sessionExpired', 'removeExpiredSessions',
                       'disconnectGraceMs', 'DISCONNECT_GRACE_MS')
          remaining = [token for token in forbidden if token in server]
          if remaining:
              raise SystemExit('Automatic deletion code remains: ' + ', '.join(remaining))
          server_path.write_text(server, encoding='utf-8')

          validator_path = Path('src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java')
          lines = validator_path.read_text(encoding='utf-8').splitlines(keepends=True)
          socket_line = next(i for i, line in enumerate(lines)
                             if 'Socket restartedClient = connect(loopback, transport.localPort())) {' in line)
          indent = lines[socket_line].split('Socket', 1)[0]
          lines[socket_line] = lines[socket_line].replace(') {', ';')
          lines.insert(socket_line + 1,
                       indent + 'Socket longOfflineClient = connect(loopback, transport.localPort())) {\n')

          wait_line = next(i for i, line in enumerate(lines)
                           if 'waitConnection(transport, loopback, restartedClient.getLocalPort());' in line)
          wait_indent = lines[wait_line].split('waitConnection', 1)[0]
          lines.insert(wait_line + 1,
                       wait_indent + 'waitConnection(transport, loopback, longOfflineClient.getLocalPort());\n')

          start = next(i for i, line in enumerate(lines)
                       if 'server.removePeer(restartedEndpoint);' in line)
          end = next(i for i in range(start, len(lines))
                     if 'expired session did not remove P1 research' in lines[i])
          block = '''            server.removePeer(restartedEndpoint);
              long longOfflineNow = System.currentTimeMillis() + 7L * 24 * 60 * 60 * 1000;
              server.tick(longOfflineNow);
              require(world.hasLiveAssets("P1"), "long offline period deleted P1 assets");
              require(world.hasResearch("P1", "session-recovery-marker"),
                      "long offline period deleted P1 research");
              require(server.persistentSessions().stream()
                              .anyMatch(saved -> "P1".equals(saved.playerId())),
                      "long offline period deleted the persistent P1 identity");

              ConnectionId longOfflineEndpoint = transport.connectionId(
                      loopback, longOfflineClient.getLocalPort());
              server.join(longOfflineEndpoint, loopback, longOfflineClient.getLocalPort(),
                      "Recovery Client",
                      PasswordAuth.verifier("Recovery Client", "validator-password"), false, "");
              String longOfflineWelcome = receivePayload(longOfflineClient, "WELCOME|");
              require(longOfflineWelcome.startsWith("WELCOME|P1|"),
                      "same name and password received a new player slot after a long offline period");
              require(server.owns(longOfflineEndpoint, "P1"),
                      "long-offline password reclaim did not restore P1 ownership");
              require(world.hasLiveAssets("P1"),
                      "long-offline password reclaim changed P1 assets");
              require(world.hasResearch("P1", "session-recovery-marker"),
                      "long-offline password reclaim changed P1 research");
          '''
          lines[start:end + 1] = block.splitlines(keepends=True)
          validator = ''.join(lines)
          if 'disconnectGraceMs' in validator or 'expired session did not remove' in validator:
              raise SystemExit('Old destructive session assertions remain')
          validator_path.write_text(validator, encoding='utf-8')

          notes_path = Path('RELEASE_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          old = ('- Preserved disconnected players for the configured grace period instead of '
                 'immediately deleting their assets, while still pruning expired abandoned sessions.\n')
          new = ('- Player identities, research, ships, stations, inventories, production queues, '
                 'home systems, and ownership now remain indefinitely when clients disconnect, '
                 'time out, close the game, or leave normally.\n'
                 '- Removed automatic session-expiry deletion; only future explicit server '
                 'administration commands may delete player save data.\n')
          if old not in notes:
              raise SystemExit('Obsolete grace-period release note not found')
          notes_path.write_text(notes.replace(old, new, 1), encoding='utf-8')
          PY

          ! grep -R -n -E 'destroySession|sessionExpired|removeExpiredSessions|disconnectGraceMs|DISCONNECT_GRACE_MS' \
            src/main/java/com/tndmadman/rts/PeerServerSide.java \
            src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java

      - name: Run full verification
        run: gradle clean check --no-daemon -PreleaseVersion=1.5.3 -PbuildCommit="$(git rev-parse HEAD)"

      - name: Commit hotfix directly to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StarChem Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/player-save-hotfix.yml
          git add src/main/java/com/tndmadman/rts/PeerServerSide.java \
                  src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java \
                  RELEASE_NOTES.md
          git diff --cached --check
          git commit -m 'Preserve offline player saves'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Build v1.5.3 package
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA='${{ steps.commit.outputs.new_sha }}'
          gradle clean check jar --no-daemon \
            -PreleaseVersion=1.5.3 -PbuildCommit="$NEW_SHA"
          rm -rf release
          mkdir -p release/StarChem
          cp build/libs/StarChem.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/run-starchem.bat packaging/run-starchem-server.bat release/StarChem/
          cp packaging/run-starchem.sh packaging/run-starchem-server.sh release/StarChem/
          chmod +x release/StarChem/run-starchem.sh release/StarChem/run-starchem-server.sh
          cp README.md LICENSE THIRD_PARTY_NOTICES.md release/StarChem/
          COMMIT_EPOCH="$(git show -s --format=%ct "$NEW_SHA")"
          find release/StarChem -exec touch -d "@$COMMIT_EPOCH" {} +
          (
            cd release
            mapfile -t ENTRIES < <(find StarChem -print | LC_ALL=C sort)
            printf '%s\n' "${ENTRIES[@]}" | zip -X -q StarChem-v1.5.3.zip -@
          )
          cp release/StarChem-v1.5.3.zip .
          sha256sum StarChem-v1.5.3.zip > StarChem-v1.5.3.zip.sha256
          sha256sum -c StarChem-v1.5.3.zip.sha256
          java -jar build/libs/StarChem.jar --version | \
            grep -Fx "StarChem 1.5.3 (${NEW_SHA:0:12})"

      - uses: actions/upload-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: |
            StarChem-v1.5.3.zip
            StarChem-v1.5.3.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-launcher-smoke:
    needs: apply-test-package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: release-artifact
      - name: Validate Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path 'release-artifact' 'StarChem-v1.5.3.zip'
          $checksum = Join-Path 'release-artifact' 'StarChem-v1.5.3.zip.sha256'
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Checksum mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'starchem-v153-hotfix'
          Expand-Archive $zip $root
          Push-Location (Join-Path $root 'StarChem')
          try {
            $version = (& cmd /c run-starchem.bat --version | Out-String).Trim()
            $sha = '${{ needs.apply-test-package.outputs.new_sha }}'
            if ($version -ne "StarChem 1.5.3 ($($sha.Substring(0, 12)))") {
              throw "Unexpected version: $version"
            }
            $help = (& cmd /c run-starchem-server.bat --help | Out-String)
            if ($LASTEXITCODE -ne 0 -or $help -notmatch '--server \[PORT\]') {
              throw 'Server launcher smoke failed.'
            }
          } finally { Pop-Location }

  replace-release:
    needs: [apply-test-package, windows-launcher-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: release-artifact
      - name: Replace v1.5.3 release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ needs.apply-test-package.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.5.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git push origin :refs/tags/v1.5.3 || true
          gh release create v1.5.3 \
            release-artifact/StarChem-v1.5.3.zip \
            release-artifact/StarChem-v1.5.3.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_SHA" \
            --title 'StarChem v1.5.3' \
            --notes-file RELEASE_NOTES.md
