name: Permanent Player Save Hotfix
# Trigger after workflow registration on main.
# Pull-request trigger commit, revision 2.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/player-save-hotfix.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/player-save-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      new_sha: ${{ steps.commit.outputs.new_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Remove automatic player deletion and update regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}")
              return updated

          server_path = Path('src/main/java/com/tndmadman/rts/PeerServerSide.java')
          server = server_path.read_text(encoding='utf-8')
          server = replace_once(server,
              '    private static final long DISCONNECT_GRACE_MS = 60_000;\n', '',
              'disconnect grace constant')
          server = replace_once(server,
              '        removeExpiredSessions(now);\n', '',
              'automatic expired-session sweep')
          server = sub_once(server,
              r'''        if \(session == null \|\| sessionExpired\(session, now\) \|\| !tokenMatches\(session, token, connectionId, now\)\) \{
                  if \(session != null && sessionExpired\(session, now\)\) destroySession\(playerId\);
                  transport\.sendOrdered\(sessionDenied\("Session expired or token was rejected\."\), connectionId\);
                  return false;
              \}''',
              '''        if (session == null || !tokenMatches(session, token, connectionId, now)) {
                  transport.sendOrdered(sessionDenied("Session token was rejected."), connectionId);
                  return false;
              }''',
              'raw resume expiry deletion')
          server = sub_once(server,
              r'''        if \(session == null \|\| sessionExpired\(session, now\)\) \{
                  if \(session != null\) destroySession\(playerId\);
                  transport\.sendOrdered\(sessionDenied\("Session expired or token was rejected\."\), connectionId\);
                  return false;
              \}''',
              '''        if (session == null) {
                  transport.sendOrdered(sessionDenied("Session token was rejected."), connectionId);
                  return false;
              }''',
              'proof resume expiry deletion')
          server = replace_once(server,
              '        world.status = session.name + " " + reason + "; session retained for " + (DISCONNECT_GRACE_MS / 1000) + " seconds.";\n',
              '        world.status = session.name + " " + reason + "; player identity and world state retained indefinitely.";\n',
              'disconnect retention status')
          server = sub_once(server,
              r'\n    private void destroySession\(String playerId\) \{.*?\n    \}\n\n    private void broadcastLeaderboard\(\)',
              '\n\n    private void broadcastLeaderboard()',
              'destroySession method')
          server = sub_once(server,
              r'\n    private void removeExpiredSessions\(long now\) \{.*?\n    \}\n\n    private boolean sessionExpired\(PlayerSession session, long now\) \{.*?\n    \}\n',
              '\n',
              'expired-session cleanup block')
          server = replace_once(server,
              '    static long disconnectGraceMs() { return DISCONNECT_GRACE_MS; }\n', '',
              'disconnect grace test accessor')
          server_path.write_text(server, encoding='utf-8')

          validator_path = Path('src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java')
          validator = validator_path.read_text(encoding='utf-8')
          validator = sub_once(validator,
              r'''        try \(Socket firstClient = connect\(loopback, transport\.localPort\(\)\);
                   Socket reboundClient = connect\(loopback, transport\.localPort\(\)\);
                   Socket restartedClient = connect\(loopback, transport\.localPort\(\)\)\) \{
                  waitConnection\(transport, loopback, firstClient\.getLocalPort\(\)\);
                  waitConnection\(transport, loopback, reboundClient\.getLocalPort\(\)\);
                  waitConnection\(transport, loopback, restartedClient\.getLocalPort\(\)\);''',
              '''        try (Socket firstClient = connect(loopback, transport.localPort());
                   Socket reboundClient = connect(loopback, transport.localPort());
                   Socket restartedClient = connect(loopback, transport.localPort());
                   Socket longOfflineClient = connect(loopback, transport.localPort())) {
                  waitConnection(transport, loopback, firstClient.getLocalPort());
                  waitConnection(transport, loopback, reboundClient.getLocalPort());
                  waitConnection(transport, loopback, restartedClient.getLocalPort());
                  waitConnection(transport, loopback, longOfflineClient.getLocalPort());''',
              'long-offline test socket setup')
          validator = sub_once(validator,
              r'''            server\.removePeer\(restartedEndpoint\);
                  server\.tick\(System\.currentTimeMillis\(\) \+ PeerServerSide\.disconnectGraceMs\(\) \+ 1000\);
                  require\(!world\.hasLiveAssets\("P1"\), "expired session did not remove P1 assets"\);
                  require\(!world\.hasResearch\("P1", "session-recovery-marker"\), "expired session did not remove P1 research"\);''',
              '''            server.removePeer(restartedEndpoint);
                  long longOfflineNow = System.currentTimeMillis() + 7L * 24 * 60 * 60 * 1000;
                  server.tick(longOfflineNow);
                  require(world.hasLiveAssets("P1"), "long offline period deleted P1 assets");
                  require(world.hasResearch("P1", "session-recovery-marker"), "long offline period deleted P1 research");
                  require(server.persistentSessions().stream().anyMatch(saved -> "P1".equals(saved.playerId())),
                          "long offline period deleted the persistent P1 identity");

                  ConnectionId longOfflineEndpoint = transport.connectionId(loopback, longOfflineClient.getLocalPort());
                  server.join(longOfflineEndpoint, loopback, longOfflineClient.getLocalPort(), "Recovery Client",
                          PasswordAuth.verifier("Recovery Client", "validator-password"), false, "");
                  String longOfflineWelcome = receivePayload(longOfflineClient, "WELCOME|");
                  require(longOfflineWelcome.startsWith("WELCOME|P1|"),
                          "same name and password received a new player slot after a long offline period");
                  require(server.owns(longOfflineEndpoint, "P1"),
                          "long-offline password reclaim did not restore P1 ownership");
                  require(world.hasLiveAssets("P1"), "long-offline password reclaim changed P1 assets");
                  require(world.hasResearch("P1", "session-recovery-marker"),
                          "long-offline password reclaim changed P1 research");''',
              'expired-session deletion assertions')
          validator_path.write_text(validator, encoding='utf-8')

          notes_path = Path('RELEASE_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          notes = replace_once(notes,
              '- Preserved disconnected players for the configured grace period instead of immediately deleting their assets, while still pruning expired abandoned sessions.\n',
              '- Player identities, research, ships, stations, inventories, production queues, home systems, and ownership now remain indefinitely when clients disconnect, time out, close the game, or leave normally.\n- Removed automatic session-expiry deletion; only future explicit server administration commands may delete player save data.\n',
              'obsolete grace-period release note')
          notes_path.write_text(notes, encoding='utf-8')
          PY

          ! grep -R -n -E 'destroySession|sessionExpired|removeExpiredSessions|disconnectGraceMs' \
            src/main/java/com/tndmadman/rts/PeerServerSide.java \
            src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          gradle clean check --no-daemon -PreleaseVersion=1.5.3 -PbuildCommit="$(git rev-parse HEAD)"

      - name: Commit hotfix directly to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StarChem Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/player-save-hotfix.yml
          git add src/main/java/com/tndmadman/rts/PeerServerSide.java \
                  src/main/java/com/tndmadman/rts/SessionRecoveryValidator.java \
                  RELEASE_NOTES.md
          git diff --cached --check
          git commit -m 'Preserve offline player saves'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Build deterministic v1.5.3 package
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA='${{ steps.commit.outputs.new_sha }}'
          gradle clean check jar --no-daemon -PreleaseVersion=1.5.3 -PbuildCommit="$NEW_SHA"

          rm -rf release
          mkdir -p release/StarChem
          cp build/libs/StarChem.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/run-starchem.bat release/StarChem/run-starchem.bat
          cp packaging/run-starchem-server.bat release/StarChem/run-starchem-server.bat
          cp packaging/run-starchem.sh release/StarChem/run-starchem.sh
          cp packaging/run-starchem-server.sh release/StarChem/run-starchem-server.sh
          chmod +x release/StarChem/run-starchem.sh release/StarChem/run-starchem-server.sh
          cp README.md release/StarChem/README.md
          cp LICENSE release/StarChem/LICENSE
          cp THIRD_PARTY_NOTICES.md release/StarChem/THIRD_PARTY_NOTICES.md

          COMMIT_EPOCH="$(git show -s --format=%ct "$NEW_SHA")"
          find release/StarChem -exec touch -d "@$COMMIT_EPOCH" {} +
          (
            cd release
            mapfile -t ZIP_ENTRIES < <(find StarChem -print | LC_ALL=C sort)
            printf '%s\n' "${ZIP_ENTRIES[@]}" | zip -X -q StarChem-v1.5.3.zip -@
          )
          cp release/StarChem-v1.5.3.zip .
          sha256sum StarChem-v1.5.3.zip > StarChem-v1.5.3.zip.sha256
          sha256sum -c StarChem-v1.5.3.zip.sha256
          java -jar build/libs/StarChem.jar --version | grep -Fx "StarChem 1.5.3 (${NEW_SHA:0:12})"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: |
            StarChem-v1.5.3.zip
            StarChem-v1.5.3.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-launcher-smoke:
    needs: apply-test-package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: release-artifact

      - name: Validate Windows launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path 'release-artifact' 'StarChem-v1.5.3.zip'
          $checksum = Join-Path 'release-artifact' 'StarChem-v1.5.3.zip.sha256'
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Release checksum mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'starchem-v153-hotfix'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          Push-Location (Join-Path $root 'StarChem')
          try {
            $version = (& cmd /c run-starchem.bat --version | Out-String).Trim()
            $sha = '${{ needs.apply-test-package.outputs.new_sha }}'
            $expectedVersion = "StarChem 1.5.3 ($($sha.Substring(0, 12)))"
            if ($version -ne $expectedVersion) { throw "Unexpected version output: $version" }
            $help = (& cmd /c run-starchem-server.bat --help | Out-String)
            if ($LASTEXITCODE -ne 0 -or $help -notmatch '--server \[PORT\]') { throw 'Server launcher smoke test failed.' }
          } finally {
            Pop-Location
          }

  replace-release:
    needs:
      - apply-test-package
      - windows-launcher-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fixed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.3-hotfix
          path: release-artifact

      - name: Replace v1.5.3 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ needs.apply-test-package.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.5.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git push origin :refs/tags/v1.5.3 || true
          gh release create v1.5.3 \
            release-artifact/StarChem-v1.5.3.zip \
            release-artifact/StarChem-v1.5.3.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_SHA" \
            --title 'StarChem v1.5.3' \
            --notes-file RELEASE_NOTES.md
