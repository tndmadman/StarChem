name: Issue 385 Branch Validation

on:
  push:
    branches: [ issue-385-rich-visuals ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: gradle classes
      - name: Validate rich visual catalog
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.VisualDefinitionCatalogValidator
