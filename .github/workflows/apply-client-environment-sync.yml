name: Apply Client Environment Sync Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-galaxy-territory-expansion
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply reviewed synchronization patch
        shell: bash
        run: |
          if [[ ! -f .github/apply-client-environment-sync.ready ]]; then
            echo "Client environment marker not present."
            exit 0
          fi

          set +e
          git apply --recount --verbose --exclude=src/main/java/com/tndmadman/rts/PeerServerSide.java --check .github/client-environment-sync.patch > /tmp/client-env-check.log 2>&1
          check_status=$?
          if [[ $check_status -ne 0 ]]; then
            cat /tmp/client-env-check.log
            exit $check_status
          fi

          git apply --recount --exclude=src/main/java/com/tndmadman/rts/PeerServerSide.java .github/client-environment-sync.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/com/tndmadman/rts/PeerServerSide.java")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "    private static final long GALAXY_MS = 1000;\n    private static final long TIMEOUT_MS = 4000;",
                  "    private static final long GALAXY_MS = 1000;\n    private static final long RESOURCE_CORRECTION_MS = 5000;\n    private static final long TIMEOUT_MS = 4000;",
              ),
              (
                  "    private long sequence = 1, lastSnapshot, lastGalaxy;",
                  "    private long sequence = 1, lastSnapshot, lastGalaxy, lastResourceCorrection;",
              ),
              (
                  "        if (now - lastSnapshot >= SNAPSHOT_MS) { broadcastNow(); lastSnapshot = now; }",
                  "        if (now - lastSnapshot >= SNAPSHOT_MS) {\n            boolean fullResources = now - lastResourceCorrection >= RESOURCE_CORRECTION_MS;\n            broadcastNow(fullResources);\n            lastSnapshot = now;\n            if (fullResources) lastResourceCorrection = now;\n        }",
              ),
              (
                  "    void broadcastNow() {\n        sequence = PeerSyncBatch.send(world, views, PeerSyncTargets.array(peers.values()), sequence, transport::send);\n        broadcastLeaderboard();\n    }",
                  "    void broadcastNow() {\n        broadcastNow(false);\n    }\n\n    private void broadcastNow(boolean fullResources) {\n        sequence = PeerSyncBatch.send(world, views, PeerSyncTargets.array(peers.values()), sequence, fullResources, transport::send);\n        broadcastLeaderboard();\n    }",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one PeerServerSide block, found {text.count(old)}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          gradle clean check jar --no-daemon > /tmp/client-env-gradle.log 2>&1
          gradle_status=$?
          if [[ $gradle_status -ne 0 ]]; then
            cat /tmp/client-env-gradle.log
            exit $gradle_status
          fi
          set -e

          rm -f .github/client-environment-sync.patch
          rm -f .github/apply-client-environment-sync.ready
          rm -f .github/client-environment-sync-error.log
          rm -f .github/workflows/apply-client-environment-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix client system environment synchronization"
          git push origin HEAD:agent/static-galaxy-territory-expansion
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-environment-sync-logs
          path: /tmp/client-env-*.log
          if-no-files-found: warn
