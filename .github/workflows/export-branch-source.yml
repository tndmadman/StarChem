name: Apply issue 160 fix

on:
  push:
    branches:
      - agent/fix-production-recipe-selection

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-production-recipe-selection
          fetch-depth: 0

      - name: Apply source patch
        run: |
          git apply --check .github/issue-160-recipe-selection.patch
          git apply .github/issue-160-recipe-selection.patch

      - name: Compile Java sources
        run: |
          find src/main/java -name '*.java' | sort > /tmp/starchem-sources.txt
          mkdir -p /tmp/starchem-classes
          javac --release 17 -d /tmp/starchem-classes @/tmp/starchem-sources.txt

      - name: Run focused validators
        run: |
          java -cp /tmp/starchem-classes com.tndmadman.rts.RulesValidator
          java -cp /tmp/starchem-classes com.tndmadman.rts.IntermediateCraftingValidator
          java -cp /tmp/starchem-classes com.tndmadman.rts.ProductionQueueValidator

      - name: Commit verified fix
        run: |
          rm .github/issue-160-recipe-selection.patch
          rm .github/workflows/export-branch-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ProductionPlanner.java
          git add src/main/java/com/tndmadman/rts/ProductionQueueValidator.java
          git add -u .github
          git commit -m "Fix auto-production recipe selection"
          git push origin HEAD:agent/fix-production-recipe-selection
