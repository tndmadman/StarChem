name: Final Check Diagnostics

on:
  push:
    branches:
      - integration/2026-09-09-final
    paths:
      - '.github/workflows/final-check-diagnostics.yml'
      - 'build.gradle'
      - 'config/**'
      - 'src/main/java/com/tndmadman/rts/**'

permissions:
  contents: read

jobs:
  diagnose:
    name: Check group - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-config
            tasks: validateRules validateConfigurationEnums validateRuleIds validateMaterialCoverage validateResourceCatalog validateIntermediateCrafting
          - name: storage-auth
            tasks: validateLocalHostIdentity validateServerSaveStore validateSnapshotHardening validateDevAccess validateSavedCredentialReplay validatePrunePersistence validateObservationRetention
          - name: ship-fit
            tasks: validateShipLoadouts validateConfiguredFitRules validateAttackRangeParity validateWorldFitCatalogIsolation validateRefitQuotePersistence validateAtomicRefitTransactions validateCustomFitConstruction validateShipModuleRefits validateDistributedRefitQueues
          - name: command-production
            tasks: validateIssue291CommandQueues validateIssue293LogisticsRoutes validateIssue289Completion validateProductionQueues validateIssue386Formations
          - name: network-basic
            tasks: validateNetworkSecurity validateTcpMultiplayer validateTcpMultiClient validateTcpReconnect validateDedicatedTcpServer validateTcpConnectionIdentity
          - name: network-stress-view
            tasks: validateTcpSlowClient validateTcpViewSwitching validateTcpRemoteSystemVisibility validateTcpSoakSmoke validateSessionRecovery
          - name: galaxy-core
            tasks: validateGalaxyConnectivity validateGalaxyMapWire validateSystemControl validateSystemModifiers validateClientEnvironmentSync validateCelestialContinuity
          - name: galaxy-events-npc
            tasks: validateGalaxyEvents validateNpcSystemIsolation validateNpcGalaxyDirector validateSystemSimulationScheduler validateDevSimulationState
          - name: ui-meta
            tasks: validateMinimapHud validateCodexCatalog validateNarrationProcesses verifyLegalNotices verifyBuildMetadata validateClientLaunch
          - name: default-test
            tasks: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run diagnostic group
        run: gradle ${{ matrix.tasks }} --no-daemon --continue --stacktrace
