name: AI Stress

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Stress organized NPC AI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile validators
        run: gradle classes --no-daemon

      - name: Repeat expedition validation across fixed seeds
        shell: bash
        run: |
          set -o pipefail
          : > ai-stress.log
          for seed in $(seq 41000 41063); do
            echo "=== expedition seed ${seed} ===" >> ai-stress.log
            java -Djava.awt.headless=true \
                 -Dstarchem.npcExpeditionSeed="${seed}" \
                 -cp build/classes/java/main \
                 com.tndmadman.rts.NpcExpeditionValidator \
                 >> ai-stress.log 2>&1
          done

      - name: Repeat lifecycle validation
        shell: bash
        run: |
          set -o pipefail
          for round in $(seq 1 8); do
            echo "=== lifecycle round ${round} ===" >> ai-stress.log
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.NpcRecoveryValidator >> ai-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.NpcRuntimeResetValidator >> ai-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.NpcCrossSystemOperationsValidator >> ai-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.NpcFactionLifecycleValidator >> ai-stress.log 2>&1
          done

      - name: Repeat logger lifecycle validation
        shell: bash
        run: |
          set -o pipefail
          for round in $(seq 1 4); do
            echo "=== logger round ${round} ===" >> ai-stress.log
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.AiBrainLogValidator >> ai-stress.log 2>&1
          done

      - name: Run expedition defense validation
        run: |
          java -Djava.awt.headless=true -cp build/classes/java/main \
               com.tndmadman.rts.NpcExpeditionDefenseValidator \
               >> ai-stress.log 2>&1

      - name: Archive AI stress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-stress-${{ github.sha }}
          path: ai-stress.log
          retention-days: 7
