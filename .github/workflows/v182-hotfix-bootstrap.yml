name: Bootstrap StarChem v1.8.2 Multiplayer Hotfix

on:
  push:
    branches:
      - hotfix/v1.8.2-multiplayer-join

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply hotfix
        run: |
          python .github/scripts/v182_hotfix.py
          python .github/scripts/v182_hotfix_followup.py

      - name: Focused multiplayer regressions
        run: |
          gradle clean classes --no-daemon -PreleaseVersion=1.8.2-dev
          gradle validateGalaxyMapWire validateNetworkSecurity validateTcpConnectionIdentity validateTcpMultiplayer validateTcpReconnect validateSessionRecovery --no-daemon -PreleaseVersion=1.8.2-dev
          bash validation/validate-release-metadata.sh

      - name: Full verification
        run: gradle check --no-daemon -PreleaseVersion=1.8.2-dev

      - name: Commit validated hotfix
        run: |
          rm -f .github/workflows/v182-hotfix-bootstrap.yml .github/scripts/v182_hotfix.py .github/scripts/v182_hotfix_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix v1.8.2 multiplayer join bootstrap [v182-hotfix-applied]"
          git push origin HEAD:hotfix/v1.8.2-multiplayer-join
