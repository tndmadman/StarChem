name: Station Visual Validation

on:
  push:
    paths:
      - 'src/main/java/com/tndmadman/rts/Base.java'
      - 'src/main/java/com/tndmadman/rts/StationRenderer.java'
      - 'src/main/java/com/tndmadman/rts/IntelStructureRenderer.java'
      - 'src/main/java/com/tndmadman/rts/Issue396StationVisualValidator.java'
      - 'src/main/java/com/tndmadman/rts/StationPresentation.java'
      - 'src/main/java/com/tndmadman/rts/StationPresentationValidator.java'
      - 'src/main/java/com/tndmadman/rts/DamageStateEffects.java'
      - 'src/main/java/com/tndmadman/rts/Issue405DestructionEffectsValidator.java'
      - 'src/main/java/com/tndmadman/rts/WorldRenderCandidates.java'
      - 'config/stations.json'
      - '.github/workflows/station-visual-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/Base.java'
      - 'src/main/java/com/tndmadman/rts/StationRenderer.java'
      - 'src/main/java/com/tndmadman/rts/IntelStructureRenderer.java'
      - 'src/main/java/com/tndmadman/rts/Issue396StationVisualValidator.java'
      - 'src/main/java/com/tndmadman/rts/StationPresentation.java'
      - 'src/main/java/com/tndmadman/rts/StationPresentationValidator.java'
      - 'src/main/java/com/tndmadman/rts/DamageStateEffects.java'
      - 'src/main/java/com/tndmadman/rts/Issue405DestructionEffectsValidator.java'
      - 'src/main/java/com/tndmadman/rts/WorldRenderCandidates.java'
      - 'config/stations.json'
      - '.github/workflows/station-visual-validation.yml'

permissions:
  contents: read

concurrency:
  group: station-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and validate station visuals
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Isolate frozen baseline network validator mismatch
        shell: bash
        run: |
          set -euo pipefail
          # This graphics-only workflow must not import or rewrite the unrelated security fix.
          mv src/main/java/com/tndmadman/rts/TcpConnectionIdentityValidator.java /tmp/TcpConnectionIdentityValidator.java

      - name: Compile project
        run: gradle classes --no-daemon

      - name: Validate station architecture and gameplay-bound isolation
        run: java -Djava.awt.headless=true -cp build/classes/java/main:build/resources/main com.tndmadman.rts.Issue396StationVisualValidator

      - name: Validate contextual station presentation integration
        run: java -Djava.awt.headless=true -cp build/classes/java/main:build/resources/main com.tndmadman.rts.StationPresentationValidator

      - name: Validate station damage-state integration
        run: java -Djava.awt.headless=true -cp build/classes/java/main:build/resources/main com.tndmadman.rts.Issue405DestructionEffectsValidator
