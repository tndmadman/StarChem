name: Apply leaderboard cache fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cache-leaderboard-aggregation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply leaderboard cache fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path_value}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          peer_path = "src/main/java/com/tndmadman/rts/PeerServerSide.java"
          replace_once(
              peer_path,
              "    private static final long SNAPSHOT_MS = 100;\n    private static final long GALAXY_MS = 1000;",
              "    private static final long SNAPSHOT_MS = 100;\n"
              "    private static final long LEADERBOARD_MS = 1000;\n"
              "    private static final long GALAXY_MS = 1000;"
          )
          replace_once(
              peer_path,
              "    final PeerTransport transport;\n    final ClientViewCache views = new ClientViewCache();",
              "    final PeerTransport transport;\n"
              "    final ClientViewCache views = new ClientViewCache();\n"
              "    private final AuthoritativeLeaderboardCache leaderboard =\n"
              "            new AuthoritativeLeaderboardCache(LEADERBOARD_MS);"
          )
          replace_once(
              peer_path,
              "        if (now - lastGalaxy >= GALAXY_MS) { broadcastGalaxy(); lastGalaxy = now; }",
              "        if (leaderboard.due(now)) broadcastLeaderboard(now);\n"
              "        if (now - lastGalaxy >= GALAXY_MS) { broadcastGalaxy(); lastGalaxy = now; }"
          )
          replace_once(
              peer_path,
              "    private void broadcastNow(boolean fullResources) {\n"
              "        sequence = PeerSyncBatch.send(world, views, PeerSyncTargets.array(peers.values()), sequence, fullResources, transport::send);\n"
              "        broadcastLeaderboard();\n"
              "    }",
              "    private void broadcastNow(boolean fullResources) {\n"
              "        sequence = PeerSyncBatch.send(world, views, PeerSyncTargets.array(peers.values()), sequence, fullResources, transport::send);\n"
              "    }"
          )
          replace_once(
              peer_path,
              "    private void broadcastLeaderboard() {\n"
              "        if (peers.isEmpty()) return;\n"
              "        List<LeaderboardEntry> entries = GlobalLeaderboard.aggregate(world, allKnownSystems());\n"
              "        GlobalLeaderboard.set(world, entries);\n"
              "        String message = GlobalLeaderboard.encode(entries);\n"
              "        for (ServerPeer peer : peers.values()) transport.send(message, peer.connectionId(), DeliveryClass.LEADERBOARD);\n"
              "    }\n\n"
              "    private void sendLeaderboard(ServerPeer peer) {\n"
              "        if (peer == null) return;\n"
              "        List<LeaderboardEntry> entries = GlobalLeaderboard.aggregate(world, allKnownSystems());\n"
              "        GlobalLeaderboard.set(world, entries);\n"
              "        transport.send(GlobalLeaderboard.encode(entries), peer.connectionId(), DeliveryClass.LEADERBOARD);\n"
              "    }",
              "    private void broadcastLeaderboard(long now) {\n"
              "        if (peers.isEmpty()) return;\n"
              "        boolean changed = leaderboard.refresh(now,\n"
              "                () -> GlobalLeaderboard.aggregate(world, allKnownSystems()));\n"
              "        if (!changed) return;\n"
              "        GlobalLeaderboard.set(world, leaderboard.entries());\n"
              "        String message = leaderboard.message();\n"
              "        for (ServerPeer peer : peers.values()) {\n"
              "            transport.send(message, peer.connectionId(), DeliveryClass.LEADERBOARD);\n"
              "        }\n"
              "    }\n\n"
              "    private void sendLeaderboard(ServerPeer peer) {\n"
              "        if (peer == null) return;\n"
              "        leaderboard.refreshNow(System.currentTimeMillis(),\n"
              "                () -> GlobalLeaderboard.aggregate(world, allKnownSystems()));\n"
              "        GlobalLeaderboard.set(world, leaderboard.entries());\n"
              "        transport.send(leaderboard.message(), peer.connectionId(), DeliveryClass.LEADERBOARD);\n"
              "    }"
