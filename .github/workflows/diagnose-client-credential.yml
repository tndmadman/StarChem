name: Credential Diagnostic

on:
  push:
    branches:
      - agent/secure-client-credentials
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Capture verification output
        shell: bash
        run: |
          set +e
          gradle clean check jar --no-daemon --stacktrace > credential-diagnostic.log 2>&1
          echo $? > credential-diagnostic.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: credential-diagnostic
          path: |
            credential-diagnostic.log
            credential-diagnostic.exit
          if-no-files-found: error
