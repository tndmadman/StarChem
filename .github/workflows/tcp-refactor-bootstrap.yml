name: Apply TCP Refactor

on:
  push:
    branches:
      - agent/tcp-network-refactor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tcp-network-refactor
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply TCP refactor
        shell: bash
        run: |
          base64 --decode tcp-refactor.patch.gz.b64 | gzip --decompress > /tmp/tcp-refactor.patch
          git apply --index /tmp/tcp-refactor.patch
          git rm tcp-refactor.patch.gz.b64
          git rm .github/workflows/tcp-refactor-bootstrap.yml
      - name: Validate complete project
        run: gradle clean check jar --no-daemon
      - name: Commit TCP refactor
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "Replace multiplayer UDP transport with TCP"
          git push origin HEAD:agent/tcp-network-refactor
