name: Apply TCP Refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and apply TCP refactor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git clone --quiet --depth 1 --branch agent/tcp-network-refactor "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cat tcp-refactor.patch.chunk-* > /tmp/tcp-refactor.patch.gz.b64
          test "$(wc -c < /tmp/tcp-refactor.patch.gz.b64)" -eq 37192
          test "$(sha256sum /tmp/tcp-refactor.patch.gz.b64 | awk '{print $1}')" = "18cdd5f0a28b7144fe8540fff469231e69e61c869fc48fdd377fa7e8b06e12a0"
          base64 --decode /tmp/tcp-refactor.patch.gz.b64 > /tmp/tcp-refactor.patch.gz
          gzip --test /tmp/tcp-refactor.patch.gz
          gzip --decompress --stdout /tmp/tcp-refactor.patch.gz > /tmp/tcp-refactor.patch
          git apply --check /tmp/tcp-refactor.patch
          git apply --index /tmp/tcp-refactor.patch
          git rm tcp-refactor.patch.gz.b64
          git rm tcp-refactor.patch.chunk-*
          git rm .github/workflows/tcp-refactor-bootstrap.yml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate complete project
        working-directory: repo
        run: gradle clean check jar --no-daemon
      - name: Commit TCP refactor
        working-directory: repo
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "Replace multiplayer UDP transport with TCP"
          git push origin HEAD:agent/tcp-network-refactor
