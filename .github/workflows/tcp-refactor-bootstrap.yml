name: TCP Refactor Bootstrap

on:
  push:
    branches:
      - agent/tcp-network-refactor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: tar --exclude=.git -czf starchem-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: starchem-source
          path: starchem-source.tar.gz
          retention-days: 1
