name: PR 303 journal validation fix

on:
  push:
    branches:
      - agent/validate-v160-upgrade

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-v160-upgrade
          fetch-depth: 0
      - name: Validate migrated journal through its parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/tndmadman/rts/V160UpgradeValidator.java')
          text = path.read_text(encoding='utf-8')
          old = '''            require(Files.readString(serverDir.resolve(saveName + "-activity.log")).contains("FIXTURE"),
                    "activity journal state was lost");'''
          new = '''            List<String> fixtureEvents = new ServerEventJournal(serverDir, saveName)
                    .lines(20, "FIXTURE", alpha.id);
            require(fixtureEvents.stream().anyMatch(line -> line.contains("synthetic v1.6 activity")),
                    "activity journal state was lost");'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected activity journal assertion was not found')
          PY

          if git diff --quiet -- src/main/java/com/tndmadman/rts/V160UpgradeValidator.java; then
            echo 'Journal validator already fixed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/V160UpgradeValidator.java
          git commit -m 'Validate migrated activity journal through parser'
          git push origin HEAD:agent/validate-v160-upgrade
