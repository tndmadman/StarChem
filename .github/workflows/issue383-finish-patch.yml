name: Issue 383 Finish Patch

on:
  push:
    branches:
      - issue-383-procedural-galaxy
    paths:
      - 'tools/issue383_finish.py'
      - '.github/workflows/issue383-finish-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply completion patch
        run: python3 tools/issue383_finish.py
      - name: Compile
        run: gradle clean classes --no-daemon
      - name: Validate issue 383
        run: java -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue383GalaxyGenerationValidator
      - name: Commit completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/GalaxyPreview.java \
                  src/main/java/com/tndmadman/rts/GalaxySystemIdentity.java \
                  src/main/java/com/tndmadman/rts/GalaxyCoordinator.java \
                  src/main/java/com/tndmadman/rts/World.java \
                  src/main/java/com/tndmadman/rts/LobbyPanel.java \
                  src/main/java/com/tndmadman/rts/Issue383GalaxyGenerationValidator.java
          if git diff --cached --quiet; then
            echo 'No issue 383 changes to commit.'
          else
            git commit -m 'Finish issue 383 acceptance gaps'
            git push origin HEAD:issue-383-procedural-galaxy
          fi
