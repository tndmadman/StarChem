name: Run leaderboard cache fix v2

on:
  push:
    branches:
      - agent/cache-leaderboard-aggregation

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report verification run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 235,
              body: `Leaderboard fix verification workflow started: run ${context.runId}`
            })

      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/cache-leaderboard-aggregation
          fetch-depth: 0

      - name: Extract and apply source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-leaderboard-fix.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in script_lines if line.strip())
          script = '\n'.join(line[indent:] for line in script_lines) + '\n'
          Path('/tmp/apply_leaderboard_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_leaderboard_fix.py
          rm -f .github/workflows/run-leaderboard-fix.yml
          rm -f .github/workflows/run-leaderboard-fix-v2.yml

      - name: Verify full Gradle check
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon check

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cache authoritative leaderboard aggregation"
          git push origin HEAD:agent/cache-leaderboard-aggregation
