name: Issue 290 Transport Diagnostic

on:
  push:
    branches: [ agent/issue-290-main-baseline ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-290-control-groups
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instrument transport close paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/PeerTransport.java')
          text = path.read_text()
          old = '''    private void connectionClosed(TcpConnection connection) {
              perfStats.recordConnectionClosed();'''.replace('          ', '')
          new = '''    private void connectionClosed(TcpConnection connection) {
              int timeout = -1;
              try { timeout = connection.socket.getSoTimeout(); } catch (SocketException ignored) { }
              System.err.println("[TCP_DIAG] CLOSED side=" + (serverMode ? "server" : "client")
                      + " id=" + connection.id + " thread=" + Thread.currentThread().getName()
                      + " authenticated=" + connection.authenticated() + " soTimeout=" + timeout
                      + " running=" + running + " openBeforeCallback=" + connection.open());
              perfStats.recordConnectionClosed();'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('connectionClosed marker mismatch')
          text = text.replace(old, new, 1)
          old = '''            } catch (SocketTimeoutException ignored) {
                      if (serverMode && !authenticated()) perfStats.recordConnectionRejected();
                      // Application heartbeats and snapshots normally keep healthy connections active.
                  } catch (IOException ex) {
                      if (open.get()) perfStats.recordMalformedPacket();'''.replace('              ', '')
          new = '''            } catch (SocketTimeoutException ignored) {
                      System.err.println("[TCP_DIAG] READ_TIMEOUT side=" + (serverMode ? "server" : "client")
                              + " id=" + id + " authenticated=" + authenticated() + " timeout=" + socket.getSoTimeout());
                      if (serverMode && !authenticated()) perfStats.recordConnectionRejected();
                      // Application heartbeats and snapshots normally keep healthy connections active.
                  } catch (IOException ex) {
                      if (open.get()) System.err.println("[TCP_DIAG] READ_IO side=" + (serverMode ? "server" : "client")
                              + " id=" + id + " type=" + ex.getClass().getSimpleName() + " message=" + ex.getMessage());
                      if (open.get()) perfStats.recordMalformedPacket();'''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('reader catch marker mismatch')
          text = text.replace(old, new, 1)
          old = '''            } catch (IOException ignored) {
                      // Socket closure is the recovery signal.
                  } finally {'''.replace('              ', '')
          new = '''            } catch (IOException ex) {
                      if (open.get()) System.err.println("[TCP_DIAG] WRITE_IO side=" + (serverMode ? "server" : "client")
                              + " id=" + id + " type=" + ex.getClass().getSimpleName() + " message=" + ex.getMessage());
                      // Socket closure is the recovery signal.
                  } finally {'''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('writer catch marker mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          gradle classes --no-daemon
          java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ServerDevCommandValidator
