name: Phase 7 Network Lifecycle Stress

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Stress networking and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile validators
        run: gradle classes --no-daemon

      - name: Repeat reconnect and view switching
        shell: bash
        run: |
          set -o pipefail
          : > phase7-network-stress.log
          for round in $(seq 1 8); do
            echo "=== reconnect/view round ${round} ===" >> phase7-network-stress.log
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.TcpReconnectIntegrationValidator >> phase7-network-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.TcpViewSwitchStressValidator >> phase7-network-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.TcpRemoteSystemVisibilityValidator >> phase7-network-stress.log 2>&1
          done

      - name: Repeat session and server lifecycle
        shell: bash
        run: |
          set -o pipefail
          for round in $(seq 1 10); do
            echo "=== lifecycle round ${round} ===" >> phase7-network-stress.log
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.SessionRecoveryValidator >> phase7-network-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.TcpConnectionIdentityValidator >> phase7-network-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.DedicatedTcpServerValidator >> phase7-network-stress.log 2>&1
            java -Djava.awt.headless=true -cp build/classes/java/main \
                 com.tndmadman.rts.SystemSimulationSchedulerValidator >> phase7-network-stress.log 2>&1
          done

      - name: Run deterministic TCP soak
        run: |
          java -Djava.awt.headless=true \
               -Dstarchem.soakSeconds=90 \
               -Dstarchem.soakSeed=1511506142 \
               -cp build/classes/java/main \
               com.tndmadman.rts.TcpSoakValidator >> phase7-network-stress.log 2>&1

      - name: Run snapshot and slow-client checks
        run: |
          java -Djava.awt.headless=true -cp build/classes/java/main \
               com.tndmadman.rts.SnapshotHardeningValidator >> phase7-network-stress.log 2>&1
          java -Djava.awt.headless=true -cp build/classes/java/main \
               com.tndmadman.rts.TcpSlowClientIsolationValidator >> phase7-network-stress.log 2>&1
          java -Djava.awt.headless=true -cp build/classes/java/main \
               com.tndmadman.rts.TcpMultiClientValidator >> phase7-network-stress.log 2>&1

      - name: Archive network stress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-network-stress-${{ github.sha }}
          path: phase7-network-stress.log
          retention-days: 7
