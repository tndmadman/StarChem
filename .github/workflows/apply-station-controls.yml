name: Apply station control integration

on:
  push:
    branches:
      - agent/station-control-menus

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/station-control-menus
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply source integration
        run: python tools/apply_station_controls.py

      - name: Compile and validate controls
        run: |
          gradle clean classes --no-daemon
          java -cp build/classes/java/main com.tndmadman.rts.StationControlValidator
          java -cp build/classes/java/main com.tndmadman.rts.RadarTowerValidator
          java -cp build/classes/java/main com.tndmadman.rts.IntelWarfareValidator

      - name: Commit integrated implementation
        run: |
          rm tools/apply_station_controls.py .github/workflows/apply-station-controls.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add role-specific station control menus"
          git push origin HEAD:agent/station-control-menus
