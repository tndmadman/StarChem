name: Temporary selection summary patch

on:
  push:
    branches:
      - feature/centralized-manufacturing-ui
    paths:
      - .tmp_selection_summary_patch.py

permissions:
  contents: write

jobs:
  patch:
    if: ${{ hashFiles('.tmp_selection_summary_patch.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/centralized-manufacturing-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply selection rendering patch
        run: python .tmp_selection_summary_patch.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts
          git diff --cached --quiet && exit 0
          git commit -m "perf: replace per-ship selection UI with fleet summary"
          git push origin HEAD:feature/centralized-manufacturing-ui
