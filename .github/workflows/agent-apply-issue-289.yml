name: Apply issue 289 implementation

on:
  push:
    branches:
      - agent/issue-289-loadouts
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-loadouts
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/issue-289.patch.gz.b64.part* > /tmp/issue-289.patch.gz.b64
          echo '54ea7649641902ec998a6cf7159a2b451b99fa6285ad31ec63e83265dce56980  /tmp/issue-289.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue-289.patch.gz.b64 | gzip -d > /tmp/issue-289.patch
          echo 'e83c557c662d6a21683b4aca66e37163f76592ae390cacaee96fe1ddfdce0b6b  /tmp/issue-289.patch' | sha256sum -c -
          git apply --check /tmp/issue-289.patch
          git apply /tmp/issue-289.patch
          rm -rf .agent

      - name: Compile Java sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 17 -encoding UTF-8 -d build/classes

      - name: Validate loadouts, migrations, and multiplayer
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.ShipLoadoutValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.RulesValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.ProductionQueueValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.SnapshotHardeningValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.ServerSaveSchemaValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.TcpMultiplayerValidator
          java -Djava.awt.headless=true -cp build/classes com.tndmadman.rts.DedicatedTcpServerValidator

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StarChem Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement authored ship loadouts and refitting (#289)'
          git push origin HEAD:agent/issue-289-loadouts
