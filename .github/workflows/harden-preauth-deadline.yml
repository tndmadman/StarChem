name: Harden pre-authentication deadline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/preauth-connection-limits

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply deadline hardening
        run: python3 tools/harden_pre_auth_deadline.py

      - name: Check patch formatting
        run: git diff --check

      - name: Run full verification
        run: gradle clean check jar --no-daemon

      - name: Commit verified deadline hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/PeerTransport.java src/main/java/com/tndmadman/rts/PreAuthConnectionGateValidator.java
          git commit -m "Enforce absolute pre-authentication deadlines"
          git push origin HEAD:agent/preauth-connection-limits
