name: Temporary Embedded Policy UI Patch

on:
  push:
    branches:
      - feature/centralized-manufacturing-ui
    paths:
      - .github/workflows/temp-embed-policy-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/centralized-manufacturing-ui
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Embed policy command into ManufacturingOverlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch target not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          overlay = 'src/main/java/com/tndmadman/rts/ManufacturingOverlay.java'
          replace_once(overlay,
          '''    private final GamePanel returnFocus;\n    private final World world;\n    private final PeerNetwork network;\n\n    private final DefaultListModel<Section> sectionModel = new DefaultListModel<>();''',
          '''    private static final String VIEW_PRODUCTION = "production";\n    private static final String VIEW_POLICIES = "policies";\n\n    private final GamePanel returnFocus;\n    private final World world;\n    private final PeerNetwork network;\n    private final CardLayout viewLayout = new CardLayout();\n    private final JPanel viewDeck = new JPanel(viewLayout);\n    private final ManufacturingPolicyPanel policyPanel;\n\n    private final DefaultListModel<Section> sectionModel = new DefaultListModel<>();''')

          replace_once(overlay,
          '''        this.returnFocus = returnFocus;\n        this.world = world;\n        this.network = network;\n        setOpaque(false);''',
          '''        this.returnFocus = returnFocus;\n        this.world = world;\n        this.network = network;\n        this.policyPanel = new ManufacturingPolicyPanel(world, network, this::showProductionView, this::close);\n        setOpaque(false);''')

          replace_once(overlay,
          '''        JPanel card = buildCard();\n        GridBagConstraints gbc = new GridBagConstraints();\n        gbc.gridx = 0;\n        gbc.gridy = 0;\n        gbc.weightx = 1;\n        gbc.weighty = 1;\n        gbc.fill = GridBagConstraints.BOTH;\n        gbc.insets = new Insets(20, 24, 20, 24);\n        add(card, gbc);''',
          '''        JPanel card = buildCard();\n        viewDeck.setOpaque(false);\n        viewDeck.add(card, VIEW_PRODUCTION);\n        viewDeck.add(policyPanel, VIEW_POLICIES);\n        viewLayout.show(viewDeck, VIEW_PRODUCTION);\n\n        GridBagConstraints gbc = new GridBagConstraints();\n        gbc.gridx = 0;\n        gbc.gridy = 0;\n        gbc.weightx = 1;\n        gbc.weighty = 1;\n        gbc.fill = GridBagConstraints.BOTH;\n        gbc.insets = new Insets(20, 24, 20, 24);\n        add(viewDeck, gbc);''')

          replace_once(overlay,
          '''    static boolean openForStation(World world, String baseId) {\n        WeakReference<ManufacturingOverlay> reference = INSTANCES.get(world);\n        ManufacturingOverlay overlay = reference == null ? null : reference.get();\n        if (overlay == null) return false;\n        overlay.preferStation(baseId);\n        overlay.open();\n        return true;\n    }\n\n    void toggle() {\n        if (isVisible()) close();\n        else open();\n    }''',
          '''    static boolean openForStation(World world, String baseId) {\n        WeakReference<ManufacturingOverlay> reference = INSTANCES.get(world);\n        ManufacturingOverlay overlay = reference == null ? null : reference.get();\n        if (overlay == null) return false;\n        overlay.preferStation(baseId);\n        overlay.showProductionView();\n        overlay.open();\n        return true;\n    }\n\n    static boolean openPoliciesForStation(World world, String baseId) {\n        WeakReference<ManufacturingOverlay> reference = INSTANCES.get(world);\n        ManufacturingOverlay overlay = reference == null ? null : reference.get();\n        if (overlay == null) return false;\n        overlay.preferStation(baseId);\n        overlay.open();\n        overlay.showPolicyView(baseId);\n        return true;\n    }\n\n    void toggle() {\n        if (isVisible()) close();\n        else {\n            showProductionView();\n            open();\n        }\n    }''')

          replace_once(overlay,
          '''    void close() {\n        if (!isVisible()) return;\n        setVisible(false);''',
          '''    void close() {\n        if (!isVisible()) return;\n        policyPanel.deactivate();\n        setVisible(false);''')

          replace_once(overlay,
          '''    void disposeOverlay() {\n        liveTimer.stop();\n        close();''',
          '''    void disposeOverlay() {\n        liveTimer.stop();\n        policyPanel.disposePanel();\n        close();''')

          replace_once(overlay,
          '''    void preferStation(String baseId) {\n        preferredBaseId = baseId == null ? "" : baseId;\n        if (isVisible()) populateStations(choiceList.getSelectedValue());\n    }\n\n    private JPanel buildCard() {''',
          '''    void preferStation(String baseId) {\n        preferredBaseId = baseId == null ? "" : baseId;\n        if (isVisible()) populateStations(choiceList.getSelectedValue());\n    }\n\n    private void showProductionView() {\n        policyPanel.deactivate();\n        viewLayout.show(viewDeck, VIEW_PRODUCTION);\n        if (isVisible()) {\n            refreshCatalogPreservingSelection();\n            refreshLiveData();\n            SwingUtilities.invokeLater(() -> search.requestFocusInWindow());\n        }\n    }\n\n    private void showPolicyView(String baseId) {\n        String stationId = baseId == null ? "" : baseId;\n        if (stationId.isBlank()) {\n            ProductionChoice choice = choiceList.getSelectedValue();\n            Base selected = choice == null ? null : selectedStation(choice);\n            if (selected != null) stationId = selected.id;\n            else stationId = preferredBaseId;\n        }\n        policyPanel.activate(stationId);\n        viewLayout.show(viewDeck, VIEW_POLICIES);\n        SwingUtilities.invokeLater(() -> policyPanel.requestFocusInWindow());\n    }\n\n    private JPanel buildCard() {''')

          replace_once(overlay,
          '''        right.add(systemLabel);\n        JButton close = button("CLOSE", BRONZE_DARK);''',
          '''        right.add(systemLabel);\n        JButton policies = button("POLICIES", new Color(89, 112, 92));\n        policies.setToolTipText("Manage production policies, templates, reserves, and recovery");\n        policies.addActionListener(event -> showPolicyView(preferredBaseId));\n        right.add(policies);\n        JButton close = button("CLOSE", BRONZE_DARK);''')

          station = 'src/main/java/com/tndmadman/rts/StationControlMenu.java'
          replace_once(station,
          '''            JButton policies = actionButton("MANAGE PRODUCTION POLICIES", () -> {\n                popup.setVisible(false);\n                ManufacturingOverlay.openForStation(world, base.id);\n                ManufacturingPolicyManager.show(invoker, world, network, base);\n            });''',
          '''            JButton policies = actionButton("MANAGE PRODUCTION POLICIES", () -> {\n                popup.setVisible(false);\n                if (!ManufacturingOverlay.openPoliciesForStation(world, base.id)) {\n                    world.status = "Manufacturing policy console is unavailable.";\n                }\n            });''')

          policy_menu = 'src/main/java/com/tndmadman/rts/ProductionPolicyMenu.java'
          replace_once(policy_menu,
          '''        ManufacturingOverlay.openForStation(world, base.id);\n        ManufacturingPolicyManager.show(invoker, world, network, base);''',
          '''        ManufacturingOverlay.openPoliciesForStation(world, base.id);''')

          Path('src/main/java/com/tndmadman/rts/ManufacturingPolicyManager.java').unlink(missing_ok=True)
          PY

          if grep -R "ManufacturingPolicyManager" -n src/main/java/com/tndmadman/rts; then
            echo "Legacy window manager is still referenced" >&2
            exit 1
          fi
      - name: Compile embedded manufacturing UI
        run: ./gradlew clean classes --no-daemon
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ManufacturingOverlay.java \
                  src/main/java/com/tndmadman/rts/StationControlMenu.java \
                  src/main/java/com/tndmadman/rts/ProductionPolicyMenu.java \
                  src/main/java/com/tndmadman/rts/ManufacturingPolicyManager.java
          git commit -m "fix: keep manufacturing policies inside game UI"
          git push origin HEAD:feature/centralized-manufacturing-ui
