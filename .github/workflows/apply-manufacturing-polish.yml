name: Apply manufacturing UI polish

on:
  push:
    branches:
      - "feature/centralized-manufacturing-ui"
    paths:
      - ".github/workflows/apply-manufacturing-polish.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "feature/centralized-manufacturing-ui"
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply source changes
        run: python3 tools/apply_manufacturing_polish.py
      - name: Compile
        run: gradle compileJava
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ManufacturingOverlay.java src/main/java/com/tndmadman/rts/GamePanel.java
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Polish manufacturing inventory locations and HUD hint"
          git push origin HEAD:feature/centralized-manufacturing-ui
