name: Auth Diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture full check output
        shell: bash
        run: |
          set +e
          gradle clean check --stacktrace > auth-diagnostic.log 2>&1
          status=$?
          echo "$status" > auth-diagnostic.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: auth-diagnostic
          path: |
            auth-diagnostic.log
            auth-diagnostic.status
          retention-days: 1
