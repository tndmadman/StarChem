name: Windows Observation Store

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Windows observation ACLs
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate observation persistence and ACLs
        run: gradle validateObservationRetention --no-daemon

      - name: Validate private fit cache and ACL setup
        run: java -cp build/classes/java/main com.tndmadman.rts.ClientFitStoreRecoveryValidator
