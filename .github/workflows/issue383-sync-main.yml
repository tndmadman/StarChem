name: Issue 383 Final Main Sync

on:
  push:
    branches:
      - issue-383-procedural-galaxy
    paths:
      - '.github/workflows/issue383-sync-main.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Compile merged tree
        run: gradle clean classes --no-daemon
      - name: Validate issue 383
        run: java -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue383GalaxyGenerationValidator
      - name: Validate legacy galaxy connectivity
        run: gradle validateGalaxyConnectivity --no-daemon
      - name: Validate galaxy wire
        run: gradle validateGalaxyMapWire --no-daemon
      - name: Validate real TCP multiplayer
        run: gradle validateTcpMultiplayer --no-daemon
      - name: Validate respawn authority when present
        run: |
          if [[ -f build/classes/java/main/com/tndmadman/rts/Issue395RespawnAuthorityValidator.class ]]; then
            java -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue395RespawnAuthorityValidator
          fi
      - name: Validate resource visuals when present
        run: |
          if [[ -f build/classes/java/main/com/tndmadman/rts/Issue399ResourceVisualValidator.class ]]; then
            java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue399ResourceVisualValidator
          fi
      - name: Push integrated branch
        run: |
          if git diff --quiet HEAD origin/issue-383-procedural-galaxy && git diff --cached --quiet; then
            if git merge-base --is-ancestor origin/main HEAD && [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/issue-383-procedural-galaxy)" ]]; then
              echo 'Branch already contains latest main.'
            else
              git push origin HEAD:issue-383-procedural-galaxy
            fi
          else
            git push origin HEAD:issue-383-procedural-galaxy
          fi
