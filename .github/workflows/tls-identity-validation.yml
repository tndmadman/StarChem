name: TLS identity and private storage validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/TlsIdentity.java'
      - 'src/main/java/com/tndmadman/rts/PrivateFileSecurity.java'
      - 'src/main/java/com/tndmadman/rts/PrivateFileSecurityValidator.java'
      - 'src/main/java/com/tndmadman/rts/WindowsHostStartupValidator.java'
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVault.java'
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVaultValidator.java'
      - 'src/main/java/com/tndmadman/rts/ClientSessionPropertiesStore.java'
      - 'src/main/java/com/tndmadman/rts/LocalHostSession.java'
      - 'TLS_IDENTITY_SECURITY.md'
      - '.github/workflows/tls-identity-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile StarChem
        run: gradle classes --no-daemon
      - name: Validate private file enforcement
        run: java -cp build/classes/java/main com.tndmadman.rts.PrivateFileSecurityValidator
      - name: Upload private storage failure diagnostics
        if: failure() && hashFiles('private-file-security-failure.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: private-storage-failure-${{ matrix.os }}
          path: private-file-security-failure.txt
          if-no-files-found: error
      - name: Validate protected TLS identity storage
        run: java -cp build/classes/java/main com.tndmadman.rts.TlsIdentityValidator
      - name: Validate protected client credential storage
        run: java -cp build/classes/java/main com.tndmadman.rts.ClientCredentialVaultValidator
      - name: Validate graphical HOST startup on Windows
        if: runner.os == 'Windows'
        run: java -cp build/classes/java/main com.tndmadman.rts.WindowsHostStartupValidator
