name: TLS identity validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/TlsIdentity.java'
      - 'src/main/java/com/tndmadman/rts/PrivateFileSecurity.java'
      - 'src/main/java/com/tndmadman/rts/TlsIdentityValidator.java'
      - 'TLS_IDENTITY_SECURITY.md'
      - '.github/workflows/tls-identity-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile StarChem
        run: gradle classes --no-daemon
      - name: Validate protected TLS identity storage
        run: java -cp build/classes/java/main com.tndmadman.rts.TlsIdentityValidator
