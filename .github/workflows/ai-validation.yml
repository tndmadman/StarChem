name: AI Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai:
    name: Validate organized NPC AI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run complete AI validator suite
        run: ./gradlew -I gradle/ai-validation.gradle validateNpcAiSuite --stacktrace

      - name: Archive checked-out source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starchem-ai-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build.gradle
            settings.gradle
            gradle/**
            gradlew
            gradlew.bat
            src/**
            config/**
            .github/**
