name: Run graphical HOST removal patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-graphical-host
          fetch-depth: 0
      - name: Apply product changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def require_changed(path, before, after):
              if before == after:
                  raise SystemExit(f'No change applied to {path}')
              write(path, after)

          path = 'src/main/java/com/tndmadman/rts/GameFrame.java'
          before = read(path)
          after = before.replace('    private LocalHostSession localHostSession;\n', '')
          after = after.replace('Choose Solo, Host, or Join.', 'Choose Solo or Join.')
          after = re.sub(
              r'        if \(config\.role\(\) == NetworkRole\.SERVER\) \{ launchLocalHostGame\(config\); return; \}\n',
              '        if (config.role() == NetworkRole.SERVER) {\n'
              '            showLobby("Graphical HOST was removed. Start run-starchem-server.bat, then choose JOIN.");\n'
              '            return;\n'
              '        }\n', after, count=1)
          after = re.sub(
              r'\n    private void launchLocalHostGame\(Config config\) \{.*?\n    \}\n\n    private void showGame',
              '\n    private void showGame', after, count=1, flags=re.S)
          after = after.replace(
              '        if (localHostSession != null) localHostSession.stop();\n'
              '        else if (network != null) network.shutdown();\n',
              '        if (network != null) network.shutdown();\n')
          after = after.replace('        localHostSession = null;\n', '')
          require_changed(path, before, after)

          path = 'src/main/java/com/tndmadman/rts/LobbyPanel.java'
          before = read(path)
          after = before.replace('Choose Solo, Host, or Join.', 'Choose Solo or Join.')
          after = after.replace('Multiplayer Fleet Command', 'Solo and Dedicated Multiplayer')
          after = after.replace('        JButton serve = new MenuButton("HOST");\n', '')
          after = after.replace('        box.add(serve);\n', '')
          after = after.replace('        serve.addActionListener(e -> startServer());\n', '')
          after = re.sub(
              r'\n    private void startServer\(\) \{.*?\n    \}\n\n    private void startClient',
              '\n    private void startClient', after, count=1, flags=re.S)
          require_changed(path, before, after)

          path = 'src/main/java/com/tndmadman/rts/Config.java'
          before = read(path)
          after = before.replace('        boolean host = false;\n', '')
          after = after.replace('                    host = true;\n', '')
          after = re.sub(
              r'                case "--host" -> \{\n.*?                \}\n',
              '', after, count=1, flags=re.S)
          after = re.sub(
              r'        if \(host\) \{\n.*?        \}\n        if \(server != null\)',
              '        if (server != null)', after, count=1, flags=re.S)
          require_changed(path, before, after)

          path = 'src/main/java/com/tndmadman/rts/App.java'
          before = read(path)
          after = before.replace(
              '        System.out.println("  java -jar StarChem.jar --host PORT [options]   Host with a local client");\n', '')
          require_changed(path, before, after)

          path = 'src/main/java/com/tndmadman/rts/ClientLaunchValidator.java'
          before = read(path)
          after = before.replace(
              '        Config doubleGalaxy = Config.parse(new String[]{"--host", "50000", "--galaxy-copies", "2"});\n',
              '        Config doubleGalaxy = Config.parse(new String[]{"--solo", "--galaxy-copies", "2"});\n')
          after = after.replace(
              '        expectInvalidArgs("missing host port", new String[]{"--host"});\n',
              '        expectInvalidArgs("graphical host option removed", new String[]{"--host", "50000"});\n')
          require_changed(path, before, after)

          path = 'README.md'
          before = read(path)
          after = before.replace(
              'On Windows, double-click `run-starchem.bat` to open the lobby and choose the game mode and connection options from the menu.',
              'On Windows, double-click `run-starchem.bat` to open the lobby. The graphical menu contains only **SOLO** and **JOIN**; multiplayer servers run as separate dedicated-server processes.')
          after = after.replace(
              'StarChem multiplayer uses framed TCP connections. A host or dedicated server listens on the selected game port, and remote clients connect to that same host and port.',
              'StarChem multiplayer uses framed TCP connections. A dedicated server listens on the selected game port, and clients connect to that server with **JOIN**.')
          after = after.replace(
              ' Graphical HOST mode uses an isolated in-process client and never reuses or overwrites remote-server passwords, sessions, or certificate pins.', '')
          after = after.replace('solo, hosted, and joined games', 'solo and joined games')
          require_changed(path, before, after)

          write('packaging/run-starchem-server.bat', '''@echo off
          setlocal
          cd /d "%~dp0"

          where java >nul 2>&1
          if errorlevel 1 (
              echo Java 17 or newer was not found in PATH.
              echo Install Java, reopen this folder, and run this file again.
              pause
              exit /b 1
          )

          if not exist "StarChem.jar" (
              echo StarChem.jar was not found beside this launcher.
              echo Extract the complete StarChem release ZIP before starting the server.
              pause
              exit /b 1
          )

          if not defined STARCHEM_PORT set "STARCHEM_PORT=50000"
          if not defined STARCHEM_SERVER_NAME set "STARCHEM_SERVER_NAME=StarChem-Server"

          echo Starting %STARCHEM_SERVER_NAME% on TCP port %STARCHEM_PORT%...
          echo Players can connect from the lobby with JOIN.
          echo.

          if defined STARCHEM_DEV_TOKEN_FILE (
              java -Djava.awt.headless=true -jar "StarChem.jar" --server "%STARCHEM_PORT%" --name "%STARCHEM_SERVER_NAME%" --dev-token-file "%STARCHEM_DEV_TOKEN_FILE%" %*
          ) else (
              java -Djava.awt.headless=true -jar "StarChem.jar" --server "%STARCHEM_PORT%" --name "%STARCHEM_SERVER_NAME%" %*
          )

          set "STARCHEM_EXIT=%ERRORLEVEL%"
          if not "%STARCHEM_EXIT%"=="0" (
              echo.
              echo StarChem server exited with code %STARCHEM_EXIT%.
              pause
          )
          exit /b %STARCHEM_EXIT%
          '''.replace('          ', ''))
          PY

          if grep -R -n -E 'Choose Solo, Host, or Join|new MenuButton\("HOST"\)|case "--host"|launchLocalHostGame|Local host failed|--host PORT' src/main/java README.md packaging; then
            echo 'A user-facing graphical HOST route remains.' >&2
            exit 1
          fi

          gradle classes validateClientLaunch --no-daemon
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md packaging/run-starchem-server.bat src/main/java/com/tndmadman/rts/GameFrame.java src/main/java/com/tndmadman/rts/LobbyPanel.java src/main/java/com/tndmadman/rts/Config.java src/main/java/com/tndmadman/rts/App.java src/main/java/com/tndmadman/rts/ClientLaunchValidator.java
          git commit -m 'Remove graphical HOST mode'
          git push origin HEAD:agent/remove-graphical-host
