name: Request StarChem Release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - '.github/release-request.txt'

permissions:
  actions: write
  contents: write

concurrency:
  group: release-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-and-publish:
    name: Validate, tag, and publish requested release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable release request
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < .github/release-request.txt)"
          VERSION="${VERSION#v}"
          NOTES_VERSION="$(sed -n 's/^# StarChem v//p' RELEASE_NOTES.md | head -n 1 | tr -d '\r')"
          TAG="v${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid requested version: $VERSION" >&2
            exit 1
          fi
          if [[ "$NOTES_VERSION" != "$VERSION" ]]; then
            echo "Release notes version $NOTES_VERSION does not match request $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "release/$TAG" ]]; then
            echo "Release branch $GITHUB_REF_NAME must be release/$TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; refusing to move or replace it." >&2
            exit 1
          fi

          echo "STARCHEM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STARCHEM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP=StarChem-$TAG.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=StarChem-$TAG.zip.sha256" >> "$GITHUB_ENV"

      - name: Dispatch the standard release validation workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f version="$STARCHEM_VERSION"

          RUN_ID=""
          for _ in {1..60}; do
            RUN_ID="$(gh run list \
              --workflow release.yml \
              --branch "$GITHUB_REF_NAME" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo 'Unable to locate the dispatched release validation run.' >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched release validation run $RUN_ID"

      - name: Require complete release validation
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --exit-status

      - name: Download validated release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          gh run download "${{ steps.dispatch.outputs.run_id }}" \
            --name "StarChem-release-$GITHUB_SHA" \
            --dir release-artifact

          test -s "release-artifact/$RELEASE_ZIP"
          test -s "release-artifact/$CHECKSUM_FILE"
          (
            cd release-artifact
            sha256sum -c "$CHECKSUM_FILE"
          )

      - name: Create immutable tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$STARCHEM_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$STARCHEM_TAG"

          gh release create "$STARCHEM_TAG" \
            "release-artifact/$RELEASE_ZIP" \
            "release-artifact/$CHECKSUM_FILE" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "StarChem $STARCHEM_TAG" \
            --notes-file RELEASE_NOTES.md
