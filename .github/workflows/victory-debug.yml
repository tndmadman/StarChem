name: Victory Compile Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  compile-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          gradle compileJava --no-daemon --console=plain > victory-compile.log 2>&1
          code=$?
          echo "$code" > victory-exit-code.txt
          tail -n 250 victory-compile.log > victory-compile-tail.log
          exit 0
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-compile-output
          path: |
            victory-compile-tail.log
            victory-exit-code.txt
          if-no-files-found: error
