name: Victory Snapshot Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  validator-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture validator output
        shell: bash
        run: |
          set +e
          gradle validateSnapshotHardening --no-daemon --console=plain --stacktrace > victory-validator.log 2>&1
          code=$?
          echo "$code" > victory-exit-code.txt
          tail -n 500 victory-validator.log > victory-validator-tail.log
          exit 0
      - name: Upload validator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-validator-output
          path: |
            victory-validator-tail.log
            victory-exit-code.txt
          if-no-files-found: error
