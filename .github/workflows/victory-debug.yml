name: Victory Build Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture build output
        shell: bash
        run: |
          set +e
          gradle build --continue --no-daemon --console=plain --stacktrace > victory-build.log 2>&1
          code=$?
          echo "$code" > victory-exit-code.txt
          tail -n 750 victory-build.log > victory-build-tail.log
          exit 0
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-build-output
          path: |
            victory-build-tail.log
            victory-exit-code.txt
          if-no-files-found: error
