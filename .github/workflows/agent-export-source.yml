name: Agent source export

on:
  push:
    branches:
      - agent/issue-289-loadouts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repository metadata
        run: rm -rf .git
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: starchem-source
          path: .
          include-hidden-files: true
          retention-days: 1
