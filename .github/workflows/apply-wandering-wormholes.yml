name: Apply Wandering Wormholes

on:
  push:
    branches:
      - agent/static-galaxy-territory-expansion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-galaxy-territory-expansion
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply and verify changes
        shell: bash
        run: |
          if [[ ! -f .github/apply-wandering-wormholes.ready ]]; then
            echo "Wandering wormhole marker not present."
            exit 0
          fi
          python3 .github/apply-wandering.py
          gradle clean check jar --no-daemon
          rm -f .github/apply-wandering.py .github/apply-wandering-wormholes.ready .github/workflows/apply-wandering-wormholes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable wandering wormholes and continuous system orbits"
          git push origin HEAD:agent/static-galaxy-territory-expansion
