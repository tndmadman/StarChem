# Temporary trigger; removed by the branch hard audit after patching.
name: One-shot station site lock patch

on:
  push:
    branches:
      - agent/fix-corsair-remote-view

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0

      - name: Apply exact committed-site patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java')
          source = source_path.read_text()

          old_call = '''        if (!validSite(world, faction, source, station, plan.targetX, plan.targetY)) {'''
          new_call = '''        if (!committedSiteValid(world, faction, source, station,
                  plan.targetX, plan.targetY)) {'''
          if source.count(old_call) != 1:
              raise SystemExit(f'expected one committed-site call, found {source.count(old_call)}')
          source = source.replace(old_call, new_call)

          marker = '''    private static boolean validSite(World world, NpcFaction faction, Base source,
                                     BaseType station, double x, double y) {'''
          committed_method = '''    /**
     * Keeps a paid construction site stable after initial selection. Moving
     * resource nodes and ships are temporary traffic, not reasons to throw away
     * travel or construction progress. Only persistent geometry may invalidate
     * an already committed site.
     */
    private static boolean committedSiteValid(World world, NpcFaction faction,
                                              Base source, BaseType station,
                                              double x, double y) {
        double margin = Math.max(SITE_MARGIN, station.buildRadius + 90.0);
        if (x < margin || y < margin
                || x > world.width - margin || y > world.height - margin) return false;

        double minimumSpacing = Math.max(300.0, faction.stationSpacing() * 0.72);
        for (Base base : world.bases.values()) {
            if (base.hp <= 0) continue;
            double minimum = faction.id().equals(base.playerId)
                    ? minimumSpacing : Math.max(minimumSpacing, MIN_ENEMY_CLEARANCE);
            if (Calc.distance(x, y, base.x, base.y) < minimum) return false;
        }
        for (WormholeGate gate : world.wormholes) {
            if (Calc.distance(x, y, gate.x, gate.y) < MIN_WORMHOLE_CLEARANCE) return false;
        }
        return source == null
                || Calc.distance(x, y, source.x, source.y) >= minimumSpacing;
    }

'''
          if source.count(marker) != 1:
              raise SystemExit(f'expected one validSite marker, found {source.count(marker)}')
          source = source.replace(marker, committed_method + marker)
          source_path.write_text(source)

          validator_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java')
          validator = validator_path.read_text()
          old_test = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        double almostComplete = Math.max(0, constructing.duration() - 0.25);'''
          new_test = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        ResourceNode crossing = new ResourceNode(90_999, "Crossing Resource",
                NodeKind.SILICATE_ROCK, Material.IRON,
                constructing.targetX(), constructing.targetY(), 5000, 10, 42);
        fixture.world.resources.add(crossing);
        int replansBefore = constructing.replans();
        double remainingBefore = constructing.remaining();
        NpcStationConstructionSystem.update(fixture.world, fixture.faction, 1.0);
        NpcStationConstructionSnapshot locked = NpcStationConstructionSystem.snapshot(
                fixture.world, fixture.faction);
        require(locked.active() && locked.phase() == NpcConstructionPhase.CONSTRUCTING
                        && locked.replans() == replansBefore
                        && Math.abs(locked.targetX() - constructing.targetX()) < EPSILON
                        && Math.abs(locked.targetY() - constructing.targetY()) < EPSILON
                        && locked.remaining() < remainingBefore,
                "moving resource traffic reset a committed construction site");
        fixture.world.resources.remove(crossing);

        double almostComplete = Math.max(0, locked.remaining() - 0.25);'''
          if validator.count(old_test) != 1:
              raise SystemExit(f'expected one construction test block, found {validator.count(old_test)}')
          validator = validator.replace(old_test, new_test)
          validator_path.write_text(validator)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-station-site-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java \
                  src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java \
                  .github/workflows/one-shot-station-site-lock.yml
          git commit -m "lock committed npc station construction sites"
          git push origin HEAD:agent/fix-corsair-remote-view
