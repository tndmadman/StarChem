name: macOS Keychain credential validation

on:
  pull_request:
    paths:
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVault.java'
      - 'src/main/java/com/tndmadman/rts/MacCredentialVaultValidator.java'
      - '.github/workflows/macos-keychain.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVault.java'
      - 'src/main/java/com/tndmadman/rts/MacCredentialVaultValidator.java'
      - '.github/workflows/macos-keychain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keychain:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile StarChem
        run: ./gradlew classes --no-daemon
      - name: Validate Keychain credential isolation
        run: java -cp build/classes/java/main com.tndmadman.rts.MacCredentialVaultValidator
