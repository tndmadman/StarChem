name: macOS Keychain credential validation

on:
  pull_request:
    paths:
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVault.java'
      - 'src/main/java/com/tndmadman/rts/MacCredentialVaultValidator.java'
      - '.github/workflows/macos-keychain.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/ClientCredentialVault.java'
      - 'src/main/java/com/tndmadman/rts/MacCredentialVaultValidator.java'
      - '.github/workflows/macos-keychain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keychain:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile StarChem
        run: gradle classes --no-daemon
      - name: Validate Keychain credential isolation
        shell: bash
        run: |
          set +e
          java -cp build/classes/java/main com.tndmadman.rts.MacCredentialVaultValidator \
            > build/macos-keychain-validator.log 2>&1
          status=$?
          cat build/macos-keychain-validator.log
          exit "$status"
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-keychain-validator-log
          path: build/macos-keychain-validator.log
          if-no-files-found: error
