name: Victory Headless Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  headless-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build jar
        run: gradle clean jar --no-daemon
      - name: Capture headless server log
        shell: bash
        run: |
          set +e
          PORT=50080
          LOG=build/headless-server.log
          SAVE_DIR=build/headless-smoke-saves
          rm -rf "$SAVE_DIR"
          java -Djava.awt.headless=true -jar build/libs/StarChem.jar \
            --server "$PORT" --name CI-Server --save-dir "$SAVE_DIR" \
            --save-name smoke --new-world >"$LOG" 2>&1 &
          SERVER_PID=$!
          for _ in {1..100}; do
            grep -Fq 'Dedicated server ready.' "$LOG" && break
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.1
          done
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          for _ in {1..100}; do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.1
          done
          kill -KILL "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null
          echo $? > build/headless-exit-code.txt
          cat "$LOG"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-headless-output
          path: |
            build/headless-server.log
            build/headless-exit-code.txt
          if-no-files-found: error
