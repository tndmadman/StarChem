name: Issue 291 Acceptance Completion

on:
  push:
    branches:
      - agent/issue-291-command-queues
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish-and-validate:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Finish issue 291 acceptance coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-291-command-queues
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply acceptance completion patch
        run: python3 scripts/finish_issue_291.py

      - name: Validate issue 291 and full repository
        run: gradle clean classes validateIssue291CommandQueues validateTcpMultiplayer validateTcpReconnect check

      - name: Remove one-shot completion tooling
        run: rm -f scripts/finish_issue_291.py .github/workflows/issue-291-finish.yml

      - name: Commit validated completion
        if: github.event_name == 'push'
        run: |
          git config user.name "starchem-issue-291-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No completion changes produced."
            exit 1
          fi
          git commit -m "Finish issue 291 acceptance coverage"
          git push origin HEAD:agent/issue-291-command-queues
