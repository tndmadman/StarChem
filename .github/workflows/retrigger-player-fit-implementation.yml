name: Retrigger player fit implementation

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/retrigger-player-fit-implementation.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove skipped-actor guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-player-fit-implementation.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "")
          path.write_text(text)
          PY
      - name: Commit retrigger
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/retrigger-player-fit-implementation.yml
          git add .github/workflows/apply-player-fit-implementation.yml
          git commit -m "Retrigger player fit implementation"
          git push
