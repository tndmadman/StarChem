name: Controlled StarChem v1.5.7 Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/release-control/v1.5.7/**'

permissions:
  contents: write

concurrency:
  group: controlled-v1.5.7-release
  cancel-in-progress: false

jobs:
  patch-package:
    name: Patch, verify, and package v1.5.7
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-v1.5.7-loopback-tls-control'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      new_sha: ${{ steps.release.outputs.new_sha }}
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply, verify, commit, and package
        id: release
        shell: bash
        run: bash control/.github/release-control/v1.5.7/patch-package.sh repo

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: StarChem-v1.5.7-validated
          path: |
            repo/StarChem-v1.5.7.zip
            repo/StarChem-v1.5.7.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-launcher-smoke:
    name: Validate Windows launchers
    needs: patch-package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.7-validated
          path: release-artifact

      - name: Verify Windows launchers
        shell: pwsh
        run: control/.github/release-control/v1.5.7/windows-validate.ps1 release-artifact '${{ needs.patch-package.outputs.new_sha }}'

  publish-release:
    name: Publish immutable v1.5.7
    needs: [patch-package, windows-launcher-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Check out validated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: StarChem-v1.5.7-validated
          path: release-artifact

      - name: Publish and audit release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash control/.github/release-control/v1.5.7/publish.sh repo release-artifact '${{ needs.patch-package.outputs.new_sha }}'
