name: Apply Intermediate Crafting Patch

on:
  push:
    branches:
      - agent/intermediate-crafting

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          READY=.github/intermediate-crafting.patch.ready
          if [[ ! -f "$READY" ]]; then
            echo "Patch chunks are still being uploaded."
            exit 0
          fi
          cat .github/intermediate-crafting.patch.part* | base64 --decode | gzip --decompress > /tmp/intermediate-crafting.patch
          git apply --check /tmp/intermediate-crafting.patch
          git apply /tmp/intermediate-crafting.patch
          rm -f "$READY" .github/intermediate-crafting.patch.part* .github/workflows/branch-export.yml
          git config user.name "StarChem Build Agent"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add data-driven intermediate crafting economy"
          git push origin HEAD:agent/intermediate-crafting
