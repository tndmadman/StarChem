name: Resource Catalog Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Capture compile and catalog validation output
        shell: bash
        run: |
          set +e
          gradle compileJava validateResourceCatalog --no-daemon --console=plain > resource-catalog-diagnostics.txt 2>&1
          echo "$?" > resource-catalog-exit-code.txt
          cat resource-catalog-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: resource-catalog-diagnostics
          path: |
            resource-catalog-diagnostics.txt
            resource-catalog-exit-code.txt