name: Apply Auth Compatibility Patch

on:
  push:
    branches:
      - agent/fix-auth-enumeration-220

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-auth-enumeration-220
          fetch-depth: 0
      - name: Apply uniform password rejection wording
        shell: python
        run: |
          from pathlib import Path

          server = Path('src/main/java/com/tndmadman/rts/PeerServerSide.java')
          text = server.read_text(encoding='utf-8')
          old = 'denyAuthentication(connectionId, "Authentication failed.");'
          count = text.count(old)
          if count < 1:
              raise SystemExit('Expected authentication failure wording was not found')
          server.write_text(text.replace(old, 'denyAuthentication(connectionId, "Password rejected.");'), encoding='utf-8')

          validator = Path('src/main/java/com/tndmadman/rts/AuthenticationEnumerationValidator.java')
          text = validator.read_text(encoding='utf-8')
          old = '"JOIN_DENIED|Authentication failed.".equals(existingDenial)'
          if old not in text:
              raise SystemExit('Expected validator assertion was not found')
          validator.write_text(text.replace(old, '"JOIN_DENIED|Password rejected.".equals(existingDenial)'), encoding='utf-8')
      - name: Commit compatibility correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "StarChem Auth Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/PeerServerSide.java src/main/java/com/tndmadman/rts/AuthenticationEnumerationValidator.java
          git commit -m "Preserve generic password rejection compatibility"
          git push origin HEAD:agent/fix-auth-enumeration-220
