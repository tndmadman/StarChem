name: Stage fit source archive

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/stage-fit-source-parts.yml

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build chunked source archive
        run: |
          rm -rf .tmp-fit-source
          mkdir -p .tmp-fit-source
          tar --exclude=.git --exclude=.tmp-fit-source -czf /tmp/starchem-fit-source.tgz .
          split -b 450k -d -a 3 /tmp/starchem-fit-source.tgz .tmp-fit-source/part-
          sha256sum /tmp/starchem-fit-source.tgz > .tmp-fit-source/archive.sha256
          wc -c /tmp/starchem-fit-source.tgz > .tmp-fit-source/archive.size
          find .tmp-fit-source -maxdepth 1 -type f -printf '%f\n' | sort > .tmp-fit-source/manifest.txt
      - name: Commit source archive and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-fit-source
          git rm .github/workflows/stage-fit-source-parts.yml
          git commit -m "Add temporary fit source archive"
          git push
