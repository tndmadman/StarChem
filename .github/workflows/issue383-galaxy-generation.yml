name: Issue 383 Galaxy Generation

on:
  push:
    branches:
      - issue-383-procedural-galaxy
  pull_request:
    paths:
      - 'config/galaxy.json'
      - 'docs/issue-383-procedural-galaxy.md'
      - 'src/main/java/com/tndmadman/rts/GalaxyAdvancedSetup.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyCoordinator.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyGenerationSettings.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyGenerationWire.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyInactiveSimulationScheduler.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyMapWire.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyMatchSetup.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyPlan.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyPreview.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyPreviewPanel.java'
      - 'src/main/java/com/tndmadman/rts/GalaxyRuntimeOptions.java'
      - 'src/main/java/com/tndmadman/rts/GalaxySystemIdentity.java'
      - 'src/main/java/com/tndmadman/rts/Issue383GalaxyGenerationValidator.java'
      - 'src/main/java/com/tndmadman/rts/LobbyPanel.java'
      - 'src/main/java/com/tndmadman/rts/World.java'
      - 'src/main/java/com/tndmadman/rts/WanderingWormholePlanner.java'
      - '.github/workflows/issue383-galaxy-generation.yml'

permissions:
  contents: read

concurrency:
  group: issue-383-galaxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile
        run: gradle clean classes --no-daemon
      - name: Validate procedural galaxy generation
        run: java -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue383GalaxyGenerationValidator
      - name: Run existing galaxy connectivity regression
        run: gradle validateGalaxyConnectivity --no-daemon
      - name: Run galaxy wire regression
        run: gradle validateGalaxyMapWire --no-daemon
      - name: Run TCP multiplayer startup regression
        run: gradle validateTcpMultiplayer --no-daemon
      - name: Run current-main respawn authority regression
        run: java -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.Issue395RespawnAuthorityValidator
