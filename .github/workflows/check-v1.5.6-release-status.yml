name: Check v1.5.6 Release Status

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/check-v1.5.6-release-status.yml']

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report standard release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 10 --json databaseId,displayTitle,event,headBranch,headSha,status,conclusion,createdAt > /tmp/runs.json
          python3 - <<'PY' > /tmp/status.md
          import json
          runs=json.load(open('/tmp/runs.json'))
          print('Recent standard release workflow runs:')
          print()
          for run in runs:
              print(f"- run {run['databaseId']}: {run['displayTitle']} — {run['status']} / {run.get('conclusion') or 'pending'}; event={run['event']}; ref={run['headBranch']}; sha={run['headSha'][:12]}")
          PY
          cat /tmp/status.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
