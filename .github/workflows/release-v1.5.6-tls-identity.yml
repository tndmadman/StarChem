name: Release StarChem v1.5.6 TLS Identity Fix

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/release-v1.5.6-tls-identity.yml']

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch-test-tag:
    name: Patch, verify, commit, and tag v1.5.6
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify base and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '247006d9166c0f3c600f78ee8195bb1a8a630468'
          ! git show-ref --verify --quiet refs/tags/v1.5.6
      - name: Apply TLS identity lifecycle fix
        id: patch
        continue-on-error: true
        shell: bash
