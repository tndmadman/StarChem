name: Audit StarChem v1.5.6 Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.5.6-tls-identity.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-release:
    name: Verify published v1.5.6 package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for validated release publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for _ in {1..180}; do
            if gh release view v1.5.6 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,publishedAt,targetCommitish,assets > /tmp/release.json 2>/dev/null; then
              if python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json'))
          names={item['name'] for item in data.get('assets', [])}
          assert data['tagName']=='v1.5.6'
          assert not data['isDraft'] and not data['isPrerelease']
          assert {'StarChem-v1.5.6.zip','StarChem-v1.5.6.zip.sha256'} <= names
          PY
              then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          test "$READY" -eq 1
          cat /tmp/release.json
      - name: Download and verify release package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/starchem-release
          cd /tmp/starchem-release
          gh release download v1.5.6 --repo "$GITHUB_REPOSITORY" --pattern 'StarChem-v1.5.6.zip*'
          sha256sum -c StarChem-v1.5.6.zip.sha256
          unzip -q StarChem-v1.5.6.zip
          VERSION_OUTPUT="$(./StarChem/run-starchem.sh --version)"
          echo "$VERSION_OUTPUT"
          test "$VERSION_OUTPUT" = 'StarChem 1.5.6 (ae79a1d281e4)'
          test -f StarChem/run-starchem.bat
          test -f StarChem/run-starchem-server.bat
      - name: Report successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body 'v1.5.6 publication audit passed: the release is published, both assets are present, the SHA-256 checksum validates, the extracted package reports `StarChem 1.5.6 (ae79a1d281e4)`, and both Windows launchers are included.'
