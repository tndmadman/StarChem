name: Release StarChem v1.5.6 TLS Identity Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.5.6-tls-identity.yml'
      - '.github/patches/release-v1.5.6.py.gz.b64'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch-test-tag:
    name: Patch, verify, commit, and tag v1.5.6
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Load patch from PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Decode patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/release-v1.5.6.py.gz.b64 | gzip -d > /tmp/patch-v1.5.6.py
          python3 -m py_compile /tmp/patch-v1.5.6.py
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify base and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '247006d9166c0f3c600f78ee8195bb1a8a630468'
          ! git show-ref --verify --quiet refs/tags/v1.5.6
      - name: Apply TLS identity lifecycle fix
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch-v1.5.6.py > /tmp/patch-v1.5.6.log 2>&1
          cat /tmp/patch-v1.5.6.log
      - name: Report patch failure
        if: steps.patch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'The v1.5.6 patch did not apply. Diagnostic output:'
            echo
            echo '```text'
            cat /tmp/patch-v1.5.6.log
            echo '```'
          } > /tmp/patch-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/patch-comment.md
          exit 1
      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          gradle clean check jar --no-daemon \
            -PreleaseVersion=1.5.6 \
            -PbuildCommit=validation-v1.5.6
      - name: Commit validated fix to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_NOTES.md README.md src/main/java/com/tndmadman/rts
          git commit -m 'Fix TLS identity lifecycle for v1.5.6'
          FIX_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "sha=$FIX_SHA" >> "$GITHUB_OUTPUT"
      - name: Create immutable v1.5.6 tag
        shell: bash
        run: |
          set -euo pipefail
          FIX_SHA='${{ steps.commit.outputs.sha }}'
          git tag -a v1.5.6 "$FIX_SHA" -m 'StarChem v1.5.6'
          git push origin refs/tags/v1.5.6
