name: Apply local HOST authentication fix

on:
  push:
    branches:
      - agent/debug-local-host-connect
    paths:
      - '.github/workflows/apply-local-host-auth-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/debug-local-host-connect
          fetch-depth: 0
      - name: Apply production fix and clean diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path('src/main/java/com/tndmadman/rts/PeerClientSide.java')
          client = client_path.read_text(encoding='utf-8')
          old = '''    private boolean preparePasswordMaterial(String scopedSalt) {
                  if (config.localHostClientMode()) return !passwordVerifier.isBlank();
                  String fingerprint = SessionTokenStore.serverFingerprint(config);
          '''
          new = '''    private boolean preparePasswordMaterial(String scopedSalt) {
                  if (config.localHostClientMode()) {
                      if (!PasswordAuth.validVerifier(passwordVerifier)
                              || PasswordAuth.decodeHex(scopedSalt).length != 16) {
                          failConnection("The graphical HOST credential is unavailable.");
                          return false;
                      }
                      scopedPasswordVerifier = passwordVerifier;
                      authScopedSalt = scopedSalt.toLowerCase(java.util.Locale.ROOT);
                      derivedScopedCredential = false;
                      rememberScopedCredential = false;
                      return true;
                  }
                  String fingerprint = SessionTokenStore.serverFingerprint(config);
          '''
          if old not in client:
              raise SystemExit('PeerClientSide target block not found')
          client_path.write_text(client.replace(old, new, 1), encoding='utf-8')

          validator_path = Path('src/main/java/com/tndmadman/rts/WindowsHostStartupValidator.java')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace(
              '    private static final Path FAILURE_DIAGNOSTIC = Path.of("build", "windows-host-failure.txt");\n\n', '')
          validator = validator.replace('        Files.deleteIfExists(FAILURE_DIAGNOSTIC);\n', '')
          validator = validator.replace('            verifyLoopbackConnectionRemainsHealthy(session);',
                                        '            verifyLoopbackConnectionReady(session);')
          validator = validator.replace(
              '            System.out.println("Windows graphical host storage and loopback connection validation passed.");',
              '            System.out.println("Windows graphical HOST authenticated loopback validation passed.");')
          validator = validator.replace(
              '''        } catch (Throwable failure) {
                      writeFailureDiagnostic(failure, session);
                      throw failure;
                  } finally {
          ''',
              '''        } finally {
          ''')
          start = validator.index('    private static void verifyLoopbackConnectionRemainsHealthy')
          end = validator.index('    private static Path validateUnsafeLaunchDirectoryFallback', start)
          ready_method = '''    private static void verifyLoopbackConnectionReady(LocalHostSession session) throws Exception {
                  long deadline = System.nanoTime() + 10_000_000_000L;
                  PeerNetwork server = session.devAuthorityNetwork();
                  while (System.nanoTime() < deadline) {
                      if (session.clientNetwork.connectionFailed()) {
                          throw new IllegalStateException("graphical HOST loopback client failed: "
                                  + session.clientNetwork.failureMessage() + " | world status: "
                                  + session.clientWorld.status);
                      }
                      if (session.clientNetwork.clientReady() && server.serverPeerCount() == 1
                              && server.serverSessionConnected("P1")) {
                          return;
                      }
                      Thread.sleep(25L);
                  }
                  ClientConnectionProgress progress = session.clientNetwork.clientConnectionProgress();
                  throw new IllegalStateException("graphical HOST loopback client did not become ready: "
                          + progress.phase() + " | " + progress.detail() + " | server peers: "
                          + server.serverPeerCount() + " | P1 connected: "
                          + server.serverSessionConnected("P1") + " | world status: "
                          + session.clientWorld.status);
              }

          '''
          validator_path.write_text(validator[:start] + ready_method + validator[end:], encoding='utf-8')
          PY
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows
          git add src/main/java/com/tndmadman/rts/PeerClientSide.java src/main/java/com/tndmadman/rts/WindowsHostStartupValidator.java
          git commit -m 'Fix graphical HOST loopback authentication'
          git push origin HEAD:agent/debug-local-host-connect
