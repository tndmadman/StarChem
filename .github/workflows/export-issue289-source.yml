name: Materialize issue 289 source

on:
  pull_request:
    branches: [ agent/issue-289-source-export-base ]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply validated source patch
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.issue289-patch.*)
          if (( ${#chunks[@]} == 0 )); then
            echo "No source patch remains; nothing to materialize."
            exit 0
          fi
          cat "${chunks[@]}" | base64 --decode | gzip --decompress > /tmp/issue289-final.patch
          git apply --check /tmp/issue289-final.patch
          git apply /tmp/issue289-final.patch
          rm "${chunks[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden issue 289 fit isolation and range authority"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
