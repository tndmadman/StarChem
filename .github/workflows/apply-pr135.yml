name: Apply PR 135 Fix

on:
  push:
    branches:
      - agent/static-galaxy-territory-expansion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-galaxy-territory-expansion
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply and verify PR 135
        shell: bash
        run: |
          if [[ ! -f .github/pr135-resolved.ready || ! -f .github/pr135-resolved.patch.gz.b64 ]]; then
            echo "Resolved patch is not complete yet."
            exit 0
          fi
          base64 -d .github/pr135-resolved.patch.gz.b64 | gzip -d > /tmp/pr135-resolved.patch
          git apply --check /tmp/pr135-resolved.patch
          git apply /tmp/pr135-resolved.patch
          gradle check --no-daemon
          rm -f .github/apply-pr135.ready .github/pr135-resolved.ready .github/pr135-resolved.patch.gz.b64 .github/workflows/apply-pr135.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply PR 135 active session takeover fix"
          git push origin HEAD:agent/static-galaxy-territory-expansion
