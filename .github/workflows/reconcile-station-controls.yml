name: Reconcile station controls with main

on:
  push:
    branches:
      - agent/station-control-menus

permissions:
  contents: write

concurrency:
  group: reconcile-station-controls
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/station-control-menus
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Merge current main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_STATUS=$?
          set -e
          if [[ "$MERGE_STATUS" -ne 0 ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              git checkout --ours -- "$file"
              git add "$file"
            done < <(git diff --name-only --diff-filter=U)
          fi
          git add -A
          gradle clean classes --no-daemon
          java -cp build/classes/java/main com.tndmadman.rts.StationControlValidator
          java -cp build/classes/java/main com.tndmadman.rts.RadarTowerValidator
          java -cp build/classes/java/main com.tndmadman.rts.IntelWarfareValidator
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge main into station control menus"
            git push origin HEAD:agent/station-control-menus
          fi
