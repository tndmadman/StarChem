name: Phase 3 Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply Phase 3 repairs
        run: python3 tools/phase3_repair.py

      - name: Validate remote visibility
        run: |
          set -o pipefail
          gradle validateTcpRemoteSystemVisibility --quiet --no-daemon 2>&1 | tee /tmp/phase3-remote.log

      - name: Upload remote visibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-remote-validator
          path: /tmp/phase3-remote.log

      - name: Validate reconnect
        run: gradle validateTcpReconnect --quiet --no-daemon

      - name: Validate view switching
        run: gradle validateTcpViewSwitching --quiet --no-daemon

      - name: Validate multiplayer
        run: gradle validateTcpMultiplayer --quiet --no-daemon

      - name: Validate snapshot hardening
        run: gradle validateSnapshotHardening --quiet --no-daemon

      - name: Validate session recovery
        run: gradle validateSessionRecovery --quiet --no-daemon

      - name: Validate client environment sync
        run: gradle validateClientEnvironmentSync --quiet --no-daemon

      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/com/tndmadman/rts/PeerClientSide.java \
            src/main/java/com/tndmadman/rts/TcpRemoteSystemVisibilityValidator.java \
            src/main/java/com/tndmadman/rts/TcpReconnectIntegrationValidator.java
          git diff --cached --check
          git commit -m "Fix authoritative remote-view synchronization"
          git push origin HEAD:agent/fix-corsair-remote-view
