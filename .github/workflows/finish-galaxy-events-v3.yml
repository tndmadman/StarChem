name: Finish Galaxy Events v3

on:
  push:
    branches: [feature/json-galaxy-events-v3]
    paths: [.github/workflows/finish-galaxy-events-v3.yml]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/json-galaxy-events-v3
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded integration patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Choice events may explicitly terminate instead of falling through into another branch.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '''        int next = event.stageIndex + 1;\n        if (explicitNextStageId != null && !explicitNextStageId.isBlank()) {\n            for (int i = 0; i < definition.stages().size(); i++) {\n                if (explicitNextStageId.equals(definition.stages().get(i).id())) { next = i; break; }\n            }\n        }''',
              '''        int next = event.stageIndex + 1;\n        if ("@complete".equalsIgnoreCase(clean(explicitNextStageId))) {\n            next = definition.stages().size();\n        } else if (explicitNextStageId != null && !explicitNextStageId.isBlank()) {\n            for (int i = 0; i < definition.stages().size(); i++) {\n                if (explicitNextStageId.equals(definition.stages().get(i).id())) { next = i; break; }\n            }\n        }''')

          # Event fleets pursue the nearest human asset even before ordinary target visibility allows attack lock.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '''                    String target = nearestHumanTarget(world, unit);\n                    if (!target.isBlank()) unit.attack(target);''',
              '''                    String target = nearestHumanTarget(world, unit);\n                    if (!target.isBlank()) {\n                        unit.attack(target);\n                        if (unit.attackTarget.isBlank() && CombatTarget.alive(world, target)) {\n                            unit.moveTo(CombatTarget.x(world, target), CombatTarget.y(world, target));\n                        }\n                    }''')

          # Rebase event deadlines when a moving event enters a system whose local scheduler clock has a different epoch.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '    final double expiresAt;\n',
              '    double expiresAt;\n')
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '        event.stageStartedAt = Math.max(0, ServerSaveStore.doubleValue(row, "stageStartedAt", 0));\n',
              '        event.stageStartedAt = ServerSaveStore.doubleValue(row, "stageStartedAt", 0);\n')
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '''        int index = Math.floorMod((event.id + "|" + event.scopeMoves).hashCode(), systems.size());\n        event.currentSystemId = systems.get(index);\n        event.scopeMoves++;\n        event.nextScopeMoveAt = clockFor(state, event.currentSystemId) + definition.scope().moveEverySeconds();''',
              '''        int index = Math.floorMod((event.id + "|" + event.scopeMoves).hashCode(), systems.size());\n        String previousSystemId = event.currentSystemId;\n        double previousClock = clockFor(state, previousSystemId);\n        String nextSystemId = systems.get(index);\n        double nextClock = clockFor(state, nextSystemId);\n        double delta = nextClock - previousClock;\n        event.currentSystemId = nextSystemId;\n        event.expiresAt += delta;\n        if (event.activatedAt >= 0) event.activatedAt += delta;\n        event.stageStartedAt += delta;\n        event.scopeMoves++;\n        event.nextScopeMoveAt = nextClock + definition.scope().moveEverySeconds();''')

          # Reload visual tuning with gameplay config during developer iteration.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java',
              '''                catalog = GalaxyEventExtensionCatalog.load();\n                return List.of("Reloaded config/events.json version " + GalaxyEventExtensionCatalog.SCHEMA_VERSION + ".");''',
              '''                catalog = GalaxyEventExtensionCatalog.load();\n                GalaxyEventVisualCatalog.reload();\n                return List.of("Reloaded config/events.json version " + GalaxyEventExtensionCatalog.SCHEMA_VERSION\n                        + " and config/event-visuals.json version " + GalaxyEventVisualCatalog.SCHEMA_VERSION + ".");''')

          # Validate all authored choice destinations, including the explicit terminal sentinel.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventExtensionCatalog.java',
              '''        if (definition.spawn().pocketSystem().enabled()) validatePocket(definition.id(), definition.spawn().pocketSystem());''',
              '''        for (AdvancedEventStage stage : definition.stages()) {\n            for (AdvancedChoice choice : stage.objective().choices()) {\n                String next = choice.nextStageId();\n                if (!next.isBlank() && !"@complete".equalsIgnoreCase(next) && !stageIds.contains(next)) {\n                    throw new IllegalStateException("Advanced event " + definition.id()\n                            + " choice " + choice.id() + " references unknown stage " + next + ".");\n                }\n            }\n        }\n        if (definition.spawn().pocketSystem().enabled()) validatePocket(definition.id(), definition.spawn().pocketSystem());''')

          # Make the authored fork actually terminate on either selected branch; branch-specific rewards remain data driven.
          replace_once(
              'config/events.json',
              '''            {"id": "stabilize", "label": "Stabilize", "offsetX": -280, "offsetY": 0, "radius": 180, "nextStageId": "stabilized", "rewards": [{"type": "MATERIAL", "material": "SHIELD_GENERATOR", "amount": 1}]},''',
              '''            {"id": "stabilize", "label": "Stabilize", "offsetX": -280, "offsetY": 0, "radius": 180, "nextStageId": "@complete", "rewards": [{"type": "MATERIAL", "material": "SHIELD_GENERATOR", "amount": 1}, {"type": "RESEARCH", "researchId": "advanced_industry"}]},''')
          replace_once(
              'config/events.json',
              '''            {"id": "loot", "label": "Strip for parts", "offsetX": 280, "offsetY": 0, "radius": 180, "nextStageId": "looted", "rewards": [{"type": "MATERIAL", "material": "CIRCUIT_FRAGMENTS", "amount": 95}]}''',
              '''            {"id": "loot", "label": "Strip for parts", "offsetX": 280, "offsetY": 0, "radius": 180, "nextStageId": "@complete", "rewards": [{"type": "MATERIAL", "material": "CIRCUIT_FRAGMENTS", "amount": 95}, {"type": "MATERIAL", "material": "GOLD_CONTACT_MESH", "amount": 10}]}''')

          # Expose the already-implemented event administration through the trusted developer console.
          replace_once(
              'src/main/java/com/tndmadman/rts/ServerDevCommands.java',
              '''            case "spawn" -> spawn(host, args);\n            case "trigger" -> legacyTrigger(host, args);''',
              '''            case "spawn" -> spawn(host, args);\n            case "event", "events" -> GalaxyEventExtensions.admin(host.world,\n                    args.size() <= 1 ? List.of() : args.subList(1, args.size()));\n            case "trigger" -> legacyTrigger(host, args);''')
          replace_once(
              'src/main/java/com/tndmadman/rts/ServerDevCommands.java',
              '''            default -> List.of("Usage: dev <status|mode|access|freebuild|resource|research|ai|timers|faction|production|asset|player|spawn> ...");''',
              '''            default -> List.of("Usage: dev <status|mode|access|freebuild|resource|research|ai|timers|faction|production|asset|player|spawn|events> ...");''')

          # Validate the visual catalog as part of the existing galaxy-event config gate.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventConfigValidator.java',
              '''        validateLegacyCatalog();\n        validateAdvancedCatalog();''',
              '''        validateLegacyCatalog();\n        validateAdvancedCatalog();\n        validateVisualCatalog();''')
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyEventConfigValidator.java',
              '''    private static String validConfig(String events) {''',
              '''    private static void validateVisualCatalog() {\n        GalaxyEventVisualCatalog catalog = GalaxyEventVisualCatalog.loadForValidation(GalaxyEventVisualCatalog.CONFIG_PATH);\n        require(catalog.size() >= 10, "galaxy event visual catalog is unexpectedly small");\n        for (String id : Set.of("ion_storm", "radiation_storm", "resource_surge", "sensor_blackout",\n                "shield_null_zone", "gravitational_disturbance", "stellar_blessing",\n                "precursor_aftershock", "spatial_rift_stabilization", "roaming_radiation_front")) {\n            require(catalog.contains(id), "missing galaxy event visual definition: " + id);\n        }\n    }\n\n    private static String validConfig(String events) {''')

          # Authoritative local galaxy map must include v3 views; pulse/color comes from the JSON visual catalog.
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyMapOverlay.java',
              '''                g.setFont(g.getFont().deriveFont(Font.BOLD, (float)Math.max(8, detailSize - 1)));\n                g.setColor(new Color(235, 195, 255));\n                String eventLine = first.name() + " | " + first.phase().name() + " | "''',
              '''                g.setFont(g.getFont().deriveFont(Font.BOLD, (float)Math.max(8, detailSize - 1)));\n                GalaxyEventVisualStyle visual = GalaxyEventVisualCatalog.visual(first.definitionId());\n                int eventRgb = visual.enabled() ? visual.mapColorRgb() : 0xEBC3FF;\n                int eventAlpha = 255;\n                if (visual.enabled() && visual.mapPulse() && visual.mapPulseSpeed() > 0) {\n                    double pulse = 0.5 + 0.5 * Math.sin(System.nanoTime() / 1_000_000_000.0\n                            * visual.mapPulseSpeed() * Math.PI * 2.0);\n                    eventAlpha = 145 + (int)Math.round(pulse * 110);\n                    double ring = radius + 7 + pulse * 5;\n                    g.setStroke(new BasicStroke(1.8f));\n                    g.setColor(new Color((eventRgb >> 16) & 0xFF, (eventRgb >> 8) & 0xFF, eventRgb & 0xFF, eventAlpha));\n                    g.draw(new Ellipse2D.Double(node.x - ring, node.y - ring, ring * 2, ring * 2));\n                }\n                g.setColor(new Color((eventRgb >> 16) & 0xFF, (eventRgb >> 8) & 0xFF, eventRgb & 0xFF, eventAlpha));\n                String eventLine = first.name() + " | " + first.phase().name() + " | "''')
          replace_once(
              'src/main/java/com/tndmadman/rts/GalaxyMapOverlay.java',
              '''        for (GalaxyEventView view : GalaxyEventDirector.visibleViews(world)) {\n            if (view == null || view.systemId() == null || view.systemId().isBlank()) continue;\n            grouped.computeIfAbsent(view.systemId(), ignored -> new ArrayList<>()).add(view);\n        }\n        return grouped;''',
              '''        for (GalaxyEventView view : GalaxyEventDirector.visibleViews(world)) {\n            if (view == null || view.systemId() == null || view.systemId().isBlank()) continue;\n            grouped.computeIfAbsent(view.systemId(), ignored -> new ArrayList<>()).add(view);\n        }\n        for (GalaxyEventView view : GalaxyEventExtensions.viewsFor(world, PlayerRegistry.localId())) {\n            if (view == null || view.systemId() == null || view.systemId().isBlank()) continue;\n            List<GalaxyEventView> rows = grouped.computeIfAbsent(view.systemId(), ignored -> new ArrayList<>());\n            boolean duplicate = rows.stream().anyMatch(existing -> existing.eventId().equals(view.eventId()));\n            if (!duplicate) rows.add(view);\n        }\n        return grouped;''')

      - name: Compile and validate galaxy events
        run: gradle compileJava validateGalaxyEventConfig validateGalaxyEvents --no-daemon
      - name: Commit finished integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finish-galaxy-events-v3.yml
          git add config/events.json src/main/java/com/tndmadman/rts/GalaxyEventExtensions.java src/main/java/com/tndmadman/rts/GalaxyEventExtensionCatalog.java src/main/java/com/tndmadman/rts/ServerDevCommands.java src/main/java/com/tndmadman/rts/GalaxyEventConfigValidator.java src/main/java/com/tndmadman/rts/GalaxyMapOverlay.java
          git commit -m "Finish JSON-driven galaxy events v3 integration"
          git push origin HEAD:feature/json-galaxy-events-v3
