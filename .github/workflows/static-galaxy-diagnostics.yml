name: Static Galaxy Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Capture compile output
        shell: bash
        run: |
          set +e
          gradle compileJava --no-daemon --stacktrace > compile.log 2>&1
          STATUS=$?
          echo "$STATUS" > compile-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: static-galaxy-compile-log
          path: |
            compile.log
            compile-status.txt
          retention-days: 2
