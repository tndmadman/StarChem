name: Finalize Issue 289

on:
  pull_request:
    branches: [ agent/issue-289-loadouts ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/issue-289-final-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize clean final source
        run: python3 tools/finalize_issue289.py
      - name: Validate clean source tree
        run: gradle clean build
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish issue 289 construction, economics, and atomic refits"
          git push origin HEAD:agent/issue-289-final-hardening
