name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-290-control-groups
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply reconnect reconciliation fix
        run: python3 tools/issue290_reconnect_fix.py
      - run: gradle classes
      - name: Validate fleet control groups
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupValidator
      - name: Validate fleet control groups over TCP
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupTcpValidator
      - name: Commit reconnect fix
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/tndmadman/rts/GamePanel.java; then
            echo 'Reconnect reconciliation fix is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/GamePanel.java
          git commit -m 'Avoid stale control group pruning during reconnect'
          git push origin HEAD:agent/issue-290-control-groups
