name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply final issue 290 hardening in workspace
        run: python3 tools/issue290_harden.py
      - run: gradle build
      - name: Validate fleet control groups
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupValidator
      - name: Validate fleet control groups over TCP
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupTcpValidator
      - name: Export tested issue 290 sources
        uses: actions/upload-artifact@v4
        with:
          name: issue-290-tested-sources
          path: |
            src/main/java/com/tndmadman/rts/GamePanel.java
            src/main/java/com/tndmadman/rts/GalaxyCoordinator.java
            src/main/java/com/tndmadman/rts/ClientViewCache.java
            src/main/java/com/tndmadman/rts/PeerServerSide.java
            src/main/java/com/tndmadman/rts/PeerClientSide.java
            src/main/java/com/tndmadman/rts/GalaxyMapWire.java
      - name: Validate per-client resource replication
        run: java -cp build/classes/java/main com.tndmadman.rts.ResourceReplicationValidator
      - name: Validate authoritative fog persistence
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.AuthoritativeFogOfWarValidator
      - name: Validate authoritative client attack ranges
        run: java -cp build/classes/java/main com.tndmadman.rts.AttackRangeParityValidator
      - name: Validate configured fit rules
        run: java -cp build/classes/java/main com.tndmadman.rts.ConfiguredFitRuleValidator
      - name: Validate world-scoped runtime fit catalogs
        run: java -cp build/classes/java/main com.tndmadman.rts.WorldFitCatalogIsolationValidator
      - name: Validate private fit cache and recovery
        run: java -cp build/classes/java/main com.tndmadman.rts.ClientFitStoreRecoveryValidator
      - name: Validate refit quote persistence
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQuotePersistenceValidator
      - name: Validate atomic distributed refits
        run: java -cp build/classes/java/main com.tndmadman.rts.AtomicRefitTransactionValidator
      - name: Validate custom fit construction
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.CustomFitConstructionValidator
      - name: Validate refitted module effects
        run: java -cp build/classes/java/main com.tndmadman.rts.ShipModuleRefitValidator
      - name: Validate distributed refit queues
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQueuePlannerValidator
      - name: Validate issue 289 lifecycle and authority
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.Issue289CompletionValidator