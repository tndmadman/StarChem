name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-290-control-groups
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply final hardening details
        run: python3 tools/issue290_harden.py
      - run: gradle classes
      - name: Validate fleet control groups
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupValidator
      - name: Validate fleet control groups over TCP
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ControlGroupTcpValidator
      - name: Commit hardened sources
        shell: bash
        run: |
          if git diff --quiet -- \
            src/main/java/com/tndmadman/rts/GamePanel.java \
            src/main/java/com/tndmadman/rts/GalaxyMapWire.java; then
            echo 'Final hardening details are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/GamePanel.java src/main/java/com/tndmadman/rts/GalaxyMapWire.java
          git commit -m 'Finalize issue 290 input and wire hardening'
          git push origin HEAD:agent/issue-290-control-groups
