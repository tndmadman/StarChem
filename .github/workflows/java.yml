name: Java CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-loadouts
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Separate recall maintenance from production advancement
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path('src/main/java/com/tndmadman/rts/ProductionSystem.java')
          text = production.read_text()
          anchor = '''    static void update(World world, double dt) {
              if (world == null || dt < 0) return;
          '''
          replacement = '''    static void updateRefitRecalls(World world) {
              if (world == null) return;
              for (Base base : new ArrayList<>(world.bases.values())) {
                  cleanupInvalidRefits(world, base);
                  recallQueuedRefits(world, base);
              }
          }

              static void update(World world, double dt) {
              if (world == null || dt < 0) return;
          '''
          if text.count(anchor) != 1:
              raise SystemExit('ProductionSystem update anchor was not found exactly once')
          production.write_text(text.replace(anchor, replacement, 1))

          world = Path('src/main/java/com/tndmadman/rts/World.java')
          text = world.read_text()
          old = '        ProductionSystem.update(this, dt);'
          new = '        ProductionSystem.updateRefitRecalls(this);'
          if text.count(old) != 1:
              raise SystemExit('World production update call was not found exactly once')
          world.write_text(text.replace(old, new, 1))
          PY
      - name: Validate fitting and legacy upgrade behavior
        run: |
          gradle clean classes validateShipLoadouts --no-daemon
          gradle check jar --no-daemon
      - name: Commit fix and restore workflow
        run: |
          cat > .github/workflows/java.yml <<'EOF'
          name: Java CI

          on:
            push:
              branches: [ main ]
            pull_request:
              branches: [ main ]

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: gradle/actions/setup-gradle@v4
                - run: gradle build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep ship recall separate from production timers"
          git push origin HEAD:agent/issue-289-loadouts
