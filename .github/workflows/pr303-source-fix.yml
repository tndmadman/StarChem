name: PR 303 source fix

on:
  push:
    branches:
      - agent/validate-v160-upgrade

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-v160-upgrade
          fetch-depth: 0
      - name: Make fixture generator compatible with v1.6.0
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('validation/v1.6.0/V160FixtureGenerator.java')
          text = path.read_text(encoding='utf-8')

          old_import = 'import java.security.MessageDigest;'
          new_import = 'import java.security.KeyStore;\nimport java.security.MessageDigest;'
          if old_import in text and 'import java.security.KeyStore;' not in text:
              text = text.replace(old_import, new_import, 1)

          old_tls = '''        String fingerprint = TlsIdentity.serverFingerprint(config);
        Path tls = serverDir.resolve(SAVE + "-tls.p12");'''
          new_tls = '''        Path tls = serverDir.resolve(SAVE + "-tls.p12");
        String fingerprint = tlsFingerprint(tls);'''
          if old_tls in text:
              text = text.replace(old_tls, new_tls, 1)
          elif new_tls not in text:
              raise SystemExit('Expected TLS fingerprint block was not found')

          marker = '''    private static void saveClient(Player player, String fingerprint) {'''
          helper = '''    private static String tlsFingerprint(Path tls) throws Exception {
        KeyStore store = KeyStore.getInstance("PKCS12");
        try (var input = Files.newInputStream(tls)) {
            store.load(input, "starchem-local-tls".toCharArray());
        }
        var certificate = store.getCertificate("starchem-server");
        if (certificate == null) throw new IllegalStateException("v1.6 TLS certificate is missing");
        return PasswordAuth.encodeVerifier(
                MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded()));
    }

'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('Expected saveClient marker was not found')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- validation/v1.6.0/V160FixtureGenerator.java; then
            echo 'Source already fixed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/v1.6.0/V160FixtureGenerator.java
          git commit -m 'Generate v1.6 TLS fingerprint from the legacy keystore'
          git push origin HEAD:agent/validate-v160-upgrade
