name: Phase 4 Cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0
      - run: bash tools/phase4_cleanup_commit.sh
