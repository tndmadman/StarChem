name: Retired StarChem v1.7.0 Publisher

# Historical tombstone only. StarChem v1.7.0 is already published and this workflow
# intentionally has no release, tag, artifact, or contents-write capability. All current
# release validation and publication goes through .github/workflows/release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: v1.7.0 publisher is retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain current release path
        shell: bash
        run: |
          echo 'StarChem v1.7.0 is already published.'
          echo 'This historical publisher is retired and cannot publish or mutate releases.'
          echo 'Use the validated generic Release StarChem workflow for current releases.'
