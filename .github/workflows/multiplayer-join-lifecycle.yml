name: Multiplayer JOIN lifecycle verification

on:
  push:
    branches:
      - fix/multiplayer-join-reconnect-stability-20261106
  pull_request:
    branches:
      - integration/four-branch-20261105
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: join-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  join-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Java sources
        run: gradle classes --no-daemon
      - name: Focused network, security and session validators
        run: gradle validateNetworkSecurity validateTcpMultiplayer validateTcpMultiClient validateTcpSlowClient validateTcpReconnect validateDedicatedTcpServer validateTcpConnectionIdentity validateSessionRecovery validateTcpJoinLifecycle --no-daemon
      - name: Complete build verification
        run: gradle check --no-daemon
