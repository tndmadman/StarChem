name: Security Review Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-scoped-password-verifiers

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply TLS-bound migration fix
        run: python3 tools/apply_tls_bound_migration_fix.py

      - name: Verify complete project
        run: gradle clean check jar --no-daemon

      - name: Validate cross-server authentication replay resistance
        run: java -cp build/classes/java/main com.tndmadman.rts.AuthenticationEnumerationValidator

      - name: Package validated source
        run: |
          mkdir -p validated-source/src/main/java/com/tndmadman/rts
          cp src/main/java/com/tndmadman/rts/AuthenticationEnumerationValidator.java validated-source/src/main/java/com/tndmadman/rts/
          cp src/main/java/com/tndmadman/rts/PasswordAuth.java validated-source/src/main/java/com/tndmadman/rts/
          cp src/main/java/com/tndmadman/rts/PeerClientSide.java validated-source/src/main/java/com/tndmadman/rts/
          cp src/main/java/com/tndmadman/rts/PeerServerSide.java validated-source/src/main/java/com/tndmadman/rts/
          cp src/main/java/com/tndmadman/rts/PeerTransport.java validated-source/src/main/java/com/tndmadman/rts/
          cp src/main/java/com/tndmadman/rts/TlsIdentity.java validated-source/src/main/java/com/tndmadman/rts/

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: tls-bound-migration-source
          path: validated-source
          if-no-files-found: error
