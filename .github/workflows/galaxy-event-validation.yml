name: Galaxy Event Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-events-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and validate dynamic galaxy events
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile project
        run: gradle clean classes --no-daemon

      - name: Validate dynamic galaxy events
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.GalaxyEventValidator

      - name: Re-run topology validation
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.GalaxyConnectivityValidator

      - name: Re-run system modifier validation
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.SystemModifierValidator

      - name: Re-run galaxy wire validation
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.GalaxyMapWireValidator
