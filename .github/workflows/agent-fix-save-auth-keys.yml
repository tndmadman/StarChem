name: Apply saved authentication key repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-save-auth-keys
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply narrow source repair
        run: |
          rm -f agent-validation.log
          python3 agent-fix-save-auth-keys.py

      - name: Verify focused replay protection
        run: |
          set +e
          ./gradlew validateSavedCredentialReplay validateDevAccess validateSessionRecovery validateDedicatedTcpServer --no-daemon > agent-validation.log 2>&1
          status=$?
          tail -n 180 agent-validation.log
          exit $status

      - name: Preserve failure diagnostics
        if: failure()
        run: |
          cp agent-validation.log /tmp/agent-validation.log
          git reset --hard HEAD
          git clean -fd
          cp /tmp/agent-validation.log agent-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-validation.log
          git commit -m "Record authentication repair validation failure"
          git push origin HEAD:agent/fix-save-auth-keys

      - name: Verify full project
        run: ./gradlew clean check jar --no-daemon

      - name: Commit validated repair
        run: |
          rm -f agent-fix-save-auth-keys.py agent-validation.log .github/workflows/agent-fix-save-auth-keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent saved authentication key replay"
          git push origin HEAD:agent/fix-save-auth-keys
