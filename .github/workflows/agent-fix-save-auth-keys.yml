name: Apply saved authentication key repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-save-auth-keys
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply narrow source repair
        run: python3 agent-fix-save-auth-keys.py

      - name: Verify focused replay protection
        run: ./gradlew validateSavedCredentialReplay validateDevAccess validateSessionRecovery validateDedicatedTcpServer --no-daemon

      - name: Verify full project
        run: ./gradlew clean check jar --no-daemon

      - name: Commit validated repair
        run: |
          rm -f agent-fix-save-auth-keys.py .github/workflows/agent-fix-save-auth-keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent saved authentication key replay"
          git push origin HEAD:agent/fix-save-auth-keys
