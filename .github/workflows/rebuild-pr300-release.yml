name: Rebuild PR 300 release controller

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event.pull_request.number == 300
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate controller for integrated release content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/pr-300-release:refs/remotes/origin/backup/pr-300-release
          git show origin/backup/pr-300-release:.github/workflows/publish-v1.7.0.yml > publish-v1.7.0.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('publish-v1.7.0.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if line.startswith('  TARGET_SHA: '):
                  lines[index] = '  TARGET_SHA: 71bf62d1eb6a35e747ad9b494fded32b6e5e57fb'
                  break
          else:
              raise SystemExit('TARGET_SHA was not found in release controller')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -Fq 'TARGET_SHA: 71bf62d1eb6a35e747ad9b494fded32b6e5e57fb' publish-v1.7.0.yml
      - name: Upload rebuilt controller
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-pr300-release-controller
          path: publish-v1.7.0.yml
          if-no-files-found: error
