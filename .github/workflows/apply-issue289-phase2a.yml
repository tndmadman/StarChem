name: Apply Issue 289 Phase 2A

on:
  pull_request:
    branches: [ agent/issue-289-loadouts ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply conversion refit persistence
        run: python3 tools/apply_issue289_phase2a.py
      - name: Preserve compatible strict-codec diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/StrictProductionQueueCodec.java')
          text = path.read_text(encoding='utf-8')
          old = 'expected 7 or 8 legacy columns, 10 loadout columns, or 13 quote columns, but found '
          new = 'expected 7 or 8 columns for legacy rows, 10 columns for loadout rows, or 13 columns for quote rows, but found '
          if text.count(old) != 1:
              raise SystemExit(f'expected one strict-codec diagnostic, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile
        run: gradle compileJava
      - name: Validate conversion quotes
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQuotePersistenceValidator
      - name: Build and run all validators
        run: gradle build
      - name: Commit validated phase
        run: |
          rm tools/apply_issue289_phase2a.py
          rm .github/workflows/apply-issue289-phase2a.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Persist conversion based refit quotes"
          git fetch origin agent/issue-289-final-hardening
          git rebase origin/agent/issue-289-final-hardening
          git push origin HEAD:agent/issue-289-final-hardening
