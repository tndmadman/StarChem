name: Apply console source bundle

on:
  push:
    branches:
      - agent/server-console-commands

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/server-console-commands
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch and verify source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/179/comments?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          parts = {}
          for item in comments:
              body = item.get("body") or ""
              first, _, rest = body.partition("\n")
              if first.startswith("STARCHEM_SOURCE_BUNDLE_PART "):
                  number = int(first.split()[2].split("/")[0])
                  parts[number] = rest.strip()
          if sorted(parts) != [1, 2, 3]:
              raise SystemExit(f"missing source bundle parts: {sorted(parts)}")

          raw = base64.b64decode("".join(parts[number] for number in (1, 2, 3)), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "4fb7eec63c7e2d56aa49506e9b0c0f9c475a772a5af860b400f49324c1268ef5"
          if digest != expected:
              raise SystemExit(f"bundle checksum mismatch: {digest}")

          bundle = pathlib.Path("/tmp/starchem-source.tar.gz")
          bundle.write_bytes(raw)
          allowed = {
              "README.md",
              "src",
              "src/main",
              "src/main/java",
              "src/main/java/com",
              "src/main/java/com/tndmadman",
              "src/main/java/com/tndmadman/rts",
              "src/main/java/com/tndmadman/rts/ServerCommandExtensions.java",
              "src/main/java/com/tndmadman/rts/MultiplayerCompatibility.java",
              "src/main/java/com/tndmadman/rts/PeerNetworkFacade.java",
              "src/main/java/com/tndmadman/rts/ServerCommandDispatcher.java",
              "src/main/java/com/tndmadman/rts/ServerConsoleValidator.java",
          }
          with tarfile.open(bundle, "r:gz") as archive:
              names = {name.rstrip("/") for name in archive.getnames()}
              unexpected = names - allowed
              if unexpected:
                  raise SystemExit(f"unexpected bundle paths: {sorted(unexpected)}")
              archive.extractall(".")
          PY

      - name: Validate project
        run: ./gradlew --no-daemon build

      - name: Commit source bundle
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-console-source-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete moderation and diagnostics console commands"
          git push origin HEAD:agent/server-console-commands
