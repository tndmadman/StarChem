name: Create and Publish StarChem v1.8.0

on:
  push:
    branches:
      - 'release/v1.8.0-tag-publisher'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Guard, validate, and publish v1.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: 2e4b3b760dbe125fb8c04d1bea5b836fc843f759
      RELEASE_TAG: v1.8.0
      RELEASE_VERSION: 1.8.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release target and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$MAIN_SHA" != "$TARGET_SHA" ]]; then
            echo "Refusing release: main moved to $MAIN_SHA; expected $TARGET_SHA" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$EXISTING_SHA" != "$TARGET_SHA" ]]; then
              echo "Refusing release: $RELEASE_TAG points to $EXISTING_SHA, expected $TARGET_SHA" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points to the validated release commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m 'StarChem v1.8.0'
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
          TAGGED_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "$TAGGED_SHA" == "$TARGET_SHA" ]]
          echo "$RELEASE_TAG is pinned to $TAGGED_SHA"

      - name: Dispatch canonical release validation on the tag
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_ID="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          gh workflow run release.yml --ref "$RELEASE_TAG" -f version="$RELEASE_VERSION"

          RUN_ID=""
          for _ in {1..60}; do
            RUNS_JSON="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=20")"
            RUN_ID="$(jq -r --argjson before "$BEFORE_ID" --arg sha "$TARGET_SHA" '.workflow_runs | map(select(.id > $before and .head_sha == $sha)) | first | .id // empty' <<<"$RUNS_JSON")"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$RUN_ID" ]]; then
            echo 'Could not locate the dispatched canonical release workflow run.' >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Canonical release validation run: $RUN_ID"

      - name: Require canonical release validation to pass
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and independently verify validated artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          ARTIFACT_NAME="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' | grep '^StarChem-release-' | head -n 1)"
          if [[ -z "$ARTIFACT_NAME" ]]; then
            echo 'Canonical release run produced no validated StarChem release artifact.' >&2
            exit 1
          fi

          rm -rf release-artifact verify-package
          mkdir -p release-artifact verify-package
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact

          ZIP="release-artifact/StarChem-$RELEASE_TAG.zip"
          CHECKSUM="$ZIP.sha256"
          test -s "$ZIP"
          test -s "$CHECKSUM"
          (cd release-artifact && sha256sum -c "StarChem-$RELEASE_TAG.zip.sha256")

          unzip -q "$ZIP" -d verify-package
          test -s verify-package/StarChem/StarChem.jar
          test -s verify-package/StarChem/RELEASE_NOTES.md
          VERSION_OUTPUT="$(verify-package/StarChem/run-starchem.sh --version)"
          EXPECTED="StarChem $RELEASE_VERSION (${TARGET_SHA:0:12})"
          [[ "$VERSION_OUTPUT" == "$EXPECTED" ]]
          grep -Fq '# StarChem v1.8.0' verify-package/StarChem/RELEASE_NOTES.md

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release from validated artifacts
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG release already exists; refusing to overwrite it." >&2
            exit 1
          fi

          git show "$RELEASE_TAG:RELEASE_NOTES.md" > release-notes.md
          gh release create "$RELEASE_TAG" \
            "${{ steps.artifact.outputs.zip }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "StarChem $RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$RELEASE_JSON")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" == "false" ]]
          [[ "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" == "false" ]]
          jq -e --arg zip "StarChem-$RELEASE_TAG.zip" '.assets | any(.name == $zip)' <<<"$RELEASE_JSON" >/dev/null
          jq -e --arg sum "StarChem-$RELEASE_TAG.zip.sha256" '.assets | any(.name == $sum)' <<<"$RELEASE_JSON" >/dev/null
          echo "Published release: $(jq -r '.url' <<<"$RELEASE_JSON")"
