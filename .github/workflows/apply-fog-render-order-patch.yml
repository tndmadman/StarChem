name: Apply fog render order patch

on:
  push:
    branches:
      - agent/issue-69-authoritative-fog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-69-authoritative-fog
          fetch-depth: 0

      - name: Move fog to panel render boundary
        shell: python
        run: |
          from pathlib import Path

          panel = Path("src/main/java/com/tndmadman/rts/GamePanel.java")
          text = panel.read_text(encoding="utf-8")
          old = '''        world.draw(g2);
                  if (devMode) aiDevOverlay.drawWorld(g2, world, aiDevPanel.overlayEnabled(), aiDevPanel.pathLinesEnabled());
                  drawSelectionBox(g2);
          '''
          new = '''        world.draw(g2);
                  if (devMode) aiDevOverlay.drawWorld(g2, world, aiDevPanel.overlayEnabled(), aiDevPanel.pathLinesEnabled());
                  FogOfWarView.drawWorld(g2, world);
                  drawSelectionBox(g2);
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected GamePanel render block was not found exactly once")
          panel.write_text(text.replace(old, new, 1), encoding="utf-8")

          renderer = Path("src/main/java/com/tndmadman/rts/UnitRenderer.java")
          text = renderer.read_text(encoding="utf-8")
          draw_call = '''        if (world != null && lastRenderedUnit(world, unit)) FogOfWarView.drawWorld(g2, world);
          '''
          helper = '''    private static boolean lastRenderedUnit(World world, Unit unit) {
                  Unit last = null;
                  for (Unit candidate : world.units.values()) last = candidate;
                  return last == unit;
              }

          '''
          if text.count(draw_call) != 1 or text.count(helper) != 1:
              raise SystemExit("Expected UnitRenderer fog hook was not found exactly once")
          text = text.replace(draw_call, "", 1).replace(helper, "", 1)
          renderer.write_text(text, encoding="utf-8")

      - name: Commit render boundary cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fog-render-order-patch.yml
          git add src/main/java/com/tndmadman/rts/GamePanel.java src/main/java/com/tndmadman/rts/UnitRenderer.java
          git commit -m "Render fog at the game panel boundary"
          git push origin HEAD:agent/issue-69-authoritative-fog
