name: Apply Issue 289 Phase 1

on:
  push:
    branches: [ agent/issue-289-final-hardening ]
  pull_request:
    branches: [ agent/issue-289-loadouts ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply explicit configured fit rules
        run: python3 tools/apply_issue289_phase1.py
      - name: Preserve authored loadout compatibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/weapons.json')
          root = json.loads(path.read_text(encoding='utf-8'))
          weapons = root['weaponTypes']
          for loadout_path in Path('config/loadouts').glob('*.json'):
              doc = json.loads(loadout_path.read_text(encoding='utf-8'))
              for fit_id, fit in doc.get('shipLoadouts', {}).items():
                  hull = fit.get('hullId', fit_id)
                  for weapon_id in fit.get('weapons', []):
                      row = weapons[weapon_id]
                      row['compatibleHulls'] = sorted(set(row.get('compatibleHulls', [])) | {hull})
          path.write_text(json.dumps(root, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build and run all validators
        run: gradle build
      - name: Validate explicit fit rules
        run: java -cp build/classes/java/main com.tndmadman.rts.ConfiguredFitRuleValidator
      - name: Commit validated phase
        run: |
          rm tools/apply_issue289_phase1.py
          rm .github/workflows/apply-issue289-phase1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Configure ship fit compatibility research and costs"
          git push origin HEAD:agent/issue-289-final-hardening
