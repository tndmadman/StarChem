name: Apply Issue 289 Phase 1

on:
  push:
    branches: [ agent/issue-289-final-hardening ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply explicit configured fit rules
        run: python3 tools/apply_issue289_phase1.py
      - name: Build and run all validators
        run: gradle build
      - name: Validate explicit fit rules
        run: java -cp build/classes/java/main com.tndmadman.rts.ConfiguredFitRuleValidator
      - name: Commit validated phase
        run: |
          rm tools/apply_issue289_phase1.py
          rm .github/workflows/apply-issue289-phase1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Configure ship fit compatibility research and costs"
          git push origin HEAD:agent/issue-289-final-hardening
