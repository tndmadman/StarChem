name: Fix removed HOST validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-graphical-host
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Replace stale HOST parser test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/DevAccessPolicyValidator.java')
          text = path.read_text(encoding='utf-8')
          old = '''        Config host = parseLegacy(new String[]{"--host", "50000", "--dev", "--dev-token", TOKEN});
                  expectTrue("host dev mode", host.devMode);
                  expectEquals("host token", TOKEN, host.devToken);
          '''
          new = '''        Config server = parseLegacy(new String[]{"--server", "50000", "--dev", "--dev-token", TOKEN});
                  expectTrue("server dev mode", server.devMode);
                  expectEquals("server token", TOKEN, server.devToken);
          '''
          if old not in text:
              raise SystemExit('Stale HOST validator block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run full check
        id: check
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build
          gradle check --no-daemon --console=plain > build/remove-host-check.log 2>&1
      - name: Extract check tail
        if: always()
        shell: bash
        run: tail -n 220 build/remove-host-check.log > build/remove-host-check-tail.txt
      - name: Upload check tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remove-host-check-${{ github.sha }}
          path: build/remove-host-check-tail.txt
          if-no-files-found: error
          retention-days: 2
      - name: Commit validator fix
        if: steps.check.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/DevAccessPolicyValidator.java
          git commit -m 'Update dev validation for dedicated server launch'
          git push origin HEAD:agent/remove-graphical-host
      - name: Preserve check result
        if: steps.check.outcome == 'failure'
        shell: bash
        run: exit 1
