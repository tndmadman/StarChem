name: Render Performance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/com/tndmadman/rts/**'
      - 'config/**'
      - 'gradle/render-performance.gradle'
      - 'scripts/render-performance.*'
      - '.github/workflows/render-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run structural render regression suite
        run: gradle -I gradle/render-performance.gradle validateRenderPerformance --no-daemon --stacktrace

      - name: Archive render performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/render-performance.csv
