name: Render Performance

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/com/tndmadman/rts/**'
      - 'config/**'
      - 'gradle/render-performance.gradle'
      - 'scripts/render-performance.*'
      - '.github/workflows/render-performance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/com/tndmadman/rts/**'
      - 'config/**'
      - 'gradle/render-performance.gradle'
      - 'scripts/render-performance.*'
      - '.github/workflows/render-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out pull-request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compare three paired baseline and candidate render measurements
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # The runner's p95 can jump under transient GC/scheduling pressure. Alternate
          # checkout order and take three independent samples of EACH exact scenario.
          # This preserves the same 20% p95 regression threshold and never skips a scene.
          for i in 1 2 3; do
            if (( i % 2 == 1 )); then
              checkouts=(base head)
            else
              checkouts=(head base)
            fi
            for checkout in "${checkouts[@]}"; do
              (
                cd "$checkout"
                gradle -I gradle/render-performance.gradle validateRenderPerformance --no-daemon --stacktrace
              )
              cp "$checkout/build/reports/render-performance.csv" \
                "$checkout/build/reports/render-performance-run-$i.csv"
            done
          done
          python3 head/scripts/render-performance-compare.py \
            --base base/build/reports/render-performance-run-{1,2,3}.csv \
            --head head/build/reports/render-performance-run-{1,2,3}.csv \
            --max-regression 20

      - name: Run standalone render validation
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: head
        run: gradle -I gradle/render-performance.gradle validateRenderPerformance --no-daemon --stacktrace

      - name: Archive render performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            head/build/reports/render-performance*.csv
            base/build/reports/render-performance*.csv
