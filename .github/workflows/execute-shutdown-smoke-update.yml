name: Update shutdown smoke expectations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/fix-final-save-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update smoke assertions
        run: python3 .github/update_shutdown_smoke.py

      - name: Commit update
        shell: bash
        run: |
          rm .github/update_shutdown_smoke.py
          rm .github/workflows/execute-shutdown-smoke-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github
          git diff --cached --check
          git commit -m "Update shutdown smoke expectations"
          git push origin HEAD:agent/fix-final-save-shutdown
