name: Export fit source with run id

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/export-fit-source-with-id.yml

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive branch source
        run: |
          git archive --format=zip --output=starchem-issue-289-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: starchem-issue-289-source-by-id
          path: starchem-issue-289-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Record run ID and remove workflow
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > fit-export-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fit-export-run-id.txt
          git rm .github/workflows/export-fit-source-with-id.yml
          git commit -m "Record temporary fit source export run"
          git push
