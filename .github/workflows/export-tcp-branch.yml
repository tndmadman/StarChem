name: Export TCP branch source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/tcp-network-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/starchem-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: starchem-tcp-source
          path: /tmp/starchem-source.tar.gz
          retention-days: 1
