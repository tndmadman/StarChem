name: Apply extended TCP hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/tcp-network-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          cat .tcp-patch/part* > /tmp/payload.b64
          echo "31cb345489eb73f1defd090e1d331bc6afad198b80db93889d3b5dacfe25c674  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 | gzip -d > /tmp/changes.patch
          echo "85afaaf665554950537307767905d56b99b916b077114ba42b5388b5213fdc0c  /tmp/changes.patch" | sha256sum -c -
          git checkout eb7161dd8d9a4436f1b9f4e494dd6e56777913c3 -- .github/workflows/export-tcp-branch.yml
          git apply --check /tmp/changes.patch
          git apply /tmp/changes.patch
          git checkout HEAD -- .github/workflows/export-tcp-branch.yml
          rm -f .github/workflows/tcp-soak.yml
          rm -rf .tcp-patch
          git diff --check
          if git status --short .github/workflows | grep -q .; then
            echo "Workflow files unexpectedly changed in the code push."
            git status --short .github/workflows
            exit 1
          fi

      - name: Validate exact final tree
        run: gradle clean check jar --no-daemon

      - name: Commit final implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden TCP multiplayer integration"
          git push origin HEAD:${{ github.head_ref }}
