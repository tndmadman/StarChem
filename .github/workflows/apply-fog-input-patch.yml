name: Apply fog input patch

on:
  push:
    branches:
      - agent/issue-69-authoritative-fog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-69-authoritative-fog
          fetch-depth: 0

      - name: Gate world hit testing through fog
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/com/tndmadman/rts/GamePanel.java")
          text = path.read_text(encoding="utf-8")

          old = '''    private void clickLeft(MouseEvent e, Point2D p) {
                  String targetSystemId = world.wormholeTargetAt(p.getX(), p.getY());
          '''
          new = '''    private void clickLeft(MouseEvent e, Point2D p) {
                  boolean visiblePoint = FogOfWarView.currentlyVisible(world, p.getX(), p.getY());
                  boolean exploredPoint = FogOfWarView.explored(world, p.getX(), p.getY());
                  String targetSystemId = exploredPoint ? world.wormholeTargetAt(p.getX(), p.getY()) : "";
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected clickLeft header was not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        if (world.jumpThroughWormholeAt(p.getX(), p.getY())) {
                      ProceduralAudio.play(SoundCue.SELECT);
                      return;
                  }
                  Base base = world.baseAt(p.getX(), p.getY());
          '''
          new = '''        if (exploredPoint && world.jumpThroughWormholeAt(p.getX(), p.getY())) {
                      ProceduralAudio.play(SoundCue.SELECT);
                      return;
                  }
                  if (!visiblePoint) {
                      clearSelection();
                      world.status = "Unexplored space.";
                      return;
                  }
                  Base base = world.baseAt(p.getX(), p.getY());
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected clickLeft wormhole block was not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    private void clickRight(Point2D p) {
                  if (commandMode != UnitOrderType.NONE) { handleCommandClick(p); return; }
                  Unit enemyUnit = world.unitAt(p.getX(), p.getY());
          '''
          new = '''    private void clickRight(Point2D p) {
                  if (commandMode != UnitOrderType.NONE) { handleCommandClick(p); return; }
                  boolean visiblePoint = FogOfWarView.currentlyVisible(world, p.getX(), p.getY());
                  boolean exploredPoint = FogOfWarView.explored(world, p.getX(), p.getY());
                  Unit enemyUnit = visiblePoint ? world.unitAt(p.getX(), p.getY()) : null;
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected clickRight header was not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        Base enemyBase = world.baseAt(p.getX(), p.getY());
          '''
          new = '''        Base enemyBase = visiblePoint ? world.baseAt(p.getX(), p.getY()) : null;
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected enemy base hit test was not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        WormholeGate gate = wormholeAt(p);
          '''
          new = '''        WormholeGate gate = exploredPoint ? wormholeAt(p) : null;
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected wormhole hit test was not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        ResourceNode node = world.resourceAt(p.getX(), p.getY());
          '''
          new = '''        ResourceNode node = visiblePoint ? world.resourceAt(p.getX(), p.getY()) : null;
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected resource hit test was not found exactly once")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit fog-aware input handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fog-input-patch.yml
          git add src/main/java/com/tndmadman/rts/GamePanel.java
          git commit -m "Prevent interaction through hidden fog"
          git push origin HEAD:agent/issue-69-authoritative-fog
