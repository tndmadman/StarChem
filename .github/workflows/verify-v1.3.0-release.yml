name: Verify v1.3.0 Release

on:
  push:
    branches:
      - 'release/v1.3.0'
    paths:
      - '.github/workflows/verify-v1.3.0-release.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.3.0
      - name: Verify release and record result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v1.3.0"
          HTTP_STATUS="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API")"
          python - "$HTTP_STATUS" <<'PY'
          import json
          import pathlib
          import sys

          status = sys.argv[1]
          result = {
              "http_status": status,
              "tag": "",
              "draft": None,
              "prerelease": None,
              "asset": "",
              "asset_size": 0,
              "verified": False,
          }
          try:
              payload = json.loads(pathlib.Path("release.json").read_text())
              result["tag"] = payload.get("tag_name", "")
              result["draft"] = payload.get("draft")
              result["prerelease"] = payload.get("prerelease")
              for asset in payload.get("assets", []):
                  if asset.get("name") == "StarChem-v1.3.0.zip":
                      result["asset"] = asset.get("name", "")
                      result["asset_size"] = asset.get("size", 0)
                      break
              result["verified"] = (
                  status == "200"
                  and result["tag"] == "v1.3.0"
                  and result["draft"] is False
                  and result["asset"] == "StarChem-v1.3.0.zip"
                  and result["asset_size"] > 0
              )
          except Exception as exc:
              result["error"] = str(exc)
          pathlib.Path(".github/release-v1.3.0-verification.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-v1.3.0-verification.json
          git commit -m 'Record v1.3.0 release verification'
          git push origin HEAD:release/v1.3.0
