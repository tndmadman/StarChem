name: Apply activity journal clear fix

on:
  push:
    branches: [agent/fix-activity-journal-clear]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Apply, compile, verify, and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch agent/fix-activity-journal-clear \
            "https://x-access-token:${GH_TOKEN}@github.com/tndmadman/StarChem.git" repo
          cd repo
          python3 .github/scripts/apply_activity_clear.py
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          chmod +x gradlew
          ./gradlew --console=plain classes
          java -cp build/classes/java/main com.tndmadman.rts.ServerEventJournalRolloverValidator
          git config user.name "StarChem Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ServerModerationStore.java
          git diff --cached --check
          git commit -m "Make activity journal clearing durable"
          git push origin HEAD:agent/fix-activity-journal-clear
