name: Apply activity journal clear fix

on:
  push:
    branches: [agent/fix-activity-journal-clear]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply production fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/main/java/com/tndmadman/rts/ServerModerationStore.java')
          text = path.read_text(encoding='utf-8')

          clear_start = text.index('    synchronized void clear() {')
          clear_end = text.index('\n    private void load()', clear_start)
          clear_method = dedent('''\
              synchronized void clear() {
                  ServerEvent cleared = new ServerEvent(System.currentTimeMillis(), "ADMIN", "activity",
                          "previous activity history cleared");
                  if (path == null) {
                      events.clear();
                      events.addLast(cleared);
                      return;
                  }
                  try {
                      replace(List.of(cleared));
                  } catch (IOException ex) {
                      throw new IllegalStateException("Could not clear server activity journal: " + ex.getMessage(), ex);
                  }
                  events.clear();
                  events.addLast(cleared);
              }
          ''')
          text = text[:clear_start] + clear_method + text[clear_end:]

          rewrite_start = text.index('    private void rewrite() throws IOException {')
          rewrite_end = text.index('\n    private static String format', rewrite_start)
          rewrite_method = dedent('''\
              private void rewrite() throws IOException {
                  replace(events);
              }

              private void replace(Iterable<ServerEvent> replacement) throws IOException {
                  Path target = path.toAbsolutePath();
                  Path parent = target.getParent();
                  if (parent != null) Files.createDirectories(parent);
                  Path temp = Files.createTempFile(parent, target.getFileName().toString() + ".", ".tmp");
                  boolean replaced = false;
                  try {
                      ArrayList<String> rows = new ArrayList<>();
                      for (ServerEvent event : replacement) {
                          rows.add(event.at() + "\\t" + encode(event.type()) + "\\t" + encode(event.subject()) + "\\t" + encode(event.detail()));
                      }
                      Files.write(temp, rows, StandardCharsets.UTF_8,
                              StandardOpenOption.TRUNCATE_EXISTING, StandardOpenOption.WRITE);
                      try {
                          Files.move(temp, target, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING);
                      } catch (AtomicMoveNotSupportedException ex) {
                          Files.move(temp, target, StandardCopyOption.REPLACE_EXISTING);
                      }
                      replaced = true;
                  } finally {
                      if (!replaced) Files.deleteIfExists(temp);
                  }
              }
          ''')
          path.write_text(text[:rewrite_start] + rewrite_method + text[rewrite_end:], encoding='utf-8')
          PY
      - name: Verify focused server path
        id: verify
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew validateDedicatedTcpServer > activity-clear-verification.log 2>&1
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-clear-verification
          path: activity-clear-verification.log
      - name: Stop on verification failure
        if: steps.verify.outcome == 'failure'
        run: |
          cat activity-clear-verification.log
          exit 1
      - name: Commit verified changes
        run: |
          rm .github/workflows/agent-fix-activity-clear.yml
          git config user.name "StarChem Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ServerModerationStore.java \
                  src/main/java/com/tndmadman/rts/ServerEventJournalRolloverValidator.java \
                  .github/workflows/agent-fix-activity-clear.yml
          git diff --cached --check
          git commit -m "Make activity journal clearing durable"
          git push origin HEAD:agent/fix-activity-journal-clear
