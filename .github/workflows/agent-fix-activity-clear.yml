name: Apply activity journal clear fix

on:
  push:
    branches: [agent/fix-activity-journal-clear]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          show-progress: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply production fix
        run: python3 .github/scripts/apply_activity_clear.py
      - name: Compile project
        run: |
          chmod +x gradlew
          ./gradlew --console=plain classes
      - name: Verify journal behavior
        run: java -cp build/classes/java/main com.tndmadman.rts.ServerEventJournalRolloverValidator
      - name: Commit verified production fix
        run: |
          git config user.name "StarChem Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts/ServerModerationStore.java
          git diff --cached --check
          git commit -m "Make activity journal clearing durable"
          git push origin HEAD:agent/fix-activity-journal-clear
