name: Apply Static Galaxy Patch

on:
  push:
    branches:
      - agent/static-galaxy-territory-expansion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-galaxy-territory-expansion
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          if [[ ! -f .github/static-galaxy-network.ready ]]; then
            echo "Patch payload is not complete yet."
            exit 0
          fi
          cat .github/static-galaxy-network.patch.b64.part* > /tmp/static-galaxy.patch.b64
          base64 -d /tmp/static-galaxy.patch.b64 > /tmp/static-galaxy.patch
          git apply --check /tmp/static-galaxy.patch
          git apply /tmp/static-galaxy.patch
          rm .github/static-galaxy-network.patch.b64.part* .github/static-galaxy-network.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync static galaxy network state"
          git push origin HEAD:agent/static-galaxy-territory-expansion
