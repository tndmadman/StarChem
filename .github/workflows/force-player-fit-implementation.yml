name: Run player-authored fit implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-289-loadouts
      - name: Extract and apply validated patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-player-fit-implementation.yml').read_text()
          marker = "cat > /tmp/player-fit.patch.gz.b64 <<'PATCH'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\nPATCH\n', start)
          Path('/tmp/player-fit.patch.gz.b64').write_text(text[start:end] + '\n')
          PY
          base64 -d /tmp/player-fit.patch.gz.b64 | gzip -d > /tmp/player-fit.patch
          git apply --check /tmp/player-fit.patch
          git apply /tmp/player-fit.patch
          rm -rf .tmp-fit-source fit-network-index.txt fit-source-tree.txt fit-export-run-id.txt
          rm -f .github/workflows/apply-player-fit-implementation.yml
          rm -f .github/workflows/retrigger-player-fit-implementation.yml
          rm -f .github/workflows/force-player-fit-implementation.yml
      - name: Compile and validate
        shell: bash
        run: |
          rm -rf /tmp/starchem-fit-classes
          mkdir -p /tmp/starchem-fit-classes
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 17 -d /tmp/starchem-fit-classes
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.RulesValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.ShipLoadoutValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.ProductionQueueValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.NetworkSecurityValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.TcpMultiplayerValidator
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement player-authored ship fits"
          git push origin HEAD:agent/issue-289-loadouts
