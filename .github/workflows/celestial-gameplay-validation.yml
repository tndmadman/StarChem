name: Celestial Gameplay Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/celestial-gameplay
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/com/tndmadman/rts/CelestialGameplay*.java'
      - 'src/main/java/com/tndmadman/rts/CelestialMoonInheritance*.java'
      - 'src/main/java/com/tndmadman/rts/CelestialObjective*.java'
      - 'src/main/java/com/tndmadman/rts/CelestialResourceBridge*.java'
      - 'src/main/java/com/tndmadman/rts/CelestialExtraction*.java'
      - 'src/main/java/com/tndmadman/rts/CelestialSystem.java'
      - 'src/main/java/com/tndmadman/rts/ResourceNode.java'
      - 'src/main/java/com/tndmadman/rts/ResourceSpawner.java'
      - 'src/main/java/com/tndmadman/rts/ResourceSync.java'
      - 'src/main/java/com/tndmadman/rts/ResourceOrbitSync.java'
      - 'src/main/java/com/tndmadman/rts/NetResourceSync.java'
      - 'src/main/java/com/tndmadman/rts/NetModels.java'
      - 'src/main/java/com/tndmadman/rts/SnapshotWriter.java'
      - 'src/main/java/com/tndmadman/rts/SnapshotReader*.java'
      - 'src/main/java/com/tndmadman/rts/BaseStateParser.java'
      - 'src/main/java/com/tndmadman/rts/NetBaseSync.java'
      - 'src/main/java/com/tndmadman/rts/Peer*.java'
      - 'src/main/java/com/tndmadman/rts/AUnitMove.java'
      - 'src/main/java/com/tndmadman/rts/BPackets.java'
      - 'src/main/java/com/tndmadman/rts/SoundCue.java'
      - 'src/main/java/com/tndmadman/rts/SystemAudio.java'
      - 'src/main/java/com/tndmadman/rts/AudioEventCenter.java'
      - 'src/main/java/com/tndmadman/rts/ProceduralAudio.java'
      - 'src/main/java/com/tndmadman/rts/Base.java'
      - 'src/main/java/com/tndmadman/rts/GameCamera.java'
      - 'src/main/java/com/tndmadman/rts/WorkSystem.java'
      - 'src/main/java/com/tndmadman/rts/SystemControlBonuses.java'
      - 'src/main/java/com/tndmadman/rts/SystemSimulationScheduler.java'
      - 'src/main/java/com/tndmadman/rts/WorldSystemState.java'
      - 'config/celestial-gameplay.json'
      - 'config/starchem.json'
      - 'config/stations.json'
      - '.github/workflows/celestial-gameplay-validation.yml'

permissions:
  contents: read

concurrency:
  group: celestial-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and validate celestial gameplay
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile project
        run: gradle clean classes --no-daemon

      - name: Run production catalog regression validator
        run: java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.ProductionCatalogRulesValidator

      - name: Run celestial gameplay regression validator
        run: java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.CelestialGameplayValidator

      - name: Run planet moon inheritance validator
        run: java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.CelestialMoonInheritanceValidator

      - name: Run planetary extraction validator
        run: java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.CelestialExtractionValidator

      - name: Run live celestial resource bridge validator
        run: java -Djava.awt.headless=true -cp 'build/classes/java/main:build/resources/main' com.tndmadman.rts.CelestialResourceBridgeValidator

      - name: Run snapshot hardening validation
        run: gradle validateSnapshotHardening --no-daemon

      - name: Run TCP multiplayer validation
        run: gradle validateTcpMultiplayer --no-daemon

      - name: Run default verification
        run: gradle check --no-daemon
