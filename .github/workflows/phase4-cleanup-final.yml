name: Phase 4 Final Cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0
      - name: Remove temporary Phase 4 machinery
        run: |
          rm -f \
            .github/workflows/phase4-failed-log-extract.yml \
            .github/workflows/phase4-final-diagnostic.yml \
            .github/workflows/phase4-mobile-depot-fix.yml \
            .github/workflows/phase4-cleanup-final.yml \
            tools/phase4_mobile_depot_fix.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary Phase 4 diagnostics"
          git push origin HEAD:agent/fix-corsair-remote-view
