name: Branch Hard Audit

on:
  push:
    branches:
      - agent/fix-corsair-remote-view

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: branch-hard-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0

      - name: Apply idempotent station site lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java')
          source = source_path.read_text()
          if 'private static boolean committedSiteValid(' not in source:
              candidates = [
                  '''        if (plan.phase == NpcConstructionPhase.TRAVELLING
                  && !validSite(world, faction, source, station, plan.targetX, plan.targetY)) {''',
                  '''        if (!validSite(world, faction, source, station, plan.targetX, plan.targetY)) {'''
              ]
              matches = [candidate for candidate in candidates if candidate in source]
              if len(matches) != 1:
                  raise SystemExit(f'expected one site-retention form, found {len(matches)}')
              source = source.replace(matches[0], '''        if (!committedSiteValid(world, faction, source, station,
                  plan.targetX, plan.targetY)) {''', 1)

              marker = '''    private static boolean validSite(World world, NpcFaction faction, Base source,
                                     BaseType station, double x, double y) {'''
              method = '''    /**
     * Keeps a paid construction site stable after initial selection. Moving
     * resource nodes and ships are temporary traffic, not reasons to discard
     * travel or construction progress. Only persistent geometry may invalidate
     * an already committed site.
     */
    private static boolean committedSiteValid(World world, NpcFaction faction,
                                              Base source, BaseType station,
                                              double x, double y) {
        double margin = Math.max(SITE_MARGIN, station.buildRadius + 90.0);
        if (x < margin || y < margin
                || x > world.width - margin || y > world.height - margin) return false;

        double minimumSpacing = Math.max(300.0, faction.stationSpacing() * 0.72);
        for (Base base : world.bases.values()) {
            if (base.hp <= 0) continue;
            double minimum = faction.id().equals(base.playerId)
                    ? minimumSpacing : Math.max(minimumSpacing, MIN_ENEMY_CLEARANCE);
            if (Calc.distance(x, y, base.x, base.y) < minimum) return false;
        }
        for (WormholeGate gate : world.wormholes) {
            if (Calc.distance(x, y, gate.x, gate.y) < MIN_WORMHOLE_CLEARANCE) return false;
        }
        return source == null
                || Calc.distance(x, y, source.x, source.y) >= minimumSpacing;
    }

'''
              if source.count(marker) != 1:
                  raise SystemExit(f'expected one validSite marker, found {source.count(marker)}')
              source = source.replace(marker, method + marker, 1)
              source_path.write_text(source)

          validator_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java')
          validator = validator_path.read_text()
          if 'moving resource traffic reset a committed construction site' not in validator:
              old = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        double almostComplete = Math.max(0, constructing.duration() - 0.25);'''
              new = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        ResourceNode crossing = new ResourceNode(90_999, "Crossing Resource",
                NodeKind.SILICATE_ROCK, Material.IRON,
                constructing.targetX(), constructing.targetY(), 5000, 10, 42);
        fixture.world.resources.add(crossing);
        int replansBefore = constructing.replans();
        double remainingBefore = constructing.remaining();
        NpcStationConstructionSystem.update(fixture.world, fixture.faction, 1.0);
        NpcStationConstructionSnapshot locked = NpcStationConstructionSystem.snapshot(
                fixture.world, fixture.faction);
        require(locked.active() && locked.phase() == NpcConstructionPhase.CONSTRUCTING
                        && locked.replans() == replansBefore
                        && Math.abs(locked.targetX() - constructing.targetX()) < EPSILON
                        && Math.abs(locked.targetY() - constructing.targetY()) < EPSILON
                        && locked.remaining() < remainingBefore,
                "moving resource traffic reset a committed construction site");
        fixture.world.resources.remove(crossing);

        double almostComplete = Math.max(0, locked.remaining() - 0.25);'''
              if validator.count(old) != 1:
                  raise SystemExit(f'expected one construction regression insertion point, found {validator.count(old)}')
              validator_path.write_text(validator.replace(old, new, 1))
          PY

          rm -f .github/workflows/one-shot-station-site-lock.yml
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java \
                    src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java \
                    .github/workflows/one-shot-station-site-lock.yml
            git commit -m "lock committed npc station construction sites"
            git push origin HEAD:agent/fix-corsair-remote-view
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Full verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .branch-audit
          gradle clean check jar --no-daemon --stacktrace 2>&1 | tee .branch-audit/gradle.log

      - name: Repeat timing-sensitive validators
        id: stress
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for pass in 1 2 3; do
            echo "===== pass ${pass} =====" | tee -a .branch-audit/stress.log
            gradle validateDedicatedTcpServer \
              validateTcpRemoteSystemVisibility \
              validateTcpViewSwitching \
              validateNpcSystemIsolation \
              --rerun-tasks --no-daemon --stacktrace 2>&1 \
              | tee -a .branch-audit/stress.log || failed=1
          done
          exit "$failed"

      - name: Smoke-test jar
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test -f build/libs/StarChem.jar
            java -jar build/libs/StarChem.jar --version
            java -jar build/libs/StarChem.jar --help | grep -F -- '--server [PORT]'
          } 2>&1 | tee .branch-audit/smoke.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hard-audit-${{ github.sha }}
          path: .branch-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Report audit result
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY: ${{ steps.verify.outcome }}
          STRESS: ${{ steps.stress.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- branch-hard-audit -->';
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:agent/fix-corsair-remote-view`,
              state: 'open'
            });
            if (!pulls.data.length) return;
            const files = ['.branch-audit/gradle.log', '.branch-audit/stress.log'];
            let text = files.filter(fs.existsSync).map(file => fs.readFileSync(file, 'utf8')).join('\n');
            const lines = text.split(/\r?\n/);
            const hits = [];
            for (let i = 0; i < lines.length; i++) {
              if (/error:|Exception in thread|IllegalStateException|AssertionError|FAILED|validation failed/i.test(lines[i])) {
                hits.push(...lines.slice(Math.max(0, i - 3), Math.min(lines.length, i + 8)));
              }
            }
            let report = (hits.length ? hits : lines.slice(-100)).join('\n');
            if (report.length > 60000) report = report.slice(-60000);
            const body = `${marker}\n## Branch hard audit\n\nCommit: \`${context.sha}\`\n\n` +
              `Gradle: **${process.env.VERIFY || 'unknown'}**  ` +
              `Repeated validators: **${process.env.STRESS || 'skipped'}**  ` +
              `Smoke: **${process.env.SMOKE || 'skipped'}**\n\n` +
              `<details><summary>Audit output</summary>\n\n\`\`\`text\n${report}\n\`\`\`\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pulls.data[0].number,
              per_page: 100
            });
            const old = comments.find(c => c.body?.includes(marker) && c.user?.type === 'Bot');
            if (old) await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: old.id, body
            });
            else await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pulls.data[0].number, body
            });

      - name: Enforce audit
        if: steps.verify.outcome != 'success' || steps.stress.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: exit 1
