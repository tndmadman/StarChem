name: Branch Hard Audit

on:
  push:
    branches:
      - agent/fix-corsair-remote-view

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: branch-hard-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full compile, validation, package, and smoke audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view
          fetch-depth: 0

      - name: Apply exact committed-site patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java')
          source = source_path.read_text()
          old_call = '''        if (!validSite(world, faction, source, station, plan.targetX, plan.targetY)) {'''
          new_call = '''        if (!committedSiteValid(world, faction, source, station,
                  plan.targetX, plan.targetY)) {'''
          if source.count(old_call) != 1:
              raise SystemExit(f'expected one committed-site call, found {source.count(old_call)}')
          source = source.replace(old_call, new_call)

          marker = '''    private static boolean validSite(World world, NpcFaction faction, Base source,
                                     BaseType station, double x, double y) {'''
          committed_method = '''    /**
     * Keeps a paid construction site stable after initial selection. Moving
     * resource nodes and ships are temporary traffic, not reasons to throw away
     * travel or construction progress. Only persistent geometry may invalidate
     * an already committed site.
     */
    private static boolean committedSiteValid(World world, NpcFaction faction,
                                              Base source, BaseType station,
                                              double x, double y) {
        double margin = Math.max(SITE_MARGIN, station.buildRadius + 90.0);
        if (x < margin || y < margin
                || x > world.width - margin || y > world.height - margin) return false;

        double minimumSpacing = Math.max(300.0, faction.stationSpacing() * 0.72);
        for (Base base : world.bases.values()) {
            if (base.hp <= 0) continue;
            double minimum = faction.id().equals(base.playerId)
                    ? minimumSpacing : Math.max(minimumSpacing, MIN_ENEMY_CLEARANCE);
            if (Calc.distance(x, y, base.x, base.y) < minimum) return false;
        }
        for (WormholeGate gate : world.wormholes) {
            if (Calc.distance(x, y, gate.x, gate.y) < MIN_WORMHOLE_CLEARANCE) return false;
        }
        return source == null
                || Calc.distance(x, y, source.x, source.y) >= minimumSpacing;
    }

'''
          if source.count(marker) != 1:
              raise SystemExit(f'expected one validSite marker, found {source.count(marker)}')
          source = source.replace(marker, committed_method + marker)
          source_path.write_text(source)

          validator_path = Path('src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java')
          validator = validator_path.read_text()
          old_test = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        double almostComplete = Math.max(0, constructing.duration() - 0.25);'''
          new_test = '''        require(Calc.distance(builder.x, builder.y, constructing.targetX(), constructing.targetY()) <= 1.0,
                "construction-site deployer was not anchored at the selected site");

        ResourceNode crossing = new ResourceNode(90_999, "Crossing Resource",
                NodeKind.SILICATE_ROCK, Material.IRON,
                constructing.targetX(), constructing.targetY(), 5000, 10, 42);
        fixture.world.resources.add(crossing);
        int replansBefore = constructing.replans();
        double remainingBefore = constructing.remaining();
        NpcStationConstructionSystem.update(fixture.world, fixture.faction, 1.0);
        NpcStationConstructionSnapshot locked = NpcStationConstructionSystem.snapshot(
                fixture.world, fixture.faction);
        require(locked.active() && locked.phase() == NpcConstructionPhase.CONSTRUCTING
                        && locked.replans() == replansBefore
                        && Math.abs(locked.targetX() - constructing.targetX()) < EPSILON
                        && Math.abs(locked.targetY() - constructing.targetY()) < EPSILON
                        && locked.remaining() < remainingBefore,
                "moving resource traffic reset a committed construction site");
        fixture.world.resources.remove(crossing);

        double almostComplete = Math.max(0, locked.remaining() - 0.25);'''
          if validator.count(old_test) != 1:
              raise SystemExit(f'expected one construction test block, found {validator.count(old_test)}')
          validator = validator.replace(old_test, new_test)
          validator_path.write_text(validator)
          PY

          rm -f .github/workflows/one-shot-station-site-lock.yml
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/main/java/com/tndmadman/rts/NpcStationConstructionSystem.java \
                    src/main/java/com/tndmadman/rts/NpcStationConstructionValidator.java \
                    .github/workflows/one-shot-station-site-lock.yml
            git commit -m "lock committed npc station construction sites"
            git push origin HEAD:agent/fix-corsair-remote-view
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run full Gradle verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .branch-audit
          gradle clean check jar --no-daemon --stacktrace 2>&1 \
            | tee .branch-audit/gradle.log

      - name: Repeat timing-sensitive validators
        id: stress
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for pass in 1 2 3; do
            echo "===== timing-sensitive validation pass ${pass} =====" \
              | tee -a .branch-audit/stress.log
            gradle validateDedicatedTcpServer \
              validateTcpRemoteSystemVisibility \
              validateTcpViewSwitching \
              validateNpcSystemIsolation \
              --rerun-tasks --no-daemon --stacktrace 2>&1 \
              | tee -a .branch-audit/stress.log || failed=1
          done
          exit "$failed"

      - name: Smoke-test built jar
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test -f build/libs/StarChem.jar
            java -jar build/libs/StarChem.jar --version
            java -jar build/libs/StarChem.jar --help | grep -F -- '--server [PORT]'
          } 2>&1 | tee .branch-audit/smoke.log

      - name: Upload complete audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hard-audit-${{ github.sha }}
          path: .branch-audit
          if-no-files-found: error
          retention-days: 7

      - name: Publish audit summary to draft PR
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- branch-hard-audit -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:agent/fix-corsair-remote-view`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (pulls.data.length === 0) return;

            const paths = ['.branch-audit/gradle.log', '.branch-audit/stress.log'];
            let log = paths.filter(path => fs.existsSync(path))
              .map(path => `===== ${path} =====\n${fs.readFileSync(path, 'utf8')}`)
              .join('\n');
            if (!log) log = 'No Gradle log was produced.';
            const lines = log.split(/\r?\n/);
            const needles = [
              /error:/i,
              /Exception in thread/,
              /IllegalStateException/,
              /AssertionError/,
              /^Caused by:/,
              /^> Task .* FAILED/,
              /^\* What went wrong:/,
              /validation failed/i,
              /did not /i,
              /unexpected/i
            ];
            const selected = new Set();
            for (let i = 0; i < lines.length; i++) {
              if (!needles.some(pattern => pattern.test(lines[i]))) continue;
              for (let j = Math.max(0, i - 4); j <= Math.min(lines.length - 1, i + 8); j++) {
                selected.add(j);
              }
            }
            let report;
            if (selected.size > 0) {
              report = [...selected].sort((a, b) => a - b)
                .map(index => `${String(index + 1).padStart(5, ' ')} | ${lines[index]}`)
                .join('\n');
            } else {
              report = lines.slice(-120).join('\n');
            }
            if (report.length > 60000) report = report.slice(-60000);

            const body = `${marker}\n## Branch hard audit\n\n` +
              `Commit: \`${context.sha}\`\n\n` +
              `Gradle: **${process.env.VERIFY_OUTCOME || 'unknown'}**  ` +
              `Repeated validators: **${process.env.STRESS_OUTCOME || 'skipped'}**  ` +
              `Smoke: **${process.env.SMOKE_OUTCOME || 'skipped'}**\n\n` +
              `<details open><summary>Actionable output</summary>\n\n` +
              `\`\`\`text\n${report}\n\`\`\`\n</details>`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pulls.data[0].number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.body && comment.body.includes(marker) && comment.user && comment.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pulls.data[0].number, body
              });
            }

      - name: Fail audit when verification failed
        if: steps.verify.outcome != 'success' || steps.stress.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
