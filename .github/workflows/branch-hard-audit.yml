name: Branch Hard Audit

on:
  push:
    branches:
      - agent/fix-corsair-remote-view

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: branch-hard-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full compile, validation, package, and smoke audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run full Gradle verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .branch-audit
          gradle clean check jar --no-daemon --stacktrace 2>&1 \
            | tee .branch-audit/gradle.log

      - name: Repeat timing-sensitive validators
        id: stress
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for pass in 1 2 3; do
            echo "===== timing-sensitive validation pass ${pass} =====" \
              | tee -a .branch-audit/stress.log
            gradle validateDedicatedTcpServer validateNpcSystemIsolation \
              --rerun-tasks --no-daemon --stacktrace 2>&1 \
              | tee -a .branch-audit/stress.log || failed=1
          done
          exit "$failed"

      - name: Smoke-test built jar
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test -f build/libs/StarChem.jar
            java -jar build/libs/StarChem.jar --version
            java -jar build/libs/StarChem.jar --help | grep -F -- '--server [PORT]'
          } 2>&1 | tee .branch-audit/smoke.log

      - name: Upload complete audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hard-audit-${{ github.sha }}
          path: .branch-audit
          if-no-files-found: error
          retention-days: 7

      - name: Publish audit summary to draft PR
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- branch-hard-audit -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:agent/fix-corsair-remote-view`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (pulls.data.length === 0) return;

            const paths = ['.branch-audit/gradle.log', '.branch-audit/stress.log'];
            let log = paths.filter(path => fs.existsSync(path))
              .map(path => `===== ${path} =====\n${fs.readFileSync(path, 'utf8')}`)
              .join('\n');
            if (!log) log = 'No Gradle log was produced.';
            const lines = log.split(/\r?\n/);
            const needles = [
              /error:/i,
              /Exception in thread/,
              /IllegalStateException/,
              /AssertionError/,
              /^Caused by:/,
              /^> Task .* FAILED/,
              /^\* What went wrong:/,
              /validation failed/i,
              /did not /i,
              /unexpected/i
            ];
            const selected = new Set();
            for (let i = 0; i < lines.length; i++) {
              if (!needles.some(pattern => pattern.test(lines[i]))) continue;
              for (let j = Math.max(0, i - 4); j <= Math.min(lines.length - 1, i + 8); j++) {
                selected.add(j);
              }
            }
            let report;
            if (selected.size > 0) {
              report = [...selected].sort((a, b) => a - b)
                .map(index => `${String(index + 1).padStart(5, ' ')} | ${lines[index]}`)
                .join('\n');
            } else {
              report = lines.slice(-120).join('\n');
            }
            if (report.length > 60000) report = report.slice(-60000);

            const body = `${marker}\n## Branch hard audit\n\n` +
              `Commit: \`${context.sha}\`\n\n` +
              `Gradle: **${process.env.VERIFY_OUTCOME || 'unknown'}**  ` +
              `Repeated validators: **${process.env.STRESS_OUTCOME || 'skipped'}**  ` +
              `Smoke: **${process.env.SMOKE_OUTCOME || 'skipped'}**\n\n` +
              `<details open><summary>Actionable output</summary>\n\n` +
              `\`\`\`text\n${report}\n\`\`\`\n</details>`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pulls.data[0].number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.body && comment.body.includes(marker) && comment.user && comment.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pulls.data[0].number, body
              });
            }

      - name: Fail audit when verification failed
        if: steps.verify.outcome != 'success' || steps.stress.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
