name: Apply validated integration patch

on:
  push:
    branches:
      - integration/starchem-functional-2026-08-27
    paths:
      - '.integration/event-patch/**'
      - '.github/workflows/apply-integration-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact validated event completion patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify, apply, and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/event-patch/gz-* > /tmp/starchem-event-completion.patch.gz
          echo '459daefe0240703f3184e155799ba7f9bab6512a61acd073cd84ee5000cefd24  /tmp/starchem-event-completion.patch.gz' | sha256sum -c -
          gzip -dc /tmp/starchem-event-completion.patch.gz > /tmp/starchem-event-completion.patch
          echo 'cf422ed8b2d9a8d1a01218c11bc6f581c891cd24eabb01b06b98209d14eac1f6  /tmp/starchem-event-completion.patch' | sha256sum -c -
          git apply --check /tmp/starchem-event-completion.patch
          git apply /tmp/starchem-event-completion.patch
          git rm -r .integration/event-patch .github/workflows/apply-integration-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete event rewards, NPC isolation, and temporary topology'
          git push origin HEAD:integration/starchem-functional-2026-08-27
