name: Apply shutdown message fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-final-save-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply message fix
        run: python3 .github/apply_shutdown_message_fix.py

      - name: Compile
        run: gradle --console=plain classes

      - name: Validate shutdown behavior
        run: java -cp build/classes/java/main com.tndmadman.rts.ServerShutdownValidator

      - name: Validate dedicated server path
        run: gradle --console=plain validateDedicatedTcpServer

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/apply_shutdown_message_fix.py
          rm .github/workflows/apply-shutdown-message-fix.yml
          rm -f .github/shutdown-smoke-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts .github
          git diff --cached --check
          git commit -m "Keep clean shutdown output smoke-compatible"
          git push origin HEAD:agent/fix-final-save-shutdown
