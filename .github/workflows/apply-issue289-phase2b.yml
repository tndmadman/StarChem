name: Apply Issue 289 Phase 2B

on:
  pull_request:
    branches: [ agent/issue-289-loadouts ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply atomic refit transactions
        run: python3 tools/apply_issue289_phase2b.py
      - name: Include planner response in validation failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/AtomicRefitTransactionValidator.java')
          text = path.read_text(encoding='utf-8')
          old = '"atomic class refit did not queue every ship");'
          new = '"atomic class refit did not queue every ship: " + success.message());'
          if text.count(old) != 1:
              raise SystemExit(f'expected one atomic success assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile
        run: gradle compileJava
      - name: Validate atomic refits
        run: java -cp build/classes/java/main com.tndmadman.rts.AtomicRefitTransactionValidator
      - name: Validate existing distributed refits
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQueuePlannerValidator
      - name: Build and run all validators
        run: gradle build
      - name: Commit validated phase
        run: |
          rm tools/apply_issue289_phase2b.py
          rm .github/workflows/apply-issue289-phase2b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make distributed refits transactional"
          git fetch origin agent/issue-289-final-hardening
          git rebase origin/agent/issue-289-final-hardening
          git push origin HEAD:agent/issue-289-final-hardening
