name: Apply server developer command source

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/server-console-commands'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Assemble checksum-verified source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          root = Path('.github/server-dev-payload')
          files = [
              ('src/main/java/com/tndmadman/rts/HeadlessGameServer.java',
               'a6d5060de93eceb6267fd9499dff685e266fae3c2875f78f46872725cf85bc38',
               ['h-00', 'h-01', 'h-02', 'h-03']),
              ('src/main/java/com/tndmadman/rts/PeerNetworkFacade.java',
               'ef32ca5591811095b05979b8b8cf59c5fa85696a634978d25a554551ed07fab2',
               ['n-00', 'n-01', 'n-02']),
              ('src/main/java/com/tndmadman/rts/ServerCommandDispatcher.java',
               '3f47f1af36168319cafaf457871b320d0f021e3e2c1091a69e5eac3fcf379981',
               ['d-00', 'd-01']),
              ('src/main/java/com/tndmadman/rts/ServerCommandExtensions.java',
               'd1a971d597c74e9c32f0850b79f7c14fb42914deeceded76efae4b0747751d9a',
               ['e-00', 'e-01', 'e-02']),
              ('src/main/java/com/tndmadman/rts/ServerConsoleValidator.java',
               'a0b0c8bd80f7ee90991b1bfb71d1ced141789d6521d39dbee0f0a3bc5ea91e55',
               ['v-00', 'v-01']),
              ('src/main/java/com/tndmadman/rts/ServerModerationStore.java',
               'cac54df68e75155d8804561048dfdc3489c827e6ad6500858bbf01e16bdd0094',
               ['m-00', 'm-01']),
              ('src/main/java/com/tndmadman/rts/ServerDevCommands.java',
               '78fe24f105732d5ddeb9126108202560af5e1d1ad88559d3cb708e87d3398d3c',
               ['c-00', 'c-01', 'c-02', 'c-03', 'c-04', 'c-05', 'c-06']),
          ]

          for target, expected, parts in files:
              missing = [name for name in parts if not (root / name).is_file()]
              if missing:
                  raise SystemExit(f'{target}: missing source chunks: {missing}')
              data = b''.join((root / name).read_bytes() for name in parts)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{target}: checksum mismatch: expected {expected}, got {actual}')
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f'assembled {target} ({len(data)} bytes, {actual})')

          shutil.rmtree(root)
          Path('.github/workflows/apply-server-dev-commands.yml').unlink()
          PY

      - name: Commit assembled source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add runtime developer and recovery console controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
