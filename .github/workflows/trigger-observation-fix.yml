name: Trigger observation retention fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract and apply focused change
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-observation-retention.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/apply_observations.py').write_text(textwrap.dedent(source[start:end]) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_observations.py
      - name: Remove bootstrap workflows
        run: rm .github/workflows/apply-observation-retention.yml .github/workflows/trigger-observation-fix.yml
      - name: Verify complete project
        run: ./gradlew check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "StarChem Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add observation retention controls (#202)"
          git push origin HEAD:${{ github.head_ref }}
