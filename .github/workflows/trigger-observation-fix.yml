name: Trigger observation retention fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Stop after captured failure
        if: ${{ hashFiles('validation-error.log') != '' }}
        run: echo "Validation failure already captured for inspection."
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('validation-error.log') == '' }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('validation-error.log') == '' }}
      - name: Extract and apply focused change
        if: ${{ hashFiles('validation-error.log') == '' }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-observation-retention.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          raw_lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw_lines) + '\n'
          Path('/tmp/apply_observations.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/apply_observations.py
      - name: Verify complete project
        if: ${{ hashFiles('validation-error.log') == '' }}
        id: verify
        shell: bash
        run: |
          set +e
          ./gradlew check > /tmp/validation-error.log 2>&1
          status=$?
          cat /tmp/validation-error.log
          if [ $status -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/validation-error.log validation-error.log
            git config user.name "StarChem Fix Bot"
            git config user.email "actions@users.noreply.github.com"
            git add validation-error.log
            git commit -m "Capture observation validation failure"
            git push origin HEAD:${{ github.head_ref }}
            exit $status
          fi
      - name: Remove bootstrap workflows
        if: ${{ hashFiles('validation-error.log') == '' }}
        run: rm .github/workflows/apply-observation-retention.yml .github/workflows/trigger-observation-fix.yml
      - name: Commit verified fix
        if: ${{ hashFiles('validation-error.log') == '' }}
        shell: bash
        run: |
          git config user.name "StarChem Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add observation retention controls (#202)"
          git push origin HEAD:${{ github.head_ref }}
