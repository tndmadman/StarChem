name: Execute final-save shutdown fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  execute:
    if: github.head_ref == 'agent/fix-final-save-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract and apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-final-save-shutdown.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'apply-final-save-shutdown', 'exec'))
          PY

      - name: Compile
        run: gradle --console=plain classes

      - name: Validate shutdown behavior
        run: java -cp build/classes/java/main com.tndmadman.rts.ServerShutdownValidator

      - name: Validate dedicated server path
        run: gradle --console=plain validateDedicatedTcpServer

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/apply-final-save-shutdown.yml
          rm .github/workflows/execute-final-save-shutdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/tndmadman/rts .github/workflows
          git diff --cached --check
          git commit -m "Fix final-save shutdown handling"
          git push origin HEAD:agent/fix-final-save-shutdown
