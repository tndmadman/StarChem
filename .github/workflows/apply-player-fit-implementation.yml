name: Apply player-authored fit implementation

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/apply-player-fit-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          cat > /tmp/player-fit.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/player-fit.patch.gz.b64 | gzip -d > /tmp/player-fit.patch
          git apply --check /tmp/player-fit.patch
          git apply /tmp/player-fit.patch
          rm -rf .tmp-fit-source fit-network-index.txt fit-source-tree.txt fit-export-run-id.txt
      - name: Compile and validate
        shell: bash
        run: |
          rm -rf /tmp/starchem-fit-classes
          mkdir -p /tmp/starchem-fit-classes
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 17 -d /tmp/starchem-fit-classes
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.RulesValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.ShipLoadoutValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.ProductionQueueValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.NetworkSecurityValidator
          java -cp /tmp/starchem-fit-classes com.tndmadman.rts.TcpMultiplayerValidator
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-player-fit-implementation.yml
          git add -A
          git commit -m "Implement player-authored ship fits"
          git push
