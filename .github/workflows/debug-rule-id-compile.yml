name: Debug rule ID compile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile Java sources
        run: |
          mkdir -p /tmp/starchem-classes
          javac --release 17 -encoding UTF-8 -d /tmp/starchem-classes $(find src/main/java -name '*.java' -print)
      - name: Validate rules
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.RulesValidator
      - name: Validate production queues
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.ProductionQueueValidator
      - name: Validate dev access
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.DevAccessPolicyValidator
      - name: Validate client launch
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.ClientLaunchValidator
      - name: Validate galaxy connectivity
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.GalaxyConnectivityValidator
      - name: Validate rule IDs
        run: java -cp /tmp/starchem-classes com.tndmadman.rts.RuleIdValidationValidator
