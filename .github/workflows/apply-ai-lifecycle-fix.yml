name: Apply AI Lifecycle Fix

on:
  push:
    paths:
      - .github/workflows/apply-ai-lifecycle-fix.yml
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/fix-corsair-remote-view'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply exact lifecycle edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, already_present):
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  return
              if already_present not in text:
                  raise SystemExit(f'expected source block not found in {path}')

          old_logger = (
              "    /** Called only from the developer UI, which is not drawn outside dev mode. */\n"
              "    static synchronized void requestDevMode() {\n"
              "        devModeRequested = true;\n"
              "    }\n"
          )
          new_logger = (
              "    /** Enables logging only for the lifetime of an authoritative developer session. */\n"
              "    static synchronized void setEnabled(boolean enabled) {\n"
              "        if (devModeRequested == enabled) return;\n"
              "        if (!enabled) {\n"
              "            devModeRequested = false;\n"
              "            shutdown();\n"
              "            MEMORIES.clear();\n"
              "            currentFile = null;\n"
              "            sessionId = \"\";\n"
              "            part = 0;\n"
              "            bytesWritten = 0;\n"
              "            sequence = 0;\n"
              "            lastError = \"\";\n"
              "            return;\n"
              "        }\n"
              "        devModeRequested = true;\n"
              "        lastError = \"\";\n"
              "    }\n"
          )
          replace_once('src/main/java/com/tndmadman/rts/AiBrainLog.java', old_logger, new_logger,
                       'static synchronized void setEnabled(boolean enabled)')

          old_panel = "    void start() { requestFocusInWindow(); ProceduralAudio.prime(); timer.start(); }\n    void stop() { timer.stop(); }\n"
          new_panel = (
              "    void start() {\n"
              "        AiBrainLog.setEnabled(devMode && client == null);\n"
              "        requestFocusInWindow();\n"
              "        ProceduralAudio.prime();\n"
              "        timer.start();\n"
              "    }\n\n"
              "    void stop() {\n"
              "        timer.stop();\n"
              "        AiBrainLog.setEnabled(false);\n"
              "    }\n"
          )
          replace_once('src/main/java/com/tndmadman/rts/GamePanel.java', old_panel, new_panel,
                       'AiBrainLog.setEnabled(devMode && client == null)')

          validator = Path('src/main/java/com/tndmadman/rts/AiBrainLogValidator.java')
          text = validator.read_text()
          old_validation = (
              "            world.status = \"validator status change\";\n"
              "            AiBrainLog.observe(world);\n"
              "            AiBrainLog.closeForTests();\n\n"
              "            List<Path> files = jsonlFiles(directory);\n"
          )
          new_validation = (
              "            world.status = \"validator status change\";\n"
              "            AiBrainLog.observe(world);\n\n"
              "            AiBrainLog.setEnabled(false);\n"
              "            require(!AiBrainLog.recording() && \"off\".equals(AiBrainLog.status()),\n"
              "                    \"brain log did not stop when the developer session ended\");\n"
              "            long disabledBytes = totalBytes(directory);\n"
              "            world.systemTime += 1.1;\n"
              "            AiDevLog.add(world, faction, \"event while logging is disabled\");\n"
              "            AiBrainLog.observe(world);\n"
              "            require(totalBytes(directory) == disabledBytes,\n"
              "                    \"brain log wrote data after it was disabled\");\n\n"
              "            AiBrainLog.setEnabled(true);\n"
              "            world.systemTime += 1.1;\n"
              "            AiBrainLog.observe(world);\n"
              "            AiBrainLog.setEnabled(false);\n"
              "            AiBrainLog.closeForTests();\n\n"
              "            List<Path> files = jsonlFiles(directory);\n"
              "            require(files.size() >= 2,\n"
              "                    \"re-enabling the brain log did not start a new session file\");\n"
          )
          if old_validation in text:
              text = text.replace(old_validation, new_validation, 1)
          elif 'brain log wrote data after it was disabled' not in text:
              raise SystemExit('expected validator lifecycle block not found')

          marker = "    private static String readAll(List<Path> files) throws IOException {\n"
          helper = (
              "    private static long totalBytes(Path directory) throws IOException {\n"
              "        long total = 0;\n"
              "        for (Path path : jsonlFiles(directory)) total += Files.size(path);\n"
              "        return total;\n"
              "    }\n\n"
          )
          if 'private static long totalBytes(Path directory)' not in text:
              if marker not in text:
                  raise SystemExit('validator helper insertion point not found')
              text = text.replace(marker, helper + marker, 1)
          validator.write_text(text)
          PY

      - name: Compile lifecycle fix
        id: compile
        continue-on-error: true
        shell: bash
        run: ./gradlew classes --stacktrace > compile.log 2>&1

      - name: Show compiler result
        if: always()
        shell: bash
        run: tail -n 200 compile.log || true

      - name: Archive compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-lifecycle-compiler-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            compile.log
            src/main/java/com/tndmadman/rts/AiBrainLog.java
            src/main/java/com/tndmadman/rts/GamePanel.java
            src/main/java/com/tndmadman/rts/AiBrainLogValidator.java

      - name: Fail on compiler error
        if: steps.compile.outcome == 'failure'
        run: exit 1
