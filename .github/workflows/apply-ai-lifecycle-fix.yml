name: Apply AI Lifecycle Fix

on:
  push:
    paths:
      - .github/workflows/apply-ai-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/fix-corsair-remote-view'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-corsair-remote-view

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply exact lifecycle edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              'src/main/java/com/tndmadman/rts/AiBrainLog.java',
              '''    /** Called only from the developer UI, which is not drawn outside dev mode. */
              static synchronized void requestDevMode() {
                  devModeRequested = true;
              }
          ''',
              '''    /** Enables logging only for the lifetime of an authoritative developer session. */
              static synchronized void setEnabled(boolean enabled) {
                  if (devModeRequested == enabled) return;
                  if (!enabled) {
                      devModeRequested = false;
                      shutdown();
                      MEMORIES.clear();
                      currentFile = null;
                      sessionId = "";
                      part = 0;
                      bytesWritten = 0;
                      sequence = 0;
                      lastError = "";
                      return;
                  }
                  devModeRequested = true;
                  lastError = "";
              }
          ''')

          replace_exact(
              'src/main/java/com/tndmadman/rts/GamePanel.java',
              '''    void start() { requestFocusInWindow(); ProceduralAudio.prime(); timer.start(); }
              void stop() { timer.stop(); }
          ''',
              '''    void start() {
                  AiBrainLog.setEnabled(devMode && client == null);
                  requestFocusInWindow();
                  ProceduralAudio.prime();
                  timer.start();
              }

              void stop() {
                  timer.stop();
                  AiBrainLog.setEnabled(false);
              }
          ''')

          validator = Path('src/main/java/com/tndmadman/rts/AiBrainLogValidator.java')
          text = validator.read_text()
          old = '''            world.status = "validator status change";
                      AiBrainLog.observe(world);
                      AiBrainLog.closeForTests();

                      List<Path> files = jsonlFiles(directory);
          '''
          new = '''            world.status = "validator status change";
                      AiBrainLog.observe(world);

                      AiBrainLog.setEnabled(false);
                      require(!AiBrainLog.recording() && "off".equals(AiBrainLog.status()),
                              "brain log did not stop when the developer session ended");
                      long disabledBytes = totalBytes(directory);
                      world.systemTime += 1.1;
                      AiDevLog.add(world, faction, "event while logging is disabled");
                      AiBrainLog.observe(world);
                      require(totalBytes(directory) == disabledBytes,
                              "brain log wrote data after it was disabled");

                      AiBrainLog.setEnabled(true);
                      world.systemTime += 1.1;
                      AiBrainLog.observe(world);
                      AiBrainLog.setEnabled(false);
                      AiBrainLog.closeForTests();

                      List<Path> files = jsonlFiles(directory);
                      require(files.size() >= 2,
                              "re-enabling the brain log did not start a new session file");
          '''
          if old not in text:
              raise SystemExit('expected validator lifecycle block not found')
          text = text.replace(old, new, 1)
          marker = '''    private static String readAll(List<Path> files) throws IOException {
          '''
          helper = '''    private static long totalBytes(Path directory) throws IOException {
                  long total = 0;
                  for (Path path : jsonlFiles(directory)) total += Files.size(path);
                  return total;
              }

          '''
          if marker not in text:
              raise SystemExit('validator helper insertion point not found')
          validator.write_text(text.replace(marker, helper + marker, 1))
          PY

      - name: Compile lifecycle fix
        run: ./gradlew classes --stacktrace

      - name: Commit lifecycle fix
        shell: bash
        run: |
          git config user.name 'starchem-ai-fix-bot'
          git config user.email 'starchem-ai-fix-bot@users.noreply.github.com'
          git add src/main/java/com/tndmadman/rts/AiBrainLog.java \
                  src/main/java/com/tndmadman/rts/GamePanel.java \
                  src/main/java/com/tndmadman/rts/AiBrainLogValidator.java
          git diff --cached --check
          git commit -m 'Fix AI brain log lifecycle'
          git push origin HEAD:agent/fix-corsair-remote-view
