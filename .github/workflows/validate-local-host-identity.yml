name: Graphical Host Identity Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/com/tndmadman/rts/PasswordAuth.java'
      - 'src/main/java/com/tndmadman/rts/LocalHostSession.java'
      - 'src/main/java/com/tndmadman/rts/LocalHostIdentityValidator.java'
      - '.github/workflows/validate-local-host-identity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run focused graphical host identity validator
        run: |
          gradle classes --no-daemon
          java -cp build/classes/java/main com.tndmadman.rts.LocalHostIdentityValidator
