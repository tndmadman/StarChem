name: Publish StarChem v1.8.2

on:
  push:
    branches:
      - release-publish/v1.8.2

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-starchem-v1.8.2
  cancel-in-progress: false

env:
  RELEASE_SHA: f401b55b9ac655089ee667b866d988ef1015eb35
  RELEASE_TAG: v1.8.2
  STARCHEM_VERSION: 1.8.2
  RELEASE_ZIP: StarChem-v1.8.2.zip
  CHECKSUM_FILE: StarChem-v1.8.2.zip.sha256
  ARTIFACT_NAME: StarChem-v1.8.2-final

jobs:
  build-release:
    name: Build exact v1.8.2 release package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: f401b55b9ac655089ee667b866d988ef1015eb35
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify release source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]]
          [[ "$(sed -n 's/^# StarChem v//p' RELEASE_NOTES.md | head -n 1 | tr -d '\r')" == "$STARCHEM_VERSION" ]]
          [[ "$(sed -n 's/^releaseVersion=//p' gradle.properties | head -n 1 | tr -d '\r')" == "${STARCHEM_VERSION}-dev" ]]
          grep -Fq 'protocol 17' RELEASE_NOTES.md
          grep -Fq 'rules version 27' RELEASE_NOTES.md
          grep -Fq 'save format 6' RELEASE_NOTES.md

      - name: Build and verify release jar
        shell: bash
        run: |
          set -euo pipefail
          gradle clean check jar --no-daemon \
            -PreleaseVersion="$STARCHEM_VERSION" \
            -PbuildCommit="$RELEASE_SHA"

      - name: Run canonical release regressions
        shell: bash
        run: bash validation/run-release-regressions.sh 'build/classes/java/main:build/resources/main'

      - name: Run multiplayer hotfix regressions
        shell: bash
        run: |
          set -euo pipefail
          gradle validateGalaxyMapWire validateNetworkSecurity validateTcpConnectionIdentity \
            validateTcpMultiplayer validateTcpReconnect validateSessionRecovery --no-daemon \
            -PreleaseVersion="$STARCHEM_VERSION" -PbuildCommit="$RELEASE_SHA"
          bash validation/validate-release-metadata.sh

      - name: Verify reproducible jar
        shell: bash
        run: |
          set -euo pipefail
          cp build/libs/StarChem.jar "$RUNNER_TEMP/StarChem-first.jar"
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/StarChem-first.jar" | awk '{print $1}')"
          gradle clean jar --no-daemon \
            -PreleaseVersion="$STARCHEM_VERSION" \
            -PbuildCommit="$RELEASE_SHA"
          SECOND_SHA="$(sha256sum build/libs/StarChem.jar | awk '{print $1}')"
          echo "First JAR SHA-256:  $FIRST_SHA"
          echo "Second JAR SHA-256: $SECOND_SHA"
          [[ "$FIRST_SHA" == "$SECOND_SHA" ]]
          cmp "$RUNNER_TEMP/StarChem-first.jar" build/libs/StarChem.jar

      - name: Smoke-test release jar
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="StarChem ${STARCHEM_VERSION} (${RELEASE_SHA:0:12})"
          ACTUAL="$(java -jar build/libs/StarChem.jar --version)"
          echo "$ACTUAL"
          [[ "$ACTUAL" == "$EXPECTED" ]]
          HELP="$(java -jar build/libs/StarChem.jar --help)"
          printf '%s\n' "$HELP" | grep -Fq -- '--server [PORT]'
          printf '%s\n' "$HELP" | grep -Fq -- '--event-frequency 0..4'
          printf '%s\n' "$HELP" | grep -Fq -- '--event-categories LIST'
          jar tf build/libs/StarChem.jar | grep -Fx 'META-INF/LICENSE'
          jar tf build/libs/StarChem.jar | grep -Fx 'META-INF/THIRD_PARTY_NOTICES.md'

      - name: Stage deterministic release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/StarChem
          cp build/libs/StarChem.jar release/StarChem/StarChem.jar
          cp -R config release/StarChem/config
          cp packaging/run-starchem.bat release/StarChem/run-starchem.bat
          cp packaging/run-starchem-server.bat release/StarChem/run-starchem-server.bat
          cp packaging/run-starchem.sh release/StarChem/run-starchem.sh
          cp packaging/run-starchem-server.sh release/StarChem/run-starchem-server.sh
          chmod +x release/StarChem/run-starchem.sh release/StarChem/run-starchem-server.sh
          cp README.md release/StarChem/README.md
          cp PLAY.txt release/StarChem/PLAY.txt
          cp RELEASE_NOTES.md release/StarChem/RELEASE_NOTES.md
          cp AUTHENTICATION.md release/StarChem/AUTHENTICATION.md
          cp TLS_IDENTITY_SECURITY.md release/StarChem/TLS_IDENTITY_SECURITY.md
          cp UPGRADING_TO_1.8.0.md release/StarChem/UPGRADING_TO_1.8.0.md
          cp LICENSE release/StarChem/LICENSE
          cp THIRD_PARTY_NOTICES.md release/StarChem/THIRD_PARTY_NOTICES.md

          test -s release/StarChem/LICENSE
          test -s release/StarChem/THIRD_PARTY_NOTICES.md
          test -s release/StarChem/PLAY.txt
          test -s release/StarChem/RELEASE_NOTES.md
          test -s release/StarChem/AUTHENTICATION.md
          test -s release/StarChem/TLS_IDENTITY_SECURITY.md
          test -s release/StarChem/UPGRADING_TO_1.8.0.md
          test -x release/StarChem/run-starchem.sh
          test -x release/StarChem/run-starchem-server.sh
          grep -Fq 'STARCHEM PROPRIETARY SOFTWARE LICENSE' release/StarChem/LICENSE
          grep -Fq 'StarChem is proprietary software.' release/StarChem/README.md
          grep -Fq '# StarChem v1.8.2' release/StarChem/RELEASE_NOTES.md

          mapfile -t TOP_LEVEL_FILES < <(find release/StarChem -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t TOP_LEVEL_DIRS < <(find release/StarChem -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          [[ "${TOP_LEVEL_FILES[*]}" == "AUTHENTICATION.md LICENSE PLAY.txt README.md RELEASE_NOTES.md StarChem.jar THIRD_PARTY_NOTICES.md TLS_IDENTITY_SECURITY.md UPGRADING_TO_1.8.0.md run-starchem-server.bat run-starchem-server.sh run-starchem.bat run-starchem.sh" ]]
          [[ "${TOP_LEVEL_DIRS[*]}" == "config" ]]

          COMMIT_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          find release/StarChem -exec touch -d "@${COMMIT_EPOCH}" {} +
          (
            cd release
            mapfile -t ZIP_ENTRIES < <(find StarChem -print | LC_ALL=C sort)
            printf '%s\n' "${ZIP_ENTRIES[@]}" | zip -X -q "$RELEASE_ZIP" -@
            printf '%s\n' "${ZIP_ENTRIES[@]}" | zip -X -q "${RELEASE_ZIP}.repro" -@
            cmp "$RELEASE_ZIP" "${RELEASE_ZIP}.repro"
            rm "${RELEASE_ZIP}.repro"
          )
          cp "release/$RELEASE_ZIP" .
          sha256sum "$RELEASE_ZIP" > "$CHECKSUM_FILE"
          sha256sum -c "$CHECKSUM_FILE"

      - name: Validate extracted Linux package and dedicated server
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/starchem-v182-linux"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "$RELEASE_ZIP" -d "$ROOT"
          PACKAGE="$ROOT/StarChem"
          EXPECTED="StarChem ${STARCHEM_VERSION} (${RELEASE_SHA:0:12})"
          [[ "$("$PACKAGE/run-starchem.sh" --version)" == "$EXPECTED" ]]
          HELP="$("$PACKAGE/run-starchem-server.sh" --help)"
          printf '%s\n' "$HELP" | grep -Fq -- '--server [PORT]'
          printf '%s\n' "$HELP" | grep -Fq -- '--event-frequency 0..4'
          PORT="$(python3 - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"
          LOG="$RUNNER_TEMP/starchem-v182-linux.log"
          STARCHEM_PORT="$PORT" STARCHEM_SERVER_NAME="v1.8.2-Release-Linux" \
            "$PACKAGE/run-starchem-server.sh" >"$LOG" 2>&1 &
          PID=$!
          cleanup() { kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in {1..150}; do
            if grep -Fq 'Dedicated server ready.' "$LOG"; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$LOG"; exit 1; fi
            sleep 0.1
          done
          [[ "$READY" -eq 1 ]]
          kill -TERM "$PID"
          set +e; wait "$PID"; STATUS=$?; set -e
          trap - EXIT
          [[ "$STATUS" -eq 0 || "$STATUS" -eq 143 ]]
          grep -Fq 'Dedicated server stopped.' "$LOG"

      - name: Upload final release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.CHECKSUM_FILE }}
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Validate final Windows package
    needs: build-release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download final release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact
      - name: Verify checksum and Windows launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path 'release-artifact' $env:RELEASE_ZIP
          $sum = Join-Path 'release-artifact' $env:CHECKSUM_FILE
          $expectedHash = ((Get-Content -LiteralPath $sum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Checksum mismatch" }
          $root = Join-Path $env:RUNNER_TEMP 'starchem-v182-windows'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          Push-Location (Join-Path $root 'StarChem')
          try {
            $actual = (& cmd /c run-starchem.bat --version | Out-String).Trim()
            $expected = "StarChem $env:STARCHEM_VERSION ($($env:RELEASE_SHA.Substring(0,12)))"
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "Windows launcher identity mismatch: $actual" }
            $help = (& cmd /c run-starchem-server.bat --help | Out-String)
            if ($LASTEXITCODE -ne 0 -or $help -notmatch '--server \[PORT\]') { throw 'Windows server launcher failed' }
            if ($help -notmatch '--event-frequency 0\.\.4') { throw 'Windows server help missing event-frequency' }
          } finally { Pop-Location }

  macos-smoke:
    name: Validate final macOS package
    needs: build-release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download final release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact
      - name: Verify package, launchers, Keychain, and server
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          EXPECTED_HASH="$(awk '{print $1}' "$CHECKSUM_FILE")"
          ACTUAL_HASH="$(shasum -a 256 "$RELEASE_ZIP" | awk '{print $1}')"
          [[ "$ACTUAL_HASH" == "$EXPECTED_HASH" ]]
          unzip -q "$RELEASE_ZIP" -d extracted
          chmod +x extracted/StarChem/run-starchem.sh extracted/StarChem/run-starchem-server.sh
          PACKAGE="$PWD/extracted/StarChem"
          EXPECTED="StarChem ${STARCHEM_VERSION} (${RELEASE_SHA:0:12})"
          [[ "$("$PACKAGE/run-starchem.sh" --version)" == "$EXPECTED" ]]
          HELP="$("$PACKAGE/run-starchem-server.sh" --help)"
          printf '%s\n' "$HELP" | grep -Fq -- '--server [PORT]'
          java -Djava.awt.headless=true -cp "$PACKAGE/StarChem.jar" com.tndmadman.rts.MacCredentialVaultValidator
          PORT="$(python3 - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"
          LOG="$RUNNER_TEMP/starchem-v182-macos.log"
          STARCHEM_PORT="$PORT" STARCHEM_SERVER_NAME="v1.8.2-Release-macOS" \
            "$PACKAGE/run-starchem-server.sh" >"$LOG" 2>&1 &
          PID=$!
          cleanup() { kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in {1..150}; do
            if grep -Fq 'Dedicated server ready.' "$LOG"; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$LOG"; exit 1; fi
            sleep 0.1
          done
          [[ "$READY" -eq 1 ]]
          kill -TERM "$PID"
          set +e; wait "$PID"; STATUS=$?; set -e
          trap - EXIT
          [[ "$STATUS" -eq 0 || "$STATUS" -eq 143 ]]
          grep -Fq 'Dedicated server stopped.' "$LOG"

  publish-release:
    name: Tag and publish public v1.8.2 GitHub Release
    needs:
      - build-release
      - windows-smoke
      - macos-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact release source and notes
        uses: actions/checkout@v4
        with:
          ref: f401b55b9ac655089ee667b866d988ef1015eb35
          fetch-depth: 0
      - name: Download final release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact
      - name: Create immutable v1.8.2 tag and public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          sha256sum -c <(sed "s#  #  release-artifact/#" "release-artifact/$CHECKSUM_FILE")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$RELEASE_SHA" ]]
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "StarChem $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release-artifact/$RELEASE_ZIP" \
              "release-artifact/$CHECKSUM_FILE" --clobber
            gh release edit "$RELEASE_TAG" --title "StarChem $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$RELEASE_TAG" \
              "release-artifact/$RELEASE_ZIP" \
              "release-artifact/$CHECKSUM_FILE" \
              --title "StarChem $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/git/tags/{}" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release view "$RELEASE_TAG" --json url,tagName,name,isDraft,isPrerelease,assets
