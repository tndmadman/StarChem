name: Export fit implementation source

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/export-fit-implementation-source.yml

permissions:
  contents: write

env:
  CI: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive branch source
        run: |
          git archive --format=zip --output=starchem-issue-289-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: starchem-issue-289-source
          path: starchem-issue-289-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary export workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/export-fit-implementation-source.yml
          git commit -m "Remove temporary source export workflow"
          git push
