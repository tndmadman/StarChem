name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-auth-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/server-scoped-password-verifiers
      - name: Scan authentication call sites
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -R -n -E 'SessionTokenStore\.saveAuthDigest|SessionTokenStore\.rememberAuthDigestForProcess|PasswordAuth\.verifier|server\.join\(|ServerSide\.join\(' src/main/java/com/tndmadman/rts || true
          } > auth-usage-scan.txt
          cat auth-usage-scan.txt
          git config user.name "StarChem Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f auth-usage-scan.txt
          git commit -m "Record authentication fixture scan"
          git push origin HEAD:agent/server-scoped-password-verifiers
