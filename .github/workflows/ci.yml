name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-auth-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/server-scoped-password-verifiers
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Repair known assertion target
        run: python3 tools/repair_auth_patcher.py
      - name: Run asserted patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 tools/apply_server_scoped_auth_fix.py > auth-patch.log 2>&1
          STATUS=$?
          cat auth-patch.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp auth-patch.log auth-patch.txt
          git config user.name "StarChem Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f auth-patch.txt
          git commit -m "Record server-scoped auth patch failure"
          git push origin HEAD:agent/server-scoped-password-verifiers
          exit 1
      - name: Compile patched source
        if: steps.patch.outputs.status == '0'
        run: gradle clean compileJava --no-daemon
