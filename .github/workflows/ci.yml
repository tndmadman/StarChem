name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-issue289-atomic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and commit atomic refits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ISSUE289_ATOMIC_GATE: 'true'
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-289-final-hardening
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply atomic refit transactions
        run: python3 tools/apply_issue289_phase2b.py
      - name: Align focused validator with configured research
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/tndmadman/rts/AtomicRefitTransactionValidator.java')
          text = path.read_text(encoding='utf-8')
          old_research = '        world.completeResearch(player, "advanced_industry");\n'
          new_research = '''        ShipFitSpec spec = new ShipFitSpec("prospector", List.of(), List.of("afterburner"));
        for (String topic : PlayerFitRules.requiredResearch(spec)) world.completeResearch(player, topic);
'''
          if text.count(old_research) != 1:
              raise SystemExit(f'expected one research setup, found {text.count(old_research)}')
          text = text.replace(old_research, new_research, 1)
          declaration = '        ShipFitSpec spec = new ShipFitSpec("prospector", List.of(), List.of("afterburner"));\n'
          if text.count(declaration) != 2:
              raise SystemExit(f'expected two spec declarations after insertion, found {text.count(declaration)}')
          first = text.find(declaration)
          second = text.find(declaration, first + 1)
          text = text[:second] + text[second + len(declaration):]
          old_message = '"atomic class refit did not queue every ship");'
          new_message = '"atomic class refit did not queue every ship: " + success.message());'
          if text.count(old_message) != 1:
              raise SystemExit(f'expected one atomic success assertion, found {text.count(old_message)}')
          path.write_text(text.replace(old_message, new_message, 1), encoding='utf-8')
          PY
      - name: Compile project
        run: gradle clean classes --no-daemon
      - name: Validate atomic distributed transactions
        run: java -cp build/classes/java/main com.tndmadman.rts.AtomicRefitTransactionValidator
      - name: Validate existing distributed queues
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQueuePlannerValidator
      - name: Validate configured component authority
        run: java -cp build/classes/java/main com.tndmadman.rts.ConfiguredFitRuleValidator
      - name: Validate conversion quote persistence
        run: java -cp build/classes/java/main com.tndmadman.rts.RefitQuotePersistenceValidator
      - name: Run complete Gradle verification
        run: gradle build --no-daemon
      - name: Restore permanent workflows and commit
        run: |
          rm -f tools/apply_issue289_phase2b.py
          rm -f .github/workflows/apply-issue289-phase2b.yml
          rm -f sitecustomize.py
          git checkout origin/agent/issue-289-final-hardening -- .github/workflows/ci.yml
          cat > .github/workflows/java.yml <<'YAML'
          name: Java CI

          on:
            push:
              branches: [ main ]
            pull_request:
              branches: [ main ]

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: gradle/actions/setup-gradle@v4
                - run: gradle build
                - name: Validate configured fit rules
                  run: java -cp build/classes/java/main com.tndmadman.rts.ConfiguredFitRuleValidator
                - name: Validate refit quote persistence
                  run: java -cp build/classes/java/main com.tndmadman.rts.RefitQuotePersistenceValidator
                - name: Validate atomic distributed refits
                  run: java -cp build/classes/java/main com.tndmadman.rts.AtomicRefitTransactionValidator
                - name: Validate refitted module effects
                  run: java -cp build/classes/java/main com.tndmadman.rts.ShipModuleRefitValidator
                - name: Validate distributed refit queues
                  run: java -cp build/classes/java/main com.tndmadman.rts.RefitQueuePlannerValidator
                - name: Validate issue 289 lifecycle and authority
                  run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.Issue289CompletionValidator
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make distributed refits transactional"
          git push origin HEAD:agent/issue-289-final-hardening
