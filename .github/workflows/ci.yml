name: Clean validated auth branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: clean-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/server-scoped-password-verifiers

      - name: Restore normal repository files and squash
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          rm -f \
            .github/workflows/apply-server-scoped-auth.yml \
            tools/apply_server_scoped_auth_fix.py \
            tools/repair_auth_patcher.py \
            tools/apply_auth_test_compat_fix.py \
            tools/apply_session_recovery_auth_fix.py \
            tools/apply_connection_identity_auth_fix.py \
            tools/apply_tcp_multiplayer_auth_fix.py \
            tools/apply_admission_auth_fix.py \
            tools/apply_numeric_auth_fix.py \
            auth-patch.txt \
            compile-errors.txt \
            check-errors.txt \
            auth-usage-scan.txt

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "StarChem Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git reset --soft origin/main
          git add -A

          test -z "$(git diff --cached --name-only | grep -E '^(tools/apply_|tools/repair_auth_|auth-patch|compile-errors|check-errors|auth-usage-scan|\.github/workflows/apply-server-scoped-auth)' || true)"
          git diff --cached --quiet && { echo 'No source changes remain.' >&2; exit 1; }

          git commit -m "Scope player password verifiers to server identity"
          git push --force origin HEAD:agent/server-scoped-password-verifiers
