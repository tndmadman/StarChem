name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, validate, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply multi-batch ranking correction
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 301
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/tndmadman/rts/ProductionPlanner.java')
          text = path.read_text(encoding='utf-8')
          old_candidate = '''            RecipeEvaluation candidate = new RecipeEvaluation(
                    new RecipeChoice(item, station),
                    ledgerCanCover(ledger, batchCost),
                    candidateAnalysis.blocker.isBlank(),
                    candidateAnalysis.shortages.size(),
                    shortageAmount(candidateAnalysis),
                    item.timeSeconds * batches,
                    order);'''
          new_candidate = '''            boolean unblocked = candidateAnalysis.blocker.isBlank();
            boolean fullyAchievable = unblocked && candidateAnalysis.shortages.isEmpty();
            RecipeEvaluation candidate = new RecipeEvaluation(
                    new RecipeChoice(item, station),
                    fullyAchievable,
                    ledgerCanCover(ledger, item.requiredResources),
                    unblocked,
                    candidateAnalysis.shortages.size(),
                    shortageAmount(candidateAnalysis),
                    item.timeSeconds * batches,
                    order);'''
          old_record = '''    private record RecipeEvaluation(RecipeChoice choice, boolean immediatelyFundable,
                                    boolean unblocked, int shortageKinds, double shortageAmount,
                                    double productionSeconds, int order)
            implements Comparable<RecipeEvaluation> {
        @Override
        public int compareTo(RecipeEvaluation other) {
            int result = Boolean.compare(other.immediatelyFundable, immediatelyFundable);
            if (result != 0) return result;
            result = Boolean.compare(other.unblocked, unblocked);'''
          new_record = '''    private record RecipeEvaluation(RecipeChoice choice, boolean fullyAchievable,
                                    boolean immediatelyFundable, boolean unblocked, int shortageKinds,
                                    double shortageAmount, double productionSeconds, int order)
            implements Comparable<RecipeEvaluation> {
        @Override
        public int compareTo(RecipeEvaluation other) {
            int result = Boolean.compare(other.fullyAchievable, fullyAchievable);
            if (result != 0) return result;
            result = Boolean.compare(other.immediatelyFundable, immediatelyFundable);
            if (result != 0) return result;
            result = Boolean.compare(other.unblocked, unblocked);'''
          changed = False
          if old_candidate in text:
              text = text.replace(old_candidate, new_candidate, 1)
              changed = True
          elif new_candidate not in text:
              raise SystemExit('Expected candidate ranking block was not found')
          if old_record in text:
              text = text.replace(old_record, new_record, 1)
              changed = True
          elif new_record not in text:
              raise SystemExit('Expected recipe evaluation block was not found')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- src/main/java/com/tndmadman/rts/ProductionPlanner.java; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main/java/com/tndmadman/rts/ProductionPlanner.java
            git commit -m 'Fix incremental multi-batch recipe ranking'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify project
        run: gradle clean check jar --no-daemon

      - name: Validate canonical endpoint identity
        run: java -cp build/classes/java/main com.tndmadman.rts.SessionEndpointIdentityValidator

      - name: Validate authenticated numeric commands
        run: java -cp build/classes/java/main com.tndmadman.rts.NumericCommandValidationValidator authenticated

      - name: Validate authoritative numeric repair
        run: java -cp build/classes/java/main com.tndmadman.rts.NumericCommandValidationValidator repair

      - name: Validate numeric serialization boundaries
        run: java -cp build/classes/java/main com.tndmadman.rts.NumericCommandValidationValidator serialization

      - name: Validate authoritative mining commands
        run: java -cp build/classes/java/main com.tndmadman.rts.MiningCommandValidationValidator

      - name: Smoke-test Linux headless server
        shell: bash
        run: |
          set -euo pipefail
          PORT=50080
          LOG=build/headless-server.log
          SAVE_DIR=build/headless-smoke-saves
          rm -rf "$SAVE_DIR"

          java -Djava.awt.headless=true -jar build/libs/StarChem.jar \
            --server "$PORT" \
            --name CI-Server \
            --save-dir "$SAVE_DIR" \
            --save-name smoke \
            --new-world >"$LOG" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in {1..100}; do
            if grep -Fq 'Dedicated server ready.' "$LOG"; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$LOG"
              echo 'Headless server exited before becoming ready.' >&2
              exit 1
            fi
            sleep 0.1
          done

          if [[ "$READY" -ne 1 ]]; then
            cat "$LOG"
            echo 'Headless server did not become ready.' >&2
            exit 1
          fi
          grep -Fq "TCP $PORT" "$LOG"

          kill -TERM "$SERVER_PID"
          (
            sleep 10
            kill -KILL "$SERVER_PID" 2>/dev/null || true
          ) &
          WATCHDOG_PID=$!

          set +e
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          trap - EXIT

          cat "$LOG"
          if [[ "$SERVER_STATUS" -ne 0 && "$SERVER_STATUS" -ne 143 ]]; then
            echo "Unexpected headless server exit status: $SERVER_STATUS" >&2
            exit 1
          fi
          grep -Fq 'Dedicated server stopped.' "$LOG"

      - name: Verify overridden release identity
        shell: bash
        run: |
          SAMPLE_VERSION="9.8.7-ci"
          SAMPLE_COMMIT="0123456789abcdef0123456789abcdef01234567"

          gradle clean verifyBuildMetadata --no-daemon \
            -PreleaseVersion="$SAMPLE_VERSION" \
            -PbuildCommit="$SAMPLE_COMMIT"

          test -f build/libs/StarChem.jar
          VERSION_OUTPUT="$(java -jar build/libs/StarChem.jar --version)"
          echo "$VERSION_OUTPUT"
          [[ "$VERSION_OUTPUT" == "StarChem ${SAMPLE_VERSION} (${SAMPLE_COMMIT:0:12})" ]]
