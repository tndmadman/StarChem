name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-auth-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/server-scoped-password-verifiers
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply asserted patch
        run: |
          python3 tools/repair_auth_patcher.py
          python3 tools/apply_server_scoped_auth_fix.py
      - name: Run project verification
        id: verify
        shell: bash
        run: |
          set +e
          gradle clean check jar --no-daemon > check.log 2>&1
          STATUS=$?
          cat check.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish verification diagnostic
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp check.log check-errors.txt
          git config user.name "StarChem Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f check-errors.txt
          git commit -m "Record server-scoped auth verification failure"
          git push origin HEAD:agent/server-scoped-password-verifiers
          exit 1
