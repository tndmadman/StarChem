name: Diagnose shutdown smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-final-save-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: gradle clean check jar --no-daemon

      - name: Capture shutdown diagnostics
        shell: bash
        run: |
          set -uo pipefail
          PORT="$(python3 - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"
          LOG=build/shutdown-smoke-diagnostic.log
          SAVE_DIR=build/shutdown-smoke-diagnostic-saves
          rm -rf "$SAVE_DIR"

          java -Djava.awt.headless=true -jar build/libs/StarChem.jar \
            --server "$PORT" --name Diagnostic-Server \
            --save-dir "$SAVE_DIR" --save-name smoke --new-world >"$LOG" 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in {1..120}; do
            if grep -Fq 'Dedicated server ready.' "$LOG"; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 0.1
          done

          SIGNAL_SENT=0
          SERVER_STATUS=999
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            kill -TERM "$SERVER_PID"
            SIGNAL_SENT=1
            (
              sleep 15
              kill -KILL "$SERVER_PID" 2>/dev/null || true
            ) &
            WATCHDOG_PID=$!
            set +e
            wait "$SERVER_PID"
            SERVER_STATUS=$?
            set -e
            kill "$WATCHDOG_PID" 2>/dev/null || true
            wait "$WATCHDOG_PID" 2>/dev/null || true
          else
            set +e
            wait "$SERVER_PID"
            SERVER_STATUS=$?
            set -e
          fi

          CLEAN_MESSAGE=0
          grep -Fq 'Dedicated server stopped.' "$LOG" && CLEAN_MESSAGE=1
          {
            echo "ready=$READY"
            echo "signal_sent=$SIGNAL_SENT"
            echo "server_status=$SERVER_STATUS"
            echo "clean_message=$CLEAN_MESSAGE"
            echo "--- server log ---"
            cat "$LOG"
          } > .github/shutdown-smoke-diagnostic.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          rm .github/workflows/diagnose-shutdown-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/shutdown-smoke-diagnostic.txt .github/workflows/diagnose-shutdown-smoke.yml
          git commit -m "Record shutdown smoke diagnostics"
          git push origin HEAD:agent/fix-final-save-shutdown
