name: Issue 385 Finish Validation

on:
  push:
    branches: [ issue-385-visual-definition-finish ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: gradle classes
      - name: Validate authored ships
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ShipVisualValidator
      - name: Validate authored stations
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.StationVisualIdentityValidator
      - name: Validate station presentation
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.StationPresentationValidator
      - name: Validate celestial rendering
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.CelestialRenderValidator
      - name: Validate space backgrounds
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.Issue391SpaceBackgroundValidator
      - name: Validate render performance
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.RenderPerformanceValidator
      - name: Validate rules
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.RulesValidator
      - name: Validate save compatibility
        run: java -Djava.awt.headless=true -cp build/classes/java/main com.tndmadman.rts.ServerSaveStoreValidator
