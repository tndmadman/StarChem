name: Resplit fit source archive

on:
  push:
    branches:
      - agent/issue-289-loadouts
    paths:
      - .github/workflows/resplit-fit-source.yml

permissions:
  contents: write

jobs:
  resplit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild small source chunks
        run: |
          cat .tmp-fit-source/part-* > /tmp/starchem-fit-source.tgz
          rm -f .tmp-fit-source/part-*
          split -b 24k -d -a 3 /tmp/starchem-fit-source.tgz .tmp-fit-source/part-
          find .tmp-fit-source -maxdepth 1 -type f -printf '%f\n' | sort > .tmp-fit-source/manifest.txt
      - name: Commit small chunks and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .tmp-fit-source
          git rm .github/workflows/resplit-fit-source.yml
          git commit -m "Resplit temporary fit source archive"
          git push
