name: Observer Session Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-session-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile project
        run: gradle classes --no-daemon
      - name: Validate observer sessions
        run: java -Djava.awt.headless=true -cp build/classes/java/main:build/resources/main com.tndmadman.rts.ObserverSessionValidator
