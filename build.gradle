plugins {
    id 'application'
}

group = 'com.tndmadman'

def releaseVersion = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('STARCHEM_VERSION'))
        .orElse('0.1.5-dev')
        .get()
def buildCommit = providers.gradleProperty('buildCommit')
        .orElse(providers.environmentVariable('GITHUB_SHA'))
        .orElse('unknown')
        .get()

version = releaseVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.tndmadman.rts.App'
}

tasks.register('validateRules', JavaExec) {
    group = 'verification'
    description = 'Validate StarChem rules and config files.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.RulesValidator'
}

tasks.register('validateProductionQueues', JavaExec) {
    group = 'verification'
    description = 'Validate station production queue behavior.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.ProductionQueueValidator'
}

tasks.register('validateDevAccess', JavaExec) {
    group = 'verification'
    description = 'Validate remote developer-access authorization.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.DevAccessPolicyValidator'
}

tasks.register('validateClientLaunch', JavaExec) {
    group = 'verification'
    description = 'Validate client join arguments.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.ClientLaunchValidator'
}

tasks.register('validateGalaxyConnectivity', JavaExec) {
    group = 'verification'
    description = 'Validate solo galaxy generation and wormhole travel.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.GalaxyConnectivityValidator'
}

tasks.register('validateRuleIds', JavaExec) {
    group = 'verification'
    description = 'Validate rejection of unknown ship and station rule IDs.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.RuleIdValidationValidator'
}

tasks.register('validateNetworkSecurity', JavaExec) {
    group = 'verification'
    description = 'Validate UDP endpoint, ACK, and chunk security.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.NetworkSecurityValidator'
}

tasks.register('validateSnapshotHardening', JavaExec) {
    group = 'verification'
    description = 'Validate strict and atomic snapshot processing.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.SnapshotHardeningValidator'
}

tasks.register('validateSessionRecovery', JavaExec) {
    group = 'verification'
    description = 'Validate disconnect grace periods, endpoint rebinding, and client session recovery.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.SessionRecoveryValidator'
}

tasks.register('validateNpcSystemIsolation', JavaExec) {
    group = 'verification'
    description = 'Validate per-system NPC timers, faction scope, and runtime cleanup.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.NpcSystemIsolationValidator'
}

tasks.named('jar') {
    archiveFileName = 'StarChem.jar'
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'StarChem',
                'Implementation-Version': project.version.toString(),
                'Build-Commit': buildCommit
        )
    }
}

tasks.register('verifyBuildMetadata') {
    group = 'verification'
    description = 'Verify the stable JAR name and embedded version metadata.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (jarFile.name != 'StarChem.jar') {
            throw new GradleException("Unexpected release JAR name: ${jarFile.name}")
        }
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def attributes = jar.manifest.mainAttributes
            def actualVersion = attributes.getValue('Implementation-Version')
            def actualCommit = attributes.getValue('Build-Commit')
            if (actualVersion != project.version.toString()) {
                throw new GradleException("JAR version ${actualVersion} does not match project version ${project.version}")
            }
            if (actualCommit != buildCommit) {
                throw new GradleException("JAR commit ${actualCommit} does not match build commit ${buildCommit}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateRules')
    dependsOn tasks.named('validateProductionQueues')
    dependsOn tasks.named('validateDevAccess')
    dependsOn tasks.named('validateClientLaunch')
    dependsOn tasks.named('validateGalaxyConnectivity')
    dependsOn tasks.named('validateRuleIds')
    dependsOn tasks.named('validateNetworkSecurity')
    dependsOn tasks.named('validateSnapshotHardening')
    dependsOn tasks.named('validateSessionRecovery')
    dependsOn tasks.named('validateNpcSystemIsolation')
    dependsOn tasks.named('verifyBuildMetadata')
}

distributions {
    main {
        contents {
            from('config') {
                into 'config'
            }
            from('README.md')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
