plugins {
    id 'application'
}

group = 'com.tndmadman'

def releaseVersion = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('STARCHEM_VERSION'))
        .orElse('0.1.5-dev')
        .get()
def buildCommit = providers.gradleProperty('buildCommit')
        .orElse(providers.environmentVariable('GITHUB_SHA'))
        .orElse('unknown')
        .get()

version = releaseVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.tndmadman.rts.App'
}

