plugins {
    id 'application'
}

group = 'com.tndmadman'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.tndmadman.rts.App'
}

tasks.register('validateRules', JavaExec) {
    group = 'verification'
    description = 'Validate StarChem rules and config files.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.RulesValidator'
}

tasks.register('validateProductionQueues', JavaExec) {
    group = 'verification'
    description = 'Validate station production queue behavior.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.ProductionQueueValidator'
}

tasks.register('validateDevAccess', JavaExec) {
    group = 'verification'
    description = 'Validate remote developer-access authorization.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.DevAccessPolicyValidator'
}

tasks.register('validateClientLaunch', JavaExec) {
    group = 'verification'
    description = 'Validate remote client launchers and join arguments.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.ClientLaunchValidator'
}

tasks.register('validateGalaxyConnectivity', JavaExec) {
    group = 'verification'
    description = 'Validate solo galaxy generation and wormhole travel.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.GalaxyConnectivityValidator'
}

tasks.named('check') {
    dependsOn tasks.named('validateRules')
    dependsOn tasks.named('validateProductionQueues')
    dependsOn tasks.named('validateDevAccess')
    dependsOn tasks.named('validateClientLaunch')
    dependsOn tasks.named('validateGalaxyConnectivity')
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

distributions {
    main {
        contents {
            from('config') {
                into 'config'
            }
            from('README.md')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
