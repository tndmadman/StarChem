plugins {
    id 'application'
}

group = 'com.tndmadman'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.tndmadman.rts.App'
}

tasks.register('validateRules', JavaExec) {
    group = 'verification'
    description = 'Validate StarChem rules and config files.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tndmadman.rts.RulesValidator'
}

tasks.named('check') {
    dependsOn tasks.named('validateRules')
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

distributions {
    main {
        contents {
            from('config') {
                into 'config'
            }
            from('README.md')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
