tasks.named('jar') {
    archiveFileName = 'StarChem.jar'
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'StarChem',
                'Implementation-Version': project.version.toString(),
                'Build-Commit': buildCommit
        )
    }
}

tasks.register('verifyBuildMetadata') {
    group = 'verification'
    description = 'Verify the stable JAR name and embedded version metadata.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (jarFile.name != 'StarChem.jar') {
            throw new GradleException("Unexpected release JAR name: ${jarFile.name}")
        }
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def attributes = jar.manifest.mainAttributes
            def actualVersion = attributes.getValue('Implementation-Version')
            def actualCommit = attributes.getValue('Build-Commit')
            if (actualVersion != project.version.toString()) {
                throw new GradleException("JAR version ${actualVersion} does not match project version ${project.version}")
            }
            if (actualCommit != buildCommit) {
                throw new GradleException("JAR commit ${actualCommit} does not match build commit ${buildCommit}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateRules')
    dependsOn tasks.named('validateProductionQueues')
    dependsOn tasks.named('validateDevAccess')
    dependsOn tasks.named('validateClientLaunch')
    dependsOn tasks.named('validateGalaxyConnectivity')
    dependsOn tasks.named('validateRuleIds')
    dependsOn tasks.named('validateNetworkSecurity')
    dependsOn tasks.named('validateSnapshotHardening')
    dependsOn tasks.named('validateSessionRecovery')
    dependsOn tasks.named('validateNpcSystemIsolation')
    dependsOn tasks.named('validateMaterialCoverage')
    dependsOn tasks.named('validateSystemControl')
    dependsOn tasks.named('validateGalaxyMapWire')
    dependsOn tasks.named('validateSystemModifiers')
    dependsOn tasks.named('validateNpcGalaxyDirector')
    dependsOn tasks.named('validateSystemSimulationScheduler')
    dependsOn tasks.named('validateClientEnvironmentSync')
    dependsOn tasks.named('verifyBuildMetadata')
}

distributions {
    main {
        contents {
            from('config') {
                into 'config'
            }
            from('README.md')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
