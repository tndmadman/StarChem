tasks.register('verifyLegalNotices') {
    group = 'verification'
    description = 'Verify the proprietary license and third-party notice files.'
    inputs.files('LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md')
    doLast {
        ['LICENSE', 'THIRD_PARTY_NOTICES.md'].each { path ->
            def noticeFile = project.file(path)
            if (!noticeFile.isFile() || noticeFile.length() == 0) {
                throw new GradleException("Missing or empty legal notice: ${path}")
            }
        }
        def licenseText = project.file('LICENSE').getText('UTF-8')
        if (!licenseText.contains('STARCHEM PROPRIETARY SOFTWARE LICENSE') ||
                !licenseText.contains('All rights reserved.')) {
            throw new GradleException('LICENSE does not contain the required proprietary notice')
        }
        def readmeText = project.file('README.md').getText('UTF-8')
        if (!readmeText.contains('StarChem is proprietary software.')) {
            throw new GradleException('README does not identify StarChem as proprietary software')
        }
    }
}

tasks.named('jar') {
    archiveFileName = 'StarChem.jar'
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'StarChem',
                'Implementation-Version': project.version.toString(),
                'Build-Commit': buildCommit
        )
    }
}

tasks.register('verifyBuildMetadata') {
    group = 'verification'
    description = 'Verify the stable JAR name, embedded build metadata, legal notices, and reported runtime identity.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (jarFile.name != 'StarChem.jar') {
            throw new GradleException("Unexpected release JAR name: ${jarFile.name}")
        }
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def attributes = jar.manifest.mainAttributes
            def actualVersion = attributes.getValue('Implementation-Version')
            def actualCommit = attributes.getValue('Build-Commit')
            if (actualVersion != project.version.toString()) {
                throw new GradleException("JAR version ${actualVersion} does not match project version ${project.version}")
            }
            if (actualCommit != buildCommit) {
                throw new GradleException("JAR commit ${actualCommit} does not match build commit ${buildCommit}")
            }
            ['META-INF/LICENSE', 'META-INF/THIRD_PARTY_NOTICES.md'].each { entryName ->
                if (jar.getJarEntry(entryName) == null) {
                    throw new GradleException("JAR is missing required legal notice: ${entryName}")
                }
            }
        }

        def javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get()
        def execution = providers.exec {
            commandLine javaLauncher.executablePath.asFile.absolutePath,
                    '-jar', jarFile.absolutePath, '--version'
            ignoreExitValue = true
        }
        def result = execution.result.get()
        if (result.exitValue != 0) {
            throw new GradleException("StarChem --version failed: ${execution.standardError.asText.get().trim()}")
        }
        def shortCommit = buildCommit == 'unknown' ? '' : buildCommit.take(12)
        def expectedIdentity = "StarChem ${project.version}" + (shortCommit.isBlank() ? '' : " (${shortCommit})")
        def actualIdentity = execution.standardOutput.asText.get().trim()
        if (actualIdentity != expectedIdentity) {
            throw new GradleException("Reported build identity '${actualIdentity}' does not match '${expectedIdentity}'")
        }
    }
}

